# ── CI 拆分批（2026-11-14）：本文件 = 主 CI（ci.yml）的 called 单元 ──────────
# static-gates job（matrix 三片） 自 ci.yml 逐字搬迁（步骤/注释裁定资产零改动），唯一机械变换 =
# 删跨文件无效的 `needs: build-artifacts` 行（时序由 caller 侧 needs 承接，
# 语义等价）。called job 与 caller 同 run 执行：artifact / cache /
# needs 红态传导 / github 上下文（event_name 等触发事件面）全同域。
# 编排与汇总（ci-summary）见 ci.yml；夜间哨兵见 nightly.yml。
name: CI static gates
on:
  workflow_call:
jobs:
  static-gates:
    # 二轮审阅 P2（2026-10-17）：红遮红治理——27 步单 job 串行，一步红
    # 后续全 skipped（surface 红曾遮 single_source/testcount 至 HEAD）。
    # 拆 matrix 三片（gates-wasm 2026-10-17 同款治理线）：gen=生成器新鲜
    # 度 / contract=结构契约与卫生 / bookkeeping=需 moon test 的对账闸。
    # 步骤级 if 路由（setup 三片共享），fail-fast 关保闸级可见性全开。
    name: Static gates (${{ matrix.slice }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: gen
          - slice: contract
          - slice: bookkeeping
    steps:
      - uses: actions/checkout@v4
      # #273 接线批（2026-10-24）：gen/contract slice 已跑 .mts 闸
      # （教学线 teaching_* / host_contract_map / icon_catalog / diff_ledger）——
      # node 版本走 .node-version 单点（type stripping 需 ≥22.18；不 pin 会随
      # runner 预装版本漂移，绿灯不可复现）。

      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install MoonBit toolchain (probe / fmt / facts --run)
        uses: ./.github/actions/setup-moonbit

      - name: Refresh MoonBit registry index
        # toolchain_probe 的索引预检需要 registry 索引在位（fresh 环境同 core）
        shell: bash
        run: cd moonbit && moon update


      # ── gen_api_help rules.json（#125 收尾，2026-10-15）───────────
      # gen_api_help 内容批收敛（rules.json ≡ 原 .json.mbt 零漂移）后随
      # jsonmbt 退场翻转出库——scripts 侧 .json.mbt 清零，本 job 的
      # .json.mbt static gate 步随之摘除（moon 需求由差分驱动内嵌
      # moon run 承担，工具链安装保留）。

      - name: Teaching assets gen gate (#125 批 A——C 解析器自举)

        if: matrix.slice == 'gen'
        # 真源 = moonbit/teaching/content/*.md（md+.c 唯一真源入包）；
        # content_parser.c 由 vitro 编译运行（自己吃自己狗粮——引擎侧资产链
        # 自举，#128 裁定确认此即「生成器产 .mbt」实现路径）。产物经 moon fmt
        # 后与入库 _gen.mbt 逐字节比对（数组换行形态以 fmt 为准）。
        # 旧「Teaching assets JSON sync gate」（jsonmbt build + 教师 .json 同步）
        # 随批 A 出库退役——jsonmbt 对教学三张的调用归零。
        shell: bash
        run: |
          set -e
          cd moonbit && moon build --release --target js cmd/vitro_js && cd ..
          node scripts/teaching_gen_check/main.mts
          node scripts/teaching_reconcile/main.mts

      - name: Catalog closure gate (#256/#261——诊断码↔教学卡双向闭合)

        if: matrix.slice == 'gen'
        # 两套清单（error_codes.json 臂 + catalog.json 卡）各自演进的缺口由
        # 此闸机判拦截：R1 正向=引擎可产码无卡（下游按码查卡落空）；R2 反向
        # =卡零生产点（下游预渲染错误清单混入死码）；R3 同号异前缀撞键防
        # （catalog 数字键）；R4 幽灵卡；R5 白名单僵尸条目。规则外置
        # scripts/catalog_closure/rules.json（条目带 reason，白名单是债）。
        # 生产点扫描两形态：[EWH]\d{4}_变体引用（诊断面枚举构造）+ "E\d{4}"
        # 字面量（trap 面 #261 带码文案/trap_code 赋值）；排除 _build/_gen/测试面。
        shell: bash
        run: |
          set -e
          node scripts/catalog_closure/main.mts

      - name: Source hygiene (tracked files must be NUL-free)

        if: matrix.slice == 'contract'
        # P2-NUL 事故族（2026-09-23 修复批）：真 NUL 让 git 判二进制
        # （w/-text）——.gitattributes 行尾转换失效、diff/PR 审阅不可见
        # （先例：docs/** 148 行事故族；host_test.mbt 15KB 整文件不可见；
        # 冻结区 vitro_lexer/src/string.rs 索引侧潜伏 i/-text）。J9 证红留痕。
        shell: bash
        run: node scripts/moonbit/source_hygiene/main.mts

      - name: Rust narrative check (dead native/ refs / zombie 照搬不修 / stale 与 Rust 对齐)

        if: matrix.slice == 'contract'
        # 审阅 v2 批 A7'（2026-11-02，R1b §⑥ 口径固化）：Rust 对照区删区后手写源码
        # 注释的三类叙事病——R1 死路径裸引 / R2 照搬不修僵尸义务 / R3 与 Rust 对齐
        # 失实背书——把 #47 批五三件套（历史出处 + tag 可回溯 + 自主基线）机判化。
        # 规则外置 scripts/rust_narrative_check/rules.json；存量过闸 exemptions.json
        # 三向对账（漏登记/僵尸例外红）。J9：建闸红 54（R1 35/R2 6/R3 13）→清注后绿。
        shell: bash
        run: node scripts/rust_narrative_check/main.mts -check

      - name: Bytecode libc data generation idempotency

        if: matrix.slice == 'gen'
        # 批四号（2026-09-26）：libc 产物派生闸——Rust include_str! 的
        # JSON 是单一真相源，本闸保证 MoonBit 数据字面量与其一致
        # （生成流程内置 moon fmt + check 同流程比对；J9 篡改证红）。
        shell: bash
        run: node scripts/moonbit/gen_libc_data/main.mts -check

      - name: MoonBit generated-artifact freshness (gen_diag / gen_host_route / gen_stubs)

        if: matrix.slice == 'gen'
        # 2026-09-23 审阅批接线（S6 审阅 P5）：三个生成器（diag 码表 /
        # host 路由表 / 标准库存根表）此前均无 CI 步骤——产物被手改或
        # 源变更后未再生成，只能靠人跑 -check 才发现（S6 批的 host_func_id_gen
        # 自 codegen 上提 bytecode 即高风险期）。三脚本均内置 moon fmt 且
        # -check 无写副作用；J9 证红：gen_host_route 注入 HOST_ACOS 常量值改写
        # 必红（本批实测）、gen_stubs 注入篡改注释必红（本批实测）、gen_diag
        # 四雷证红已在先例留痕。前置修复：gen_stubs 原手工只认 --check 且
        # 生成输出未过 fmt（干净仓库上 --check 必红）——本批改为 flag 包 +
        # 内置 fmt 后方可入闸。
        shell: bash
        run: |
          node scripts/moonbit/gen_diag/main.mts -check
          node scripts/moonbit/gen_host_route/main.mts -check
          node scripts/moonbit/gen_stubs/main.mts -check
          node scripts/moonbit/gen_protocol_fields/main.mts -check
          node scripts/moonbit/gen_diagnostics/main.mts -check
          # #27 图标资产双闸（2026-10-07 挂入）：gen_icons -check 锁几何层
          # 与真源 svg 同步；icon_catalog 判定契约（viewBox/stroke/白名单/
          # tsv 对账/digest）。-check 均无写副作用，J9 11 种契约变异证红
          # 已在 c3601055 资产批留痕。
          node scripts/gen_icons/main.mts -check
          node scripts/icon_catalog/main.mts
      - name: MoonBit API surface audit (unpublished pkgs contracted)

        if: matrix.slice == 'contract'
        # 2026-09-21 S5 收尾批接线：对外面闸（架构审阅 v2 待办①——"面会
        # 自动再长，先立闸再加 priv"）。moonbit_surface -check 对账白名单
        # （scripts/surface_allowlist.txt）：无跨包消费的 pub 符号必须收面
        # 或入白名单（已发布 5 包走版本化弃期、类型闭包保留）。
        shell: bash
        # #292 终局批：Go 版已删；双轨对拍闸同批退役（等价性证据 = 冻结 golden/sha 基线自证）
        run: node scripts/moonbit/moonbit_surface/moonbit_surface.mts -check

      - name: MoonBit package dependency direction (L0-L9 layering + acyclic)

        if: matrix.slice == 'contract'
        # 2026-09-22 S5 收尾批接线（架构审阅 v2 A 组 #6）：总计划 §4 的硬
        # 约束「依赖严格单向无环」此前**零 CI 校验**——越层或成环的依赖可
        # 静默进来（口头纪律）。本步按外置分层表（rules.json，源 = 总计划
        # §4 L0–L9）断言每个模块内依赖 go 向低层或同层，并 DFS 查环；
        # 新包未登记分层即红，解析出 0 包/0 依赖亦红（空集不得绿）。
        # cmd/* 为工具层豁免方向检查。J9 证红已留痕（注入 opcode→bytecode
        # 同时触发越层与成环两条判据）。
        shell: bash
        run: node scripts/moonbit/pkg_deps/main.mts -check

      - name: MoonBit interface-surface sync (moon info no-drift)

        if: matrix.slice == 'contract'
        # 2026-09-22 S5 收尾批接线：.mbt（实现）与 pkg.generated.mbti（接口
        # 面）的一致性此前纯靠人工跑 moon info——本仓已漏过一次（libc 的
        # .mbti 缺 type LibcSig，下轮才补登）。moon info 无 --check 子命令
        # （实测 moon 0.1.20260920），故取「跑前后快照 sha256 不变量」形态：
        # 不等即有 .mbti 与实现脱节（pub 面改了没同步 / 新包未生成 / 改坏）。
        # 0 个 .mbti 亦红（空集不得绿）。J9 证红：注入脱节内容必红。
        shell: bash
        run: node scripts/moonbit/mbti_sync/main.mts -check

      - name: Single-source-of-truth registry check

        if: matrix.slice == 'contract'
        # 2026-09-22 S5 收尾批接线（架构审阅 v2 A 组 #7 / 判据 C-04）：项目 L1
        # 判据「同一概念多真相来源」只覆盖**仓内同语言重复**，不覆盖跨语言
        # 孪生——迁移期每个单源在 MoonBit 侧都有一份孪生，同步义务纯人工
        # （"照搬不私改"）。本步把清单入版本控制并机判：enforced 条目的定义点
        # **文件集**必须等于 allowed_def_files（**多一份实现 = 红**，少一份 =
        # 单源被删/改名亦红）；registered 条目校验两侧声明路径存在。
        # 清单：scripts/moonbit/single_source/rules.json；J9 证红已留痕。
        shell: bash
        run: node scripts/moonbit/single_source/main.mts -check

      - name: libc single-source reconciliation (3 name tables)

        if: matrix.slice == 'contract'
        # 2026-09-22 S5 收尾批接线（S6 前置）：libc 放行判据在 Rust 侧是
        # host_func_id 路由名 ∪ BYTECODE_LIBC_ALL_FUNCS 索引名的并集，
        # MoonBit 侧照搬时手抄成 libc 包 builtin_all（175 名）——第四套
        # 真相源且零对账。实测已因此失真：libc.mbt 包注释断言「print_int
        # 不在此集（Rust host_func_id 无此名）」，而 Rust 侧 by_user_name
        # 明确有 `"print_int" | "__vitro_output" => Some(OUTPUT)` 别名臂。
        # 本步把「三表一致」变成机判红线（等式 + 交集计数 + PURE 子集 +
        # 空集不得绿）；规则外置 rules.json，J9 三路证红已留痕。
        shell: bash
        run: node scripts/moonbit/libc_single_source/main.mts -check

      - name: Fix-diffusion gates ×4 (twin fingerprint / cast matrix / conv specs / host shared guard)

        if: matrix.slice == 'contract'
        # 审阅 v2 批 A7（2026-11-02，R1a 处方 R1-R4 落地）：修复扩散面防扩散机判化
        # ——R1a 审计 11 起种子 + 新挖 F1-F10 共同形态 = 「修复只覆盖触发报告的那个
        # 成员，同构集合其余成员靠人肉记忆连坐」。四道静态闸各治一形态：
        #   twin_fingerprint  M1 孪生复制件（cast.mbt 两链 / dump 四家参数段）——
        #                     集内指纹差集逐条登记，单边改一份即红、修好忘删僵尸红
        #   cast_matrix       M2 对偶矩阵缺格——分支链 (T,S,u) 全组合求值抓零发射
        #                     （F1 float→LL 位模式直出当场可见）+ opcode CastX2Y 对偶
        #   conv_specs        M3 枚举表成员不全——printf/scanf 转换符四消费面 ↔
        #                     单源声明表逐字母对账（scanf %e 两面漂移 F3/F7 登记在册）
        #   host_shared_guard M4 函数族口径分叉——host_string 带 n 参数函数负域 trap
        #                     三态（memset F6 登记）+ json_escape/utf8 族消费方账实对账
        # 现行缺口（F1/F2/F3/F5/F6/F7/F9）均以 known/divergence 形态**公开登记**在各
        # rules.json（非豁免）——B 轮修复后条目变僵尸即红逼清账。J9：每闸 --selftest
        # 内存注入 3-4 路 + 盘上源码注入各 2-3 路全红（batch_A7_REPORT 留痕）。
        # 四闸纯静态源码解析，合计 <1s；三臂行为面见 cli_smoke slice 的 cli_symmetry。
        shell: bash
        run: |
          node scripts/moonbit/twin_fingerprint/main.mts -check
          node scripts/moonbit/cast_matrix/main.mts -check
          node scripts/moonbit/conv_specs/main.mts -check
          node scripts/moonbit/host_shared_guard/main.mts -check

      - name: Host route coverage (routes vs host impls)

        if: matrix.slice == 'contract'
        # P2-memchr 事故族（2026-09-23 修复批）：路由表中 memchr 整批
        # 漏实现——既有对账锚只校验「常量 ↔ 名字」双表一致，不校验
        # 「路由名 ↔ 有实现」。规则外置 host_route_rules.json（别名 /
        # vm 白名单，白名单双向对账防腐化）；J9 双路证红留痕。
        shell: bash
        run: node scripts/moonbit/host_route_coverage/main.mts

      - name: Host contract map (oracle 103 tests vs mb anchors, 3-state)

        if: matrix.slice == 'contract'
        # Host Contract 三态对账（总计划表 3，2026-10-04 建）：oracle
        # host_contract_tests.rs 103 条 ↔ MoonBit 锚（host/memory/vm 三包
        # wbtest 实测抽取）的 anchored/merged/missing 映射——判据：映射
        # 无洞（oracle 测试全部在表）+ 锚引用无陈旧；missing 非空提示不红
        # （补锚段清零后 --strict 收官）。纯文本抽取零 Rust 构建依赖，
        # 归 moonbit job 静态闸族。J9：--selftest 三锚 + 盘上删条目 HOLE 红
        # 留痕（2026-10-04 实测）。
        shell: bash
        run: |
          node scripts/host_contract_map/main.mts --selftest
          node scripts/host_contract_map/main.mts --strict

      - name: Protocol TS types freshness + schema doc parity

        if: matrix.slice == 'gen'
        # 2026-09-22 接线（架构审阅 v2 A 组 #9 / §7.5）：@vitro/protocol 的 TS
        # 类型从权威 MoonBit 源（moonbit/protocol/types.mbt，受 wbtest 字段锚守护——
        # S7 批四号起取代 Rust 源）生成，并与 moonbit/docs/spec 的 schema 表格
        # **双向对账**——任一方向不同步都红。
        # 这同时把「文档与实现是否一致」变成机器判据（此前无人守）。
        # 注意 §5 差分层（StepStreamBatch/StepPayloadDelta）未纳入：该节表格是
        # 压缩式，无法逐字段机判（已在 rules.json 登记）。
        shell: bash
        run: node scripts/gen_protocol_ts/main.mts -check

      - name: MoonBit test count (README vs moon test truth)

        if: matrix.slice == 'bookkeeping'
        # 五轮审阅流程漏洞封堵（2026-09-26）：测试数/文档数连坐靠人记，
        # facts check 结构上看不见「文档↔facts 一起错」（四轮里三次同型
        # 事故）。闸自跑 moon test 取实跑真值对账两份 README 的声明数——
        # v1 读 facts.json（cached 制品）是复述型，注入三方旧值不红（
        # 用户 J9 三层之第二层抓出）；v2 真值实跑。J9：篡改声明 ±1 红 /
        # 原缺陷场景（文档回旧值）红。
        shell: bash
        run: node scripts/moonbit/testcount/main.mts

      # ── MoonBit serve 行为闸族（serve exe 由本步骤链内构建）────────────
      # S7 批四号（2026-09-28）：双宿主对拍——同一请求表与断言集跑 MoonBit
      # cmd/serve；豁免面外置 moonbit_exemptions.json（step 族 S8 / 已登记
      # 分叉 / quarantine_budget 欠账，14 断言 + 3 整批，PASS 也豁免防僵尸
      # 条目）。首跑战果：抓到 config.set 未包 serve_ok 帧的一段真缺陷。
      # J9 双路证红：删豁免表 → fail loud exit 2；删单条目 → 该断言真红。
      - name: Difference ledger reconciliation (known whitelists ↔ ledger)

        if: matrix.slice == 'contract'
        # S8 批零号二段（2026-09-30）：差异台账守门规则机判化——
        # 三防线 known 白名单（shadow/clang_direct/vm_diff）与
        # scripts/diff_ledger/ledger.json 双向对账：台账 anchors 不得
        # 虚报（正向），防线新豁免一条分叉必须同步收编台账（反向——
        # 沉默漂移即红）；schema/枚举域/17 键 capability_flags 锁定同判。
        # --selftest 六路注入证红（J9）；shadow 真值为闸内清单
        # （shadow 未外置 JSON 是历史形态，外置化登记技术债随防线
        # 维护窗口——G-7 同族）。
        shell: bash
        run: node scripts/diff_ledger/main.mts --selftest && node scripts/diff_ledger/main.mts

      - name: Check Bytecode Libc precompiled artifacts are up-to-date

        if: matrix.slice == 'gen'
        # D5 后续批次第二站（2026-09-18）：precompile_bytecode_libc.py → Go。
        # 双轨对账：--check 双侧同判定（digest 逐字节一致）；重生成产物 JSON
        # 逐字节一致、.rs 仅头注指向 Go；J9 篡改源文件 → digest 失配 / exit 1。
        # 归 hygiene（2026-09-23）：红 = 改 C 源后忘了再生成——账没跟上，
        # 补 `node scripts/precompile_bytecode_libc/main.mts` + git add 即绿。
        run: node scripts/precompile_bytecode_libc/main.mts --check
        shell: bash

      - name: Vendored upstream drift probe (moonbitlang/x fs)

        if: matrix.slice == 'contract'
        # 2026-09-28 唯一依赖清除 B 路线批接线：moonbit/fs vendored 自
        # moonbitlang/x@0.5.5，上游是活仓库且实证发生过「内容漂移而
        # version 未 bump」（fs_native.mbt 的 utf8 迁移）——探针走内容哈希
        # 口径盯上游 main 四文件（版本号仅报告）。归 hygiene：红 = 上游
        # 漂移待人工评估（评估令非自动同步令——裁定权在人，处置流程见
        # docs/current/01-定位与路线/唯一依赖清除路线.md §3B-4）；
