<text class="tc" x="1038" y="338" text-anchor="middle">绑定 1 线程 · 1 会话</text>
<rect class="core" x="40" y="384" width="1130" height="68" rx="12"/>
<text class="t" x="605" y="414" text-anchor="middle">铁律：1 实例 = 1 线程 = 1 会话——同一实例不得跨线程并发调用</text>
<text class="tc" x="605" y="440" text-anchor="middle">实例内部保持单线程不是缺陷：判分确定性与 seek 回放可重放的来源</text>
<rect class="card" x="40" y="480" width="360" height="214" rx="12"/>
<text class="t" x="220" y="514" text-anchor="middle">浏览器（IBrowserHost · 终局）</text>
<text class="ts" x="220" y="548" text-anchor="middle">N × Web Worker</text>
<text class="tc" x="220" y="576" text-anchor="middle">Module 结构化克隆进各 worker</text>
<text class="tc" x="220" y="604" text-anchor="middle">各自 instantiate</text>
<text class="tc" x="220" y="632" text-anchor="middle">（编译一次 · 实例化 N 次）</text>
<text class="tc" x="220" y="660" text-anchor="middle">铁律硬度：结构性（worker 各持）</text>
<rect class="card" x="425" y="480" width="360" height="214" rx="12"/>
<text class="t" x="605" y="514" text-anchor="middle">Node</text>
<text class="ts" x="605" y="548" text-anchor="middle">worker_threads</text>
<text class="tc" x="605" y="576" text-anchor="middle">structuredClone 支持</text>
<text class="tc" x="605" y="604" text-anchor="middle">WebAssembly.Module 转移</text>
<text class="tc" x="605" y="632" text-anchor="middle">铁律硬度：结构性</text>
<rect class="card" x="810" y="480" width="360" height="214" rx="12"/>
<text class="t" x="990" y="514" text-anchor="middle">.NET 内嵌（Wasmtime）</text>
<text class="ts" x="990" y="548" text-anchor="middle">每线程独立 Store + Instance</text>
<text class="tc" x="990" y="576" text-anchor="middle">Module 编译一次（Send+Sync）</text>
<text class="tc" x="990" y="604" text-anchor="middle">每线程 Store::new + instantiate</text>
<text class="tc" x="990" y="632" text-anchor="middle">铁律硬度：类型系统强制</text>
<text class="tc" x="990" y="660" text-anchor="middle">Store 非 Sync：跨线程共享编译失败</text>
<text class="tc" x="60" y="740" text-anchor="start">边界（诚实记录）：宿主 import 面不在构造性隔离内——输出/输入通道由宿主提供，输出挂宿主全局（console / 单管道）会交错；</text>
<text class="tc" x="60" y="766" text-anchor="start">宿主须按实例绑定输出回调；serve 的 session id 概念平移，宿主只做帧路由。</text>
<text class="tc" x="60" y="798" text-anchor="start">容量参考：serve RSS 预算 64MB、实测峰值 ~24MB/会话——N 的上限由内存决定，不是并发正确性。</text>
<text class="tc" x="60" y="830" text-anchor="start">实证缺口：同进程 N 实例并发互不干扰尚无实测记录（拍板生效前补锚）· wasm32 现产冒烟 3.75MB 即具备全部并发性质。</text>
<text class="tc" x="600" y="862" text-anchor="middle">对账 wasm多实例并发模型与U2拍板.md §1–§2 · 漂移重生成：go run ./scripts/gen_svg wasm</text>
