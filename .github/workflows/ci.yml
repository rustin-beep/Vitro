      - name: CI checklist (存在即接入注册表——scripts 驱动集 ↔ ci.yml 活行集双向对账)

        if: matrix.slice == 'contract'
        # msime run-checks 形态 Vitro 化（2026-10-11 #71 防线续批）：
        # 漏登记（驱动存在零活行——libc_boot 断供类红的事前形态）/ 悬空
        #（活行引用不存在的驱动）/ 僵尸例外 三向红；例外表 exceptions.json
        # 每条 reason 必填自证。J9 三向证红在案。
        shell: bash
        run: node scripts/ci_checklist/main.mts

      - name: Agent skills frontmatter audit (install_skills --list)

        if: matrix.slice == 'contract'
        # 2026-09-29 skills 图批接线：.agents/skills/ 的 SKILL.md 此前只有本地
        # 校验（脚本存在 ≠ 接线）。--list 对每个 skill 做 fail loud 校验：缺
        # SKILL.md / frontmatter 缺 name 或 description / name 与目录名不一致
        # → exit 1。与 gen_svg -check（skills 图失步即红）构成双闸——前者挡
        # 结构坏，后者挡「AI 改了手册而清单图没跟上」。
        # J9 证红：删任一 SKILL.md 的 name 行 → 必红。
        shell: bash
        run: node .agents/install_skills.mts --list

      - name: install_skills .mts selftest (node:test + tsc strict + oxlint)
        # #273 迁移批：安装器 .mts 四件套面（frontmatter fail loud 三形态 +
        # discover 排序 + diffOne 四态）。cwd=仓库根——node --test / oxlint
        # 均不接受含 .. 的相对路径，scripts/ 清单外单步验证（bin 走
        # scripts/node_modules/.bin，严格档参数与 scripts/tsconfig.json 对齐）。
        # npm ci 前置：static-gates 三片 matrix 此前无依赖安装步（首跑实锤
        # exit 127——node_modules 不入 git，scripts 的 bin 在此 job 首次消费）。
        shell: bash
        run: |
          cd scripts && npm ci --no-audit --no-fund
          cd ..
          node --test .agents/install_skills.test.mts
          scripts/node_modules/.bin/tsc --ignoreConfig --noEmit --strict --strictNullChecks --noUncheckedIndexedAccess --noImplicitOverride --noFallthroughCasesInSwitch --target es2023 --module nodenext --moduleResolution nodenext --types node --typeRoots scripts/node_modules/@types --allowImportingTsExtensions --skipLibCheck --forceConsistentCasingInFileNames .agents/install_skills.mts .agents/install_skills.test.mts
          scripts/node_modules/.bin/oxlint .agents/install_skills.mts .agents/install_skills.test.mts

      # G11（R4）：工程健康度看板（生产 unwrap 计数/超长文件/失败记录口径），
      # 报告上传 artifact；阈值门禁待阈值基线固化后启用
      # 2026-10-05 修复：windows runner 上 unix.sh 报 Unsupported platform:
      # MINGW64_NT-10.0-26100（runner 内核升级后 uname 形态被安装脚本拒绝；
      # 此步未指定 shell 走 pwsh，curl|bash 撞平台检测）——改走 Windows 官方
      # powershell 安装（与上方 differential anchors 步同款、shell 显式）
  hygiene:
    name: Hygiene (fmt & four-target tests & toolchain)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 2026-10-23 提速批：Go vet/test 从 build job 迁来——测试红归 hygiene，
      # build 只负责产物，避免「测试红 → artifact 不产出 → 下游全 skipped」。
      - name: Go vet (scripts)
        run: go vet ./scripts/...
      - name: Go test (scripts)
        run: go test ./scripts/...
      # P3-3（2026-10-30 处置批）保险丝：「内联安装清零」原是一次性计数无闸
      # 把守（ci_checklist 只扫 scripts/ 包）——下一个 job 照抄三行内联安装
      # 会静默复活。断言：workflows 目录零内联安装（动词锚定 irm|curl + 域名
      # ——正则形态防自噬：本步自身只以字面量形态携带域名，不被命中；唯一
      # 合法实现点 = .github/actions/setup-moonbit 双形态）。
      # 诊断版（首红 run 41042777552 复盘：本地 Git Bash/WSL/脚本逐字节三路
      # 复刻皆绿、merge ref 文件等价——环境因子未定位，故 fail 时全量证据
      # 打印 + 计数为空显式红，两路径可分辨）。
      - name: Workflow install convergence (no inline moon installs)
        shell: bash
        run: |
          # 修复注（run 41045815814 定案）：GitHub 的 shell:bash 默认 -eo
          # pipefail，而 grep 零命中（=本断言的**正确态**）退出码为 1
          # ——管道被 pipefail 判死、-e 杀 step ⇒ 零命中必红（本地裸 bash
          # 无此二旗故三路复刻皆绿）。修法：grep/管道组内一律 `|| true`
          # 消退出码，判定只认变量内容（2026-11-01 S13b-P4 白名单升格后
          # 从「awk 汇总计数」改为「$bad 非空即红」）。
          echo "== workflows/actions 目录清单："; ls -1 .github/workflows/ .github/actions/
          # 收敛判据 = 域名出现位置白名单断言（2026-11-01 审阅 v2 S13b-P4 升格）：
          # 原形态只锚 irm|curl 两个动词且只扫 workflows/——iwr/Invoke-WebRequest/
          # wget 形态与 .github/actions/ 新建 composite action 内联安装均漏网。
          # 白名单断言与动词无关：moon 安装域字面量在 .github/ 下的任何出现
          # （含注释——防「注释贴安装命令被人照抄」，即本保险丝使命）必须
          # 位于 .github/actions/setup-moonbit/（唯一合法实现点）之内。
          # DOM 拆串写法 = 防自咬：grep 命令行若含完整域名字面量，本步扫
          # ci.yml 自身时必命中自己（首次接线即实测自咬）。
          DOM="cli.moonbitlang".com
          hits=$({ grep -rnF "$DOM" .github/ || true; })
          echo "-- 域名字面量全量出现："
          if [ -n "$hits" ]; then echo "$hits"; else echo "（零字面量命中）"; fi
          # fail-open 封堵 + 正向锚（PR #416 审阅 P2-1，2026-11-02）：白名单升格时删掉了原
          # `n 为空即红` 保护——grep 目标目录不存在/grep 异常时 hits 空 ⇒ bad 空 ⇒ 恒绿
          # （探针实锤）。且原断言只防「外溢」不防「锚点丢失」：唯一合法点的域名被改
          # （换 CDN/改命令）照样绿。两层：① hits 空即红；② setup-moonbit 内至少一处命中。
          if [ -z "$hits" ]; then
            echo "::error::moon 安装域字面量在 .github/ 下零命中——grep 异常或 setup-moonbit 锚点丢失（唯一合法实现点必须含安装域）"
            exit 1
          fi
          good=$({ echo "$hits" | grep '^\.github/actions/setup-moonbit/' || true; })
          if [ -z "$good" ]; then
            echo "::error::setup-moonbit 内零命中（安装域被改/实现点迁移）——正向锚失守，先对齐 .github/actions/setup-moonbit 再改本断言"
            exit 1
          fi
          bad=$({ echo "$hits" | grep -v '^\.github/actions/setup-moonbit/' || true; })
          if [ -n "$bad" ]; then
            echo "::error::setup-moonbit 之外发现 moon 安装域引用（任意动词形态均算——收敛到 .github/actions/setup-moonbit 的 uses 引用）："
            echo "$bad"
            exit 1
          fi
          echo "convergence OK: moon 安装域唯一且确实出现在 setup-moonbit（$(echo "$good" | grep -c .) 处）"
      - name: Install MoonBit toolchain
        uses: ./.github/actions/setup-moonbit

      - name: MoonBit toolchain health probe (A8 automation)
        # 2026-09-21 E-06 窄增量：工具链故障显式化（版本锁定/索引预检/
        # F8 ICE 特征/退出码 fail loud）。归 hygiene（2026-09-23 用户裁定）：
        # 工具链追新是既定策略（MoonBit 未到 1.0，breaking 跟着走），版本
        # 漂移红的含义是「该走 --update-baseline + 全门禁迁移流程」，不是
        # 代码坏了。处置手册见 memory / a592f60、2f5d5d4 先例。
        shell: bash
        run: |
          node scripts/toolchain_probe/toolchain_probe.mts

      - name: MoonBit format check (moon fmt --check)
        # 2026-09-21 审阅批四补线：fmt 漂移已跨多个批次无人拦（此前
        # ci.yml 零 fmt 步骤）；gen_* 生成器内置 fmt 与手工编辑的格式
        # 差异会在再生成路径持续产生噪声。归 hygiene（2026-09-23）：格式账。
        shell: bash
        run: |
          cd moonbit
          moon fmt
          if ! git diff --exit-code -- .; then
            echo "::error::moon fmt 漂移——本地 cd moonbit && moon fmt 后提交"
            git diff --stat -- .
            exit 1
          fi

      - name: MoonBit tests (four targets)
        # js 目标接线（2026-10-15）：三后端批落地 js 后端（38f63d42）但测试
        # 面漏接——js 入口只做产物（build-artifacts 的 artifact 源），行为锚
        # （fs_js 等 js 后端专属文件的锚，全量 907 例）零 CI 覆盖，与三臂
        # 强制纪律（AGENTS §14）不符。本地实证 907/907 全绿后接线。
        run: |
          cd moonbit
          moon test
          moon test --target native
          moon test --target wasm-gc
          moon test --target js

      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: wasm-gc gateway artifact + Node host smoke
        run: |
          cd moonbit && moon build --release --target wasm-gc gateway/wasm && cd ..
          node scripts/wasm_gateway/host.mts


  # ── toolchain-latest-sentinel（#132 追新哨兵，2026-10-16）────────────────
  # 主线八处 pin .moonbit-version（可复现、不被上游发布劫持——2026-10-16
  # 三笔连红 4021 教训）；追新职能由本 job 独立承载：夜间裸 latest 跑核心面，
  # 红 = 上游新版有兼容面变化，走 vitro-toolchain-upgrade 流程（修警告 →
  # --update-baseline → bump .moonbit-version 推进主线）。刻意不设
  # MOONBIT_INSTALL_VERSION = latest；仅 schedule 触发，无下游 needs——
  # 红不阻塞任何主线 job。
  toolchain-latest-sentinel:
    name: Toolchain latest sentinel (nightly chase-new)
    runs-on: windows-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit toolchain (latest — sentinel deliberately unpinned)
        uses: ./.github/actions/setup-moonbit
        with:
          version: latest
      - name: moon check (latest compatibility probe)
        run: cd moonbit && moon check
        shell: bash
      - name: moon test (latest compatibility probe)
        run: cd moonbit && moon test
        shell: bash
      - name: Test-count reconciliation (README declared vs latest moon test truth)
        # #338 批一（2026-10-27）：哨兵此前只看 rc——上游行为漂移（计数变化
        # 但不红不崩）零感知通道。复用现役 testcount 闸（v3 双口径实跑对账
        # 两 README 声明，本地 CI 均已 J9 双锚）：latest 实跑计数 != master
        # README 声明即红 = 上游有兼容面外行为变化，走
        # vitro-toolchain-upgrade 流程。期望值单源 = master README（pin
        # 口径声明数），零新增单值文件；测试数变更批的 README 连坐义务
        # 不变（testcount 闸主线本已强制）。node 用 runner 预装版（闸只
        # 用 node:fs/path/child_process，无版本面）。
        run: node scripts/moonbit/testcount/main.mts
        shell: bash

  # ── toolchain-prerelease-sentinel（审阅 v2 A8 批，refs #438，2026-11-02）──
  # pre-release channel 前瞻门（官方 x 仓 check.yml「pre-release-version-check
  # + pre-release-build」/core 仓信息轨的 Vitro 对位；R5d 件①处方）。缺口：
  # toolchain-latest-sentinel 只追 stable channel 的 latest——0.9.0 断供事故的
  # 完整时间线里，删 API 的 moonc 在 pre-release channel 期间 Vitro 零感知，
  # stable 一发布即在架包被打死。本 job 把感知点前移到上游预发布期
  # （pre-release → stable 通常有数天至数周差）。红 = 上游预发布有兼容面
  # 变化，走 vitro-toolchain-upgrade 流程——信息轨语义与 stable 哨兵一致：
  # 仅 schedule 触发、无下游 needs，红不阻塞任何主线 job。
  # 形态裁定（R5d 件①适配点）：①ubuntu 省额度（非门禁面，x/core 同款定位）；
  # ②步面 = check + test（不带 testcount——上游行为漂移零 rc 变化的感知通道
  # 是 stable 轨的分工，pre-release 轨要的是「最早的暴露点」）；③安装走
  # setup-moonbit version: pre-release——channel 名与 core 仓 pre-release-check
  # 同款（官方双仓现役实证，安装器 MOONBIT_INSTALL_VERSION 直透
  # binaries/pre-release/）；④Windows 兼容面不在本轨重复（stable 轨防线的事）。
  # J9：步面判别力 = 0.9.0 断供形态本地复刻实证（time_travel import
  # core/abort 注入 → moon check 即红 Cannot find import rc=127，还原绿）。
  toolchain-prerelease-sentinel:
    name: Toolchain pre-release sentinel (nightly, ahead-of-stable)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit toolchain (pre-release — sentinel deliberately unpinned)
        uses: ./.github/actions/setup-moonbit
        with:
          version: pre-release
      - name: Report channels (pin vs pre-release)
        # 不判红的前置探针：两 channel 版本串并排落日志，首查红时先看
        # 「上游动了什么」。pre-release 与 pin 同串 = 上游静默期，步面跑的
        # 是已知绿面（零增量信息，正常现象非故障）。
        run: |
          echo "pin    : $(tr -d '[:space:]' < .moonbit-version)"
          echo "pre-rel: $(cd moonbit && moonc -v)"
        shell: bash
      - name: moon check (pre-release compatibility probe)
        run: cd moonbit && moon check
        shell: bash
      - name: moon test (pre-release compatibility probe)
        run: cd moonbit && moon test
        shell: bash

  # ── coverage-sentinel（#338 批二，2026-10-27；A8 批 2026-11-02 升级逐包快照基线）──
  # 行覆盖率记账观察面（默认 wasm 轮裸单测域）。A8 批（refs #438）起由
  # scripts/coverage_snapshot 接管：full_summary 逐文件闭合聚合 → 逐包快照 +
  # vs baseline.json 趋势报告（入库基线 scripts/coverage_snapshot/baseline.json，
  # 首采 2026-11-02 @ 5233ad65：18480/30648 = 60.3%，29 包；重锚须显式
  # --update-baseline）。按拍板**快照基线语义不设涨跌门**——B 轮修复进行中
  # 先建测量基线，门限留后续批；趋势表经 $GITHUB_STEP_SUMMARY 直达 run 页。
  # 仍 observe-only：仅 schedule 触发、无下游 needs——红不阻塞任何主线 job
  # （红面只剩 fail loud：采集失败/解析不到 Total/逐文件之和与 Total 不闭合
  # ——口径陷阱①的机判，防误用 summary 族聚合低估）。coverage 仍属实验特性
  # （MOON_COVE 双引擎并存），报告形态冻结在本 job 的产物上。
  coverage-sentinel:
    name: Coverage sentinel (nightly, snapshot baseline + trend)
    runs-on: windows-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit toolchain (pinned)
        uses: ./.github/actions/setup-moonbit
      - name: Coverage snapshot (collect + per-package aggregate + trend vs baseline)
        # 冷态 instrumentation 全量重编（分钟级）+ 插桩跑全量裸单测
        # （moon test --enable-coverage，R5g 实证链）+ full_summary 逐文件
        # 解析（闭合校验内建于脚本——用错口径当场红）+ 逐包聚合 + 趋势。
        run: node scripts/coverage_snapshot/main.mts --out tmp/coverage_snapshot
        shell: bash
      - name: Upload coverage snapshot (full_summary / per_package / trend)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-snapshot-${{ github.run_id }}
          path: tmp/coverage_snapshot

  demo:
    name: Demo front-end gates (tsc / smoke / TS tests)
    needs: build-artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install MoonBit toolchain (differential anchors)
        uses: ./.github/actions/setup-moonbit



      # ── gen_api_help rules.json（#125 收尾，2026-10-15）───────────
      # gen_api_help 内容批收敛（rules.json ≡ 原 .json.mbt 零漂移）后随
      # jsonmbt 退场翻转出库——scripts 侧 .json.mbt 清零，本 job 的
      # .json.mbt static gate 步随之摘除（moon 需求由差分驱动内嵌
      # moon run 承担，工具链安装保留）。

      - uses: actions/download-artifact@v4
        with:
          name: build-products
          path: moonbit/_build
      # 2026-10-30 审计批接线：examples/demo.mbtx 是 README 快速开始第 0 步的
      # 门面，此前 CI 零引用——示例脚本烂了没人知道。零克隆形态（moon run
      # demo.mbtx 拉 mooncakes 发布包）曾被 0.9.0 的 time_travel→core/abort
      # 解析病挡住（#374/#402），0.9.1（2026-10-31）已自愈——2026-11-08 本地
      # 实测 rc=0；smoke 维持 workspace 臂免 registry 抖动。import 块已迁
      # 文件头 ---- frontmatter（moonc 0.10.20 unfenced_import 弃用警告清墙
      # ——零克隆第一跑不再见警告块）：此处剥首对 ---- 围栏（含 import 块）
      # 成临时 main 包跑 wasm-gc，护住示例与 gateway API 的同步（跑完即删，
      # 不入库）。约束：demo.mbtx 正文禁用 ---- 行（围栏区间匹配）。
      - name: demo.mbtx quickstart smoke (workspace arm)
        if: always()
        run: |
          set -e
          pkg=cmd/demo_mbtx_smoke
          mkdir -p "moonbit/$pkg"
          sed '/^----$/,/^----$/d' examples/demo.mbtx > "moonbit/$pkg/main.mbt"
          cat > "moonbit/$pkg/moon.pkg" <<'PKGEOF'
          // CI 冒烟临时包（demo.mbtx workspace 臂）——跑完即删，不入库。
          import {
            "moonbitlang/core/json",
            "vitro/engine/gateway",
          }

          supported_targets = "wasm-gc"

          pkgtype(kind: "executable")
          PKGEOF
          cd moonbit
          out=$(moon run "$pkg" --target wasm-gc 2>&1)
          echo "$out" | tail -5
          echo "$out" | grep -q '全程.*帧' || { echo '::error::demo.mbtx 冒烟输出缺回放主标记'; exit 1; }
          cd ..
          rm -rf "moonbit/$pkg"
        shell: bash

      # 防遮蔽（2026-10-23）：tsc 及之后每道 demo 闸 always()——此前 E-08 一红
      # 直接 skipped smoke/E2E/pure，后面的红看不到；现在逐闸跑完再汇总。
      - name: demo TS check (tsc --noEmit = js/ 模块类型面)
        if: always()
        # F4 收尾（2026-10-17）：app.ts 退役 → emit 无对象，只留 --noEmit
        # （js/ 八个物理保留模块的类型面；src/ 由 svelte-check 覆盖）
        run: |
          cd demo && npm ci && npx tsc -p tsconfig.json --noEmit
        shell: bash

      # 算法侧栏数据发射（2026-10-04 refs #28 建，同日发射化）：产物不入库
      # （与 js/*.js、wasm.wasm 同形态）——发射即检查闸（分组并集 ==
      # rules.json 43 族、82 模板全集对账，断言失败即红）。assemble check
      # 与 demo_smoke 消费盘上 algorithms.js，本步必须排在其前。
      - name: demo algorithms data emit (generator assertions = gate)
        if: always()
        run: node scripts/gen_demo_algorithms/main.mts
        shell: bash

      # 课程内容防线（#120 补充 + #125 批 A 形态修正，2026-10-15）：
      # course_catalog = 叙述→课目对账 + lesson.c 双臂对拍（vitro ≡ clang，
      # 独立于 corpus/ 语料线）。**gen_course -check 步已摘**——#125 补充
      # 「资产链自举」判据驳回生成器进资产链（当时为 Go；#273 批二已迁 .mts，
      # 仍不入资产链/CI），gen_course 的 lessons.ts 渲染角色退役为失败回退
      # 预案（本体保留，头注标注）；
      # 课程叙述的现役呈现路线 = #125 补充宿主侧运行时方案（parser.c 随包
      # 发布 + demo 运行时喂引擎解析）。
      - name: course catalog gate (reconcile + lesson.c dual-arm diff)
        if: always()
        run: node scripts/course_catalog/main.mts
        shell: bash

      # 2026-10-04 审阅 P3-②：组装自检原先只在 push-master 的 pages.yml——PR
      # 侧拷贝面缺口（历史白屏同类）无闸。单源脚本（demo_assemble_check）对
      # demo/ 跑同一断言集（不带 --no-ts：源目录 .ts 合法；F4 收尾后断言
      # index.html 入口 = src/main.ts + 本地资源面）。
      - name: demo assemble check (asset existence, HTML-face sentinel)
        if: always()
        run: node scripts/demo_assemble_check/main.mts demo
        shell: bash

      # #222 P0 契约批（2026-10-21）：demo 主题 token 单源 = demo/tokens.json，
      # 产物 demo/src/tokens.css 由 scripts/gen_demo_tokens 生成（@generated 禁手改，
      # app.css 只 @import）。-check 逐字节比对（CRLF 归一）；-selftest 先证比对面
      # 会红（J9 埋雷义务）——两行都跑，闸与自证同在。
      - name: demo tokens gate (tokens.json → tokens.css, -check)
        if: always()
        run: |
          node scripts/gen_demo_tokens/main.mts -selftest
          node scripts/gen_demo_tokens/main.mts -check
        shell: bash

      # F4 前端框架批（Svelte 5 + Vite）闸门：svelte-check（类型+A11y 面，
      # 比 tsc 宽）+ vite build（构建成功性）。demo/src 在 tsc include 外、
      # demo_smoke 跑 js 面，不加这两步则 demo/src 在 CI 零覆盖（裸奔）。
      - name: F4 svelte-check (type + a11y gate)
        if: always()
        run: cd demo && npm run check
        shell: bash

      # #132 能力层（2026-10-16）：oxlint 1.88.0 零 error 门（实测 5 warn 不
      # 阻塞；devDep 精确 pin + npm ci 锁定链）。CallTree.svelte:150/156 两处
      # 逗号表达式 warning 已知不碰。oxfmt/Biome 不接——能力层分散判据（#132）。
      - name: F4 oxlint (zero-error gate)
        if: always()
        run: cd demo && npm run lint:all
        shell: bash

      # wasm 是构建期资产（engine.worker.ts ?url——#139 同款 fail loud）：
      # build-products artifact 已含 wasm-gc 产物，vite build 前就位。
      # 此前漏本 job 的 cp → CI vite build 红；Pages job 因有前置 cp 而绿
      # ——同坑两处只堵一处的教训（62f75d3d CI 首跑实锤）。
      - name: demo wasm asset in place (build-time asset)
        if: always()
        shell: bash
        run: cp moonbit/_build/wasm-gc/release/build/gateway/wasm/wasm.wasm demo/wasm.wasm

      # 语言包懒加载产物（#130 批② demo 接线）：复用 build-artifacts 的
      # teaching/langpack（2026-10-23 提速批——此前 demo 重装工具链再编一遍，
      # 与 build 的全量 js 构建重复）。artifact 缺失即 cp 红，与 wasm 同款 fail loud。
      - name: demo langpack asset (build artifact → cp)
        if: always()
        shell: bash
        run: |
          mkdir -p demo/teaching/langpack
          cp moonbit/_build/js/release/build/teaching/langpack/langpack.js demo/teaching/langpack/langpack.js  # 仅 .js——d.ts 相对引用 moonbit.d.ts 拖类型错

      - name: F4 vite build (build success gate)
        if: always()
        run: cd demo && npm run build
        shell: bash

      # E-08 快照闸（#122 闸门批，2026-10-16）：《出口分档与宿主策略》§6.2
      # 末条防线义务「golden payload → 渲染输出」快照测试——UI 重建启动时
      # 立即生效。vite --ssr 编译纯展示组件 bundle（dist-e08/ 不入库）→
      # node --test 对冻结 golden（demo/e08/golden/*.html）逐字节比对；
      # 刷新走 tests/e08-update.mts 显式人工令（E-04：快照不得测试内动态
      # 生成）。组件面↔用例表↔golden 目录三方全等锚防快照僵死。覆盖面
      # 边界（动画/交互/浏览器态不入快照语义）见 demo/src/e08/entry.ts 头注。
      - name: F4 E-08 snapshot gate (SSR render vs frozen golden)
        if: always()
        run: |
          cd demo && npx vite build --ssr src/e08/entry.ts --outDir dist-e08
          cd .. && node --test demo/tests/e08.test.mts
        shell: bash

      # E-08 夹具同形性闸（#324 治本批，2026-10-31）：payloads/core.json 与
      # 引擎实产形态机判对拍——现场以 demo/e08/bubble.c 跑 js 臂（artifact
      # 的 vitro_js.js，经 tests/e08_live.mts api --batch 通道，前端 worker
      # 同款方法序列），帧字段集/label 与 phase 值域/labels 段/capabilities/
      # catalog 任一形态漂移即红。根除「手写夹具与实产形态相反、闸恒绿」
      # 的假绿面（J9 已证红：旧夹具 6+1 项断点全数命中）。重导走
      # tests/e08-export.mts 人工令（E-04 同款纪律：审定 diff 再入库）。
      - name: F4 E-08 fixture shape gate (payload ≡ engine live shape)
        if: always()
        run: node --test demo/tests/e08-shape.test.mts
        shell: bash

      # 审阅 P1-2（2026-09-30）：demo 静态资产的判定闸（03-D17 形态——
      # HTML/JS/CSS 原不在任何闸的扫描面）。对 cases.js 每个预置用例实跑
      # 协议链：golden 逐字节 + 页面渲染所需响应字段存在性。J9 证红：篡改
      # cases.js golden 即红（已留痕）。（原注释随 gates-wasm 拆分批从该
      # job 尾部迁来——步骤实排历来在本 job，2026-10-17）
      - name: demo page smoke (protocol-level, cases golden + field keys)
        if: always()
        run: node scripts/demo_smoke/main.mts
        shell: bash

      # F4 浏览器 E2E（107 锚：诊断带 S1-S5（18）+ 工作区/回放/设置/主链面
      # W1-W17（38）+ 会话族 F1-F8 + B0-B11 + D0/D1/D1b/D2/D3（35）+ 编辑器（10）+
      # 装载失败（6）〔2026-10-18 实测立账批防线锚：
      # 坏 hash 横幅/argv 克隆崩/语句级口径/播完 status/char 数组全帧 sweep/
      # E 码联动/目录全章重名 id 防护；D0/D1/D1b/D2：交换双格+连线+编辑分色、
      # 动效开关/预算/reduced-motion 旁路、变量行/脉冲、深树 raw 映射+相机、
      # 多数组归属接线、播放头连续补间/seek 短滑/scrub 与 reduced 瞬时、播放期事件拍抽稀、多数组事件拍〕，
      # 含断点行为链/stdin 喂入/golden 对照/统计卡）
      # ——2026-10-18 前端改造批按新 IA（三态 + vr-* 类名）重定向
      # 选择器，锚语义不变（旧 .pilot-head/.tab/.bars 锚已退役，旧脚本会在
      # boot 等待即超时，非回归）；
      # 「CI 无 Edge 不进流水线」的旧既定收口（2026-10-17 收口批）：runner
      # 预装浏览器 CDP 直连，脚本零改动；vite build 产物起本地静态服。
      # 2026-10-18 连红处置：本 job runs-on windows-latest 而启动命令写死
      # ubuntu 命令名 google-chrome——command not found → Chrome 未起 →
      # CDP 9222 ECONNREFUSED，该闸自 62f75d3d 进 CI 起从未绿过。改为
      # 探测链：PATH google-chrome（ubuntu 形态）→ Windows Chrome 标准
      # 安装路径（runner 镜像自带）→ Edge 兜底（CDP 同源，注释既定口径）。
      # 闸内显式回显所用浏览器——静默兜底违反 fail loud 纪律。
      - name: F4 browser E2E (headless chrome, 107 anchors)
        if: always()
        run: |
          CHROME_BIN="$(command -v google-chrome || true)"
          if [ -z "$CHROME_BIN" ]; then
            for p in "/c/Program Files/Google/Chrome/Application/chrome.exe" "/c/Program Files (x86)/Google/Chrome/Application/chrome.exe" "/c/Program Files (x86)/Microsoft/Edge/Application/msedge.exe"; do
              if [ -f "$p" ]; then CHROME_BIN="$p"; break; fi
            done
          fi
          if [ -z "$CHROME_BIN" ]; then
            echo "E2E 闸 fail loud：runner 无 Chrome/Edge 可用" >&2
            exit 1
          fi
          echo "E2E browser: $CHROME_BIN"
          # 2026-10-23 连红处置：CDP 30s 在 runner 冷启动/Chrome 更新时不够
          # （run 39939871737 实测 30s 内未 listen，E2E 整段红）。改为：
          # ①profile 放 RUNNER_TEMP 且每 run 唯一（不继承 workspace 旧 profile）；
          # ②首启最多等 90s；③仍未就绪则清 profile 重启一次再等 90s；
          # ④失败回显日志 + 进程态，不把「浏览器没起来」伪装成断言失败。
          PROFILE="${RUNNER_TEMP:-$PWD}/chrome-e2e-$$"
          LOG="${RUNNER_TEMP:-$PWD}/chrome-e2e-$$.log"
          rm -rf "$PROFILE" "$LOG"
          taskkill //F //IM chrome.exe >/dev/null 2>&1 || true
          start_chrome() {
            ("$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --remote-debugging-port=9222 --no-proxy-server --user-data-dir="$PROFILE" --no-first-run about:blank >>"$LOG" 2>&1 &)
          }
          wait_cdp() {
            for i in $(seq 1 90); do
              if curl -sf --max-time 1 http://127.0.0.1:9222/json/version >/dev/null 2>&1; then return 0; fi
              sleep 1
            done
            return 1
          }
          start_chrome
          (cd demo && node tests/serve_static.mts 8931 &)
          if ! wait_cdp; then
            echo "E2E：CDP 首启 90s 未就绪，清 profile 重启一次…" >&2
            taskkill //F //IM chrome.exe >/dev/null 2>&1 || true
            rm -rf "$PROFILE"
            sleep 2
            start_chrome
            if ! wait_cdp; then
              echo "E2E 闸 fail loud：CDP 9222 重启后 90s 仍未就绪（$CHROME_BIN）" >&2
              echo "---- chrome log ($LOG) ----" >&2
              tail -40 "$LOG" >&2 || true
              echo "---- chrome 进程 ----" >&2
              (tasklist //FI "IMAGENAME eq chrome.exe" 2>/dev/null || ps aux | grep -i chrome | grep -v grep) >&2 || true
              exit 1
            fi
          fi
          # 样式契约闸（#222 P0 第二批，2026-10-21）：五主题 × 19 选择器 × 9
          # computed 属性（颜色/字体族/连字/字距/大小写）。取的是跨 OS 确定值
          # （不经栅格化），基线 demo/tests/style_contract.json 入库。
          # -selftest 先证完整性判定（残缺 doc 判红），再跑真比对。
          node demo/tests/style_contract.mts --selftest
          node demo/tests/style_contract.mts http://127.0.0.1:8931/
          node demo/tests/e2e_diagcard.mts http://127.0.0.1:8931/
          node demo/tests/e2e_workspace.mts http://127.0.0.1:8931/
          node demo/tests/e2e_session.mts http://127.0.0.1:8931/
          node demo/tests/e2e_editor.mts http://127.0.0.1:8931/
          # bootfail 末位跑：临时改名 dist wasm 产物造装载失败（finally 还原），
          # 串行步骤内安全；若前置步骤红，本步不执行无遗留改名。
          node demo/tests/e2e_bootfail.mts http://127.0.0.1:8931/
        shell: bash

      # demo UI 字符串契约对账（2026-10-02，防线维护）：JS↔CSS 类名/CSS
      # skill 手册引用路径存在性闸（2026-10-07 接线；缺陷形态 03 E11/E13 同族面
      # 「手册改写引用面按脑测填迁移目标」的机判面）：.agents/skills/** 内的
      # 仓库路径引用（围栏代码块 + 行内反引号 span，首段 = 仓库根一级条目）
      # 必须实存；退役/反例语境死路径经 rules.json dead_paths 过闸（新增须在
      # 提交信息写明语境）；min_hits 下限守卫防抽取面塌缩（D8）。
      # -selftest 九路注入证红（J9）。首跑战果：11 处缺失全数人工定性
      # （2 陈旧路径修正 + 1 笔误前缀修正 + 1 占位符化 + 1 注释粘连 +
      # 6 退役/反例语境收编 dead_paths）。
      - name: skill docs referenced-path existence
        if: always()
        run: |
          node scripts/skill_path_check/main.mts -selftest
          node scripts/skill_path_check/main.mts
        shell: bash

      # 变量/id 三路文本对账——demo UI 批三实锤 bug 中两个的归因面
      # （stdin-row 死类 + --fg-muted 幽灵变量；HEAD 版证红留痕：bug 版
      # 三件套复现 5 条。TS 类型系统对这两类零感知，故走文本闸）。
      # 规则外置 rules.json（动态类簇/动态 id 前缀，僵尸条目无条件红）。
      # TS 重写批：扫描面 = app.ts + js/*.ts（源=审阅对象）。
      # #292 终局批：Go 版已删；双轨对拍闸同批退役（等价性证据 = 冻结 golden/sha 基线自证）。
      - name: demo UI string-contract lint (class/var/id reconciliation)
        if: always()
        run: |
          node scripts/demo_ui_lint/main.mts -selftest
          node scripts/demo_ui_lint/main.mts
        shell: bash

      # #51 批①（2026-10-17，refs #122 F3）：phase 受控词表冻结闸——
      # teaching/steps/infer_*.mbt 的 build_step 字面量 ↔ rules.json 双向全等
      # （未登记扩张红 / 僵尸条目红 / family 漂移红 / 非字面量调用红）；
      # 抽取面下限防正则失能，-selftest 内存注入四路证红（J9）。
      - name: teaching phase vocabulary freeze gate (infer literals ↔ rules.json)
        if: always()
        run: |
          node scripts/teaching_phase_vocab/main.mts -selftest
          node scripts/teaching_phase_vocab/main.mts
        shell: bash

      # 拆分批（2026-10-04，refs #28）→ TS 重写批：纯函数层 node --test——
      # 黄一批评「demo 层无自己测试」的正解药方。node 25 type stripping
      # 直跑 .ts（零发射依赖——源在即跑，比发射更早的红）。锚位对历史
      # bug 窝点：buildCallTree trie / isArrayAnimCase 紧凑声明存量 bug
      # 锁 / latin1ToUtf8 / tokenizeC / highlightLines / heapSpanOf / esc。
      # DOM 交互层不硬测，维持浏览器实测纪律。
      # 2026-10-04 审阅 P3-④：tests 此前不在主 tsconfig include——只有
      # 「能跑」保证无类型保证。独立 tests/tsconfig.json（@types/node）
      # 补类型面，直跑前先过 tsc。
      - name: demo pure-function tests (node --test on .ts)
        if: always()
        run: |
          cd demo && npx tsc -p tests/tsconfig.json && cd ..
          node --test demo/tests/pure.test.mts
        shell: bash

  # ── desktop（proton 捉虫壳，P 线前进拍板 2026-11-02）──────────────────
  # 定位：独立下游 module（desktop/，与 demo/ 并列），`import vitro/engine@pin`
  # 消费 **mooncakes 已发布包**——非发包面、不在 moonbit/moon.work 成员里、
  # 引擎 publish 流程零涉及（零污染语义与依赖方向见 desktop/README.md）。
  # 本 job 红的含义 = 已发布 vitro/engine@pin 在下游独立 module 装不上/
  # 解析不过（0.9.0 core/abort 断供事故的事前哨兵形态——该事故当时零 CI
  # 信号，靠下游报告才知）。
  desktop:
    name: Desktop shell gates (check / build / CEF CDP smoke)
    # 全量批（2026-11-02 PR #417 CI 绿后升格，用户拍板「上全量测试防线」）：
    # check-only 轻形态退役。smoke 需要 demo 的构建期资产（wasm.wasm/langpack
    # ——vite 模块图静态资产，缺失即 dev/build 红，与 demo job 同款 fail loud
    # cp），故 needs build-artifacts（此前「不消费本仓产物」的注记随之作废）。
    # timeout：CEF 下载在坏网络可长停滞（PR #417 审阅 P3）——25min 硬顶防挂死。
    needs: build-artifacts
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit toolchain
        uses: ./.github/actions/setup-moonbit
      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      # ── mooncakes 零自拉（CI 离线化，2026-11-03 拍板：下载只允许发版彩排
      #    两次 + 依赖 pin 变化时人工预热）——自家 CI 每轮全量拉 13 包
      #    （vitro/engine@pin + proton 族）会机械刷高 mooncakes 下载量
      #    （riantr 同款机制形态，用户上站实证计数上涨）。机制依据（moon
      #    源码 crates/mooncake/src/registry/client.rs）：registry cache zip
      #    命中走 Using cached 分支零网络，miss 才 Downloading。三层缓存：
      #    registry/cache（zip 层——零 GET 的关键）+ registry/index（moon
      #    update 索引增量）+ cache/deps（sources 展开层）。key 锚
      #    desktop/moon.mod（依赖 pin 变=换 key）+ proton_cli 版本字面。
      #    save-always：miss 预热轮回填后 post 也保存（否则「miss 即红」与
      #    post save 的 success() 门互锁成死循环）。
      - name: mooncakes package cache (zero self-pull)
        id: moonpkgs
        uses: actions/cache@v4
        with:
          path: |
            ~\.moon\registry\cache
            ~\.moon\registry\index
            ~\.moon\cache\deps
          key: moon-pkgs-v1-${{ hashFiles('desktop/moon.mod') }}-pc0.6.0
      - uses: actions/download-artifact@v4
        with:
          name: build-products
          path: moonbit/_build
      # ── demo 构建期资产（与 demo job 两 cp 同款——engine.worker 模块图的
      #    vite 静态资产；桌面 IPC 通道不消费 wasm，但模块图在即资产必须在）──
      - name: demo wasm asset in place (build-time asset)
        shell: bash
        run: cp moonbit/_build/wasm-gc/release/build/gateway/wasm/wasm.wasm demo/wasm.wasm
      - name: demo langpack asset (build artifact → cp)
        shell: bash
        run: |
          mkdir -p demo/teaching/langpack
          cp moonbit/_build/js/release/build/teaching/langpack/langpack.js demo/teaching/langpack/langpack.js
      # moon update 刷注册表索引后按 moon.mod pin 拉 vitro/engine + proton 族；
      # check 不编 C stub、不碰 CEF runtime——P 线实测 ~2s（91 任务）。
      - name: desktop moon check (native; vitro/engine@pin from mooncakes)
        shell: bash
        run: |
          cd desktop
          moon update
          moon check --target native --diagnostic-limit 80 2>&1 | tee /tmp/moon_pull_check.log
      # hygiene job 的 moon fmt --check 只扫 moonbit/——独立 module 自带一道
      - name: desktop moon fmt --check
        shell: bash
        run: cd desktop && moon fmt --check
      - name: desktop probe TS gates (tsc strict + oxlint)
        shell: bash
        run: cd desktop && npm ci && npm run check:all
      # ── 全量段：CEF 真窗口 CDP smoke（P 线四形态/捉虫/端到端的 CI 化）──
      - name: Install proton_cli (mooncakes 0.6.0)
        shell: bash
        run: moon install moonbit-community/proton_cli@0.6.0 2>&1 | tee /tmp/moon_pull_install.log
      # CEF runtime store 缓存（869MB 解压物——key 双锚 proton 版本 + CEF
      # 版本号；失配重下属正确行为。helper 不缓存：14s 原生构建且随 pin 变）
      - name: CEF runtime store cache
        uses: actions/cache@v4
        with:
          path: ~\.proton\store
          key: proton-store-win32-x64-0.6.0-cef-150.0.19
      - name: cef setup (download + assemble on cache miss)
        shell: bash
        run: cd desktop && proton_cli cef setup 2>&1 | tee /tmp/moon_pull_cef.log
      - name: demo deps (vite dev server)
        shell: bash
        run: cd demo && npm ci
      # algorithms.js 是 gitignored 生成物（.gitignore:185），vite 的
      # demoGlobals 插件构建期 readFileSync 硬依赖——本地盘上有产物故
      # dev 绿，CI 全新 checkout 缺席即 ENOENT（二轮红根因）。与 demo job
      # 的发射步同款；生成器内部 ensureFresh 自跑 vitro_js 构建（#36 三真值
      # 源机判），moon 工具链本 job 已装。
      - name: demo algorithms data emit (generator assertions = gate)
        shell: bash
        run: node scripts/gen_demo_algorithms/main.mts
      - name: desktop release build (proton + vitro/engine in-process)
        shell: bash
        run: cd desktop && proton_cli build -- --release 2>&1 | tee /tmp/moon_pull_build.log
      # 注意 smoke 的 formC 段会再构建一次 release（临时 debug=false 源）——
      # 本步产物供 dev 形态起窗 + 给 formC 段预热构建缓存（冷树 formC build
      # 可分钟级，600s 超时按冷树设）。
      # 断言集：CDP 就绪 / transport=ipc / demo 完整采集（golden ✓ 42 帧
      # 引擎 0.9.1 stdout）/ 无 DevTools 窗口捉虫 ≥3 / R3b 形态 C（debug=false
      # 重建直跑 + env 钉端口 → CDP 可达 + proton.localhost 指纹 + 三虫）+
      # 负向对照（同产物无 env ⇒ find_cdp 扫零 CDP——「patch 真生效」的判别
      # 锚，审阅 P2-1）——tools/smoke.mts 头注。基线数字漂移（帧数/版本）须
      # 连坐更新 smoke.mts 断言与 README 基线表。
      - name: CDP smoke (real CEF window, pinned ports)
        shell: bash
        run: cd desktop && node tools/smoke.mts 9335 9336
      # ── 零自拉断言（fail loud）：缓存命中轮全程不得出现 Downloading
      #    （zip GET=mooncakes 计数入账动作）。miss 轮=预热显形（warning +
      #    回填，post save 后下轮起严格）——绝不静默重下；驱逐/换 pin 同
      #    形态回落一轮预热。
      - name: zero self-pull assertion (cache hit => 0 Downloading)
        if: always()
        shell: bash
        run: |
          pulls=$(cat /tmp/moon_pull_*.log 2>/dev/null | grep -c "Downloading" || true)
          if [ "${{ steps.moonpkgs.outputs.cache-hit }}" = "true" ]; then
            if [ "$pulls" != "0" ]; then
              echo "::error::缓存命中却发生 ${pulls} 次 mooncakes 拉取（缓存驱逐/缺包）——本轮回填已保存，重跑即绿；持续红=依赖 pin 变化，按需人工预热（拍板口径：下载只允许彩排两次）"
              exit 1
            fi
            echo "零自拉 ✓ 缓存命中且全程 0 次 Downloading（mooncakes 计数不动）"
          else
            echo "::warning::预热跑——本轮自 mooncakes 拉取回填缓存（${pulls} 次 Downloading），save-always 保存后下轮起零自拉"
          fi
      # 兜底清树（CEF 子进程模型：dev 树收不净的残余同名进程）。
      # MSYS_NO_PATHCONV=1：/IM 是 taskkill 旗标非路径——Git Bash 的 MSYS
      # 路径转换会把它吃成盘符路径（二轮 cleanup 红 rc=1 根因）。
      - name: cleanup stray processes
        if: always()
        shell: bash
        run: |
          export MSYS_NO_PATHCONV=1
          taskkill /IM app.exe /IM cef_process.exe /IM proton_cli.exe /F 2>/dev/null || true

  # ── backend-triage（#349 三面编译语义对拍臂，2026-10-28）──────────────
  # 同一份 MoonBit 源（cmd/backend_triage runner——gateway 四导出帧源级形态）
  # 在三个编译后端下执行、stdout 逐字节对拍：
  #   native（MOON_CC=clang）/ js（node）/ wasm-gc（moonrun——moon 自带）
  # 任两臂分叉 ⇒ 直接归因编译后端（现役 js/wasm 两臂同宿主 node，宿主层
  # bug 两臂同报不可分——本臂 wasm 侧宿主异构）。新增不替换：现役
  # gates-wasm 各 slice 不动，跑绿一阶段后另议收敛（#349 落地形态）。
  backend-triage:
    name: Backend triage (native-clang / js-node / wasm-gc-moonrun)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install MoonBit toolchain (moon run 三连 + moonrun)
        uses: ./.github/actions/setup-moonbit
      - name: Refresh MoonBit registry index
        shell: bash
        run: cd moonbit && moon update
      - name: Three-backend semantic triage (#349)
        shell: bash
        run: node scripts/backend_triage/main.mts

  # ── cli-smoke-linux（PR #367 审阅 P1-1，2026-10-28）───────────────────
  # #366 锚的 Linux 判别力 lane：vitro_cli_smoke 的 B[大帧管道]/B[stderr
  # 通道] 锚依赖 POSIX 管道的异步写丢弃机理——Windows 上 libuv 对 stdio
  # 管道走同步句柄（WriteFile 直通、不排队），锚在 windows-latest lane
  # 恒绿无牙（审阅反向突变实测：out_line→println 回退后 Windows 锚仍
  # 绿、CI 全绿）。本 job 在 ubuntu 上重跑同一 smoke 全集，管道口径锚
  # 自此有 Linux 判别力；Windows lane 保留（平台面双覆盖）。产物四件 +
  # serve 同 cli_smoke slice 自建形态。
  cli-smoke-linux:
    name: CLI smoke (ubuntu — pipe anchors need POSIX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      # P2-1（2026-10-30 处置批）：内联 unix.sh 三行副本收敛——action 补
      # POSIX 分支后此处统一 uses 引用（.moonbit-version pin 单源不变）。
      - name: Install MoonBit toolchain (action, POSIX arm)
        uses: ./.github/actions/setup-moonbit
      - name: Refresh MoonBit registry index
        run: cd moonbit && moon update
      - name: Build four arms + serve exe
        run: |
          cd moonbit
          moon build --release --target js cmd/vitro_js
          moon build --release --target js cmd/vitro_wasm
          moon build --release --target wasm-gc gateway/wasm
          MOON_CC=clang moon build --release --target native cmd/vitro
          MOON_CC=clang moon build --release --target native cmd/serve
      # ── #500 批（2026-11-12）：C stub 隐式声明防线 ─────────────────────
      # cmd 下全部 .c 的严格声明扫描。为何是独立步而非构建旗标注入：
      # ① moon 无 CFLAGS/MOON_CFLAGS 环境变量透传（moon.exe strings 实证
      #   ——旗标入口只有 moon.pkg 的 cc-flags/stub-cc-flags 配置面）；
      # ② 即便注入 -Werror=implicit-function-declaration，x86_64 的
      #   moonbit.h emmintrin→mm_malloc→stdlib 链会意外供给 malloc 族声明
      #   （arm64 走 arm_neon 分支无此巧合——Apple clang 21/gcc14+ 隐式
      #   声明默认 error 即断供，#500），构建照绿抓不住；须
      #   -DMOONBIT_NATIVE_NO_SYS_HEADER（moonbit.h 官方宏）还原「文件自身
      #   显式 include 集」，而该宏改变 v128 typedef——不能进真实构建，
      #   只能进扫描。J9：删任一 host_clock_stub.c 的 stdlib.h → 四份当步
      #   红（malloc:56 隐式声明，WSL clang 21 实证同形态）。
      - name: C stub strict-declaration scan (moonbit/cmd .c set — #500)
        run: |
          set -e
          cd moonbit
          files=$(find cmd -name '*.c' | sort)
          [ -n "$files" ] || { echo '::error::扫描文件集为空（find 失败？）'; exit 1; }
          echo "扫描 $(echo "$files" | wc -l) 个 C stub（-DMOONBIT_NATIVE_NO_SYS_HEADER = 文件自身显式声明集口径）"
          for f in $files; do
            clang -fsyntax-only -Werror=implicit-function-declaration -Werror=implicit-int \
              -DMOONBIT_NATIVE_NO_SYS_HEADER -I "$HOME/.moon/include" "$f" \
              || { echo "::error::$f 隐式声明扫描红——缺显式 include（对照 #500）"; exit 1; }
          done
          echo "C stub 严格声明扫描：全部通过"
        shell: bash
      - name: unified CLI smoke (ubuntu lane, #366 anchors with teeth)
        run: node scripts/vitro_cli_smoke/main.mts --corpus 30
      # A7 批连坐（2026-11-02）：CLI 参数面对称性冒烟 ubuntu 臂——与 gates-wasm
      # cli_smoke slice 的 windows 跑同一声明表；三臂对称性双 OS 覆盖（#388 教训：
      # 本地 Windows 绿排除不了 ubuntu 调度差异）。产物由上一步四臂构建提供。
      - name: CLI argument-face symmetry (ubuntu lane)
        run: node scripts/cli_symmetry/main.mts -check
        shell: bash

  # ── release-preflight（ds 批③：发布前置闸，2026-10-31）──────────────────
  # moon package 非退化闸 + 根级四件 + 版本状态探针（**闸进程零网络零
  # login**——dry-run 在 CI 无 moon login 会被「Registry login is required」
  # 拦，故只进 release 档〔发版本机〕；本 job 的 registry 刷新属 job 依赖面
  # 非闸行为）。import 断供防线由 moon check/test 的 Hygiene job 承担，本
  # job 增量 = 发布件面（**模块目录被 .gitignore 覆盖时 22 字节空 zip rc=0
  # 静默成功实锤**——审阅批 2026-10-31 勘正归因：与是否 git 仓库无关〔无
  # git 目录打包正常〕，CI 在 checkout 树里跑，本闸 CI 可达形态 = 忽略规则
  # 误伤 moonbit/）。**反刷量约束（用户拍板）**：零 vitro/engine zip GET；
  # 干净消费验收（moon add + build = 真实下载计数）不进 CI，人工步骤落
  # vitro-release-playbook。A8 批（refs #438）起加**解压树 check**（件③，
  # 0.9.0 断供的下游视角拦截）：moon package → 零依赖手写解压 → 解压树上
  # moon check——解压树 deps 由 moon 解析（moonbitlang/core 族，缓存缺席会
  # 拉依赖包——非 vitro/engine 计数面，R5d 件③适配点 3 诚实登记：本步非
  # 「零网络」，与前置 moon update 同属 job 依赖面）。J9：解压树删
  # time_travel/checkpoint.mbt → Error [4024]×3 rc=1（本地实证）。
  release-preflight:
    name: Release preflight (package integrity + unzip consumer check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install MoonBit toolchain (action)
        uses: ./.github/actions/setup-moonbit
      - name: Refresh MoonBit registry index
        run: cd moonbit && moon update
      - name: Package integrity gate (non-degenerate zip + root files + version probe + unzip-tree check)
        run: node scripts/release_preflight/main.mts --unzip-check

  # ── scripts-ts（#273 批一：四件套门，2026-10-22）────────────────────────
  # 判定型脚本默认 .mts 后的最小入库门：node 直跑（无发射）+ tsc 严格档 +
  # oxlint（.mts 目录扫描缺口——显式列文件）+ node:test（Windows 目录模式
  # 缺口——显式列文件）。依赖钉版本 = scripts/package-lock.json（npm ci）。
  scripts-ts:
    name: Scripts TS gate (tsc / oxlint / node:test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      # gen_svg 的「真实仓库 -check」用例读 reports/facts.json（包切分图的实/虚
      # 线与在架徽标全部 facts 派生）——该文件 gitignored，CI 检出态不存在，
      # 故本 job 自带采集（`facts facts` 只采集落盘不判红，判红归 bookkeeping）。
      - name: npm ci (lockfile pinned)
        run: npm ci
        shell: bash
      - name: tsc strict (strict + noUncheckedIndexedAccess)
        run: npm run check
        shell: bash
      - name: oxlint (explicit file list)
        run: npm run lint
        shell: bash

      # 生成器簇「真实仓库 -check」用例内置 `moon fmt` 归一（gen_stubs /
      # gen_protocol_fields / gen_host_route / gen_libc_data / gen_icons 五例），
      # 归一后再比对产物、比对后无条件还原——moon 不在 PATH 时**必须红**
      # （fail loud，不做 skip 兜底：环境缺口静默通过就是假绿）。
      # 2026-10-23 首轮 CI 实锤五红同根 = moon 缺席（exit null），非代码缺陷。
      # 安装置于 node:test 前、tsc/oxlint 后：类型/风格面仍先快失败。
      - name: Install MoonBit toolchain (generator -check runs moon fmt)
        uses: ./.github/actions/setup-moonbit

      # gen_svg -check 的 facts 输入。放在 moon 之后：
      # 采集链含 moon 相关项，缺工具链会把可用键降级成 unavailable。
      # working-directory 必须覆盖回仓库根——本 job 默认在 scripts/ 下跑，
      # 直接相对路径会变成 scripts/scripts/facts
      #（2026-10-23 CI 红实锤：stat D:\a\Vitro\Vitro\scripts\scripts\facts）。
      # 2026-10-25 #273 迁移批：Go→.mts，命令切 node。
      - name: facts collect (gen_svg -check input)
        working-directory: ${{ github.workspace }}
        run: node scripts/facts/main.mts facts
        shell: bash

      - name: node:test (explicit file list)
        run: npm run test
        shell: bash

  # ── mutation-gate（#368 第一层：scripts 面 diff 级突变闸，report-only 观察期）──
  # 对 PR diff 触达的 scripts 源文件生成行级突变（Stryker），以「传递导入
  # 闭包内全部 node:test」为杀阵逐突变体判定——survived 清单 = 新扩散面的
  # 机判定义（#368：引入瞬间无基线，既有测试对新面零判别力）。**survived
  # 不阻断**（观察期看信噪比；等价突变经人工定性入白名单后才切阈值阻断）；
  # 基础设施失败（stryker 崩/判分失败）红。观察期不入 ci-summary needs
  # ——阈值阻断批（#368 阶段 1 收口）再连坐。杀阵干跑红 = 环境缺口跳过
  # 并在报告单列（不静默、不误报 survived——本地/CI 异构资产口径）。
  mutation-gate:
    name: Mutation gate (scripts diff, report-only)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      # 快速短路：diff 零 .mts 源改动（纯测试/文档批）不进重步骤
      - id: changed
        name: changed scripts sources?
        shell: bash
        run: |
          git fetch origin master --quiet
          # awk 恒 exit 0——PR #375 审阅 P1-3：GitHub bash 实为 -e -o pipefail，
          # 零匹配时 grep exit 1 会把这条 report-only 快速短路步弄红
          n=$(git diff --name-only origin/master...HEAD -- scripts | awk '/\.mts$/ && !/\.test\.mts$/' | wc -l)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "changed scripts sources: $n"
      - if: steps.changed.outputs.count != '0'
        name: npm ci (lockfile pinned, incl. @stryker-mutator/core)
        working-directory: scripts
        run: npm ci
        shell: bash
      # 闭包可能含生成器簇「真实仓库 -check」用例（moon fmt 归一）与
      # gen_svg 的 facts 输入——与 scripts-ts 同因（2026-10-23 五红同根实锤）
      - if: steps.changed.outputs.count != '0'
        name: Install MoonBit toolchain (action, converged)
        uses: ./.github/actions/setup-moonbit
      - if: steps.changed.outputs.count != '0'
        name: facts collect (gen_svg -check input)
        working-directory: ${{ github.workspace }}
        run: node scripts/facts/main.mts facts
        shell: bash
      - if: steps.changed.outputs.count != '0'
        name: run mutation gate (report-only)
        working-directory: ${{ github.workspace }}
        run: node scripts/mutation_gate/main.mts --base origin/master
        shell: bash
      - if: steps.changed.outputs.count != '0'
        name: upload report
        uses: actions/upload-artifact@v4
        with:
          name: mutation-gate-report
          path: tmp/mutation_gate/

  # ── ci-summary（防「skipped 当绿」，2026-10-23）────────────────────────
  # 只做汇总、不重跑闸：所有上游 job 必须 success；任一 failure/skipped 即红。
  # 这样 build 红导致下游 skipped 时不会显示成「其余全绿可合并」。
  ci-summary:
    name: CI summary (all gates must be success)
    if: always()
    needs: [build-artifacts, gates-diff, corpus-fuzz, gates-native, gates-wasm, static-gates, hygiene, demo, scripts-ts, backend-triage, cli-smoke-linux, release-preflight, arm4-wasmtime, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: summarize gate results
        env:
          BUILD: ${{ needs.build-artifacts.result }}
          DIFF: ${{ needs.gates-diff.result }}
          FUZZ: ${{ needs.corpus-fuzz.result }}
          NATIVE: ${{ needs.gates-native.result }}
          WASM: ${{ needs.gates-wasm.result }}
          STATIC: ${{ needs.static-gates.result }}
          HYGIENE: ${{ needs.hygiene.result }}
          DEMO: ${{ needs.demo.result }}
          SCRIPTS_TS: ${{ needs.scripts-ts.result }}
          BACKEND_TRIAGE: ${{ needs.backend-triage.result }}
          CLI_SMOKE_LINUX: ${{ needs.cli-smoke-linux.result }}
          RELEASE_PREFLIGHT: ${{ needs.release-preflight.result }}
          ARM4_WASMTIME: ${{ needs.arm4-wasmtime.result }}
          DESKTOP: ${{ needs.desktop.result }}
        run: |
          set +e
          # 2026-10-30 审计批：needs/env/循环三面曾失衡（needs 11 而循环 10——
          # backend-triage 红/跳过时汇总不判红）；计数文案改由数组推导防再陈旧。
          # 2026-10-31 审阅批 P2-1：release-preflight 三面连坐补入（mutation-gate
          # 有「观察期不入 needs」豁免注记，本 job 无豁免理由——漏登记即同形复发）。
          pairs=(
            "build:$BUILD" "diff:$DIFF" "fuzz:$FUZZ" "native:$NATIVE"
            "wasm:$WASM" "static:$STATIC" "hygiene:$HYGIENE" "demo:$DEMO"
            "scripts-ts:$SCRIPTS_TS" "backend-triage:$BACKEND_TRIAGE"
            "cli-smoke-linux:$CLI_SMOKE_LINUX"
            "release-preflight:$RELEASE_PREFLIGHT"
            "arm4-wasmtime:$ARM4_WASMTIME"
            "desktop:$DESKTOP"
          )
          bad=0
          for pair in "${pairs[@]}"; do
            name="${pair%%:*}"; result="${pair#*:}"
            echo "$name=$result"
            if [ "$result" != "success" ]; then bad=1; fi
          done
          if [ "$bad" != "0" ]; then
            echo "::error::CI 汇总红：有 job failure/skipped——skipped 不算绿（防遮蔽）"
            exit 1
          fi
          echo "CI 汇总：${#pairs[@]} 个上游 job 全部 success"
        shell: bash

  # ── hygiene（记账型，2026-09-23 拆分）────────────────────────────────────
  # 红的含义是「账没跟上」而非「代码坏了」：文档漂移 / 工具链版本迁移 /
  # 产物新鲜度 / 格式 / 性能裁决的规模前提 / 构建卫生。白天推进时属预期债，
