# 单页 demo 部署（2026-09-30 建，同日审阅批修订）：
# 把 0.7.0 的 wasm-gc 单出口（gateway 4 函数导出）变成评委点得开的页面。
#
# ── 发布前置（人工一次性，GITHUB_TOKEN 无法自愈）────────────────
# actions/configure-pages 的 enablement 默认 false，自动启用 Pages 需要
# GITHUB_TOKEN 之外的有 admin 权限的 token——本 workflow 未传。因此**首次
# 发布前必须**：仓库 Settings → Pages → Source 选 "GitHub Actions"。
# 未做这步时本 workflow 在 configure-pages 步失败（不会静默 404）。
# 发布完成后用 curl -o /dev/null -w "%{http_code}" https://rustin-beep.github.io/Vitro/
# 验 200（README 徽章与「在线体验」链接都指向它；facts 等本地闸查不了外链可达性）。
#
# ── 形态 ────────────────────────────────────────────────────────
# 与 moonraft / MoUI Playground 同路：GitHub Pages + 现构建 wasm——
# demo/ 只入库静态源（HTML/JS/CSS），wasm.wasm 是构建产物不入库
# （.gitignore 有 demo/wasm.wasm），本 workflow 现构建后组装 artifact。
# 构建环境用 ubuntu：portability job 已实证 wasm-gc release 构建 + 行为
# 断言在该平台全绿（2026-09-29 起）；产物哈希的跨平台对账未做（诚实边界）。
#
# cancel-in-progress 用 false（官方 starter-workflows 模板同款）：部署中
# 被新 push 取消可能留下不一致的发布状态，生产部署让它跑完。
name: Deploy demo (GitHub Pages)

on:
  push:
    branches: [master]
    paths:
      # 触发面 ⊇ artifact 组装实际消费的源路径集（审阅 P2-1：曾漏
      # assets/logo〔品牌图拷贝源〕与 docs/scripts〔docs 子站渲染源〕——
      # 改这些不重部署 = 线上静默陈旧）
      - "demo/**"
      - "moonbit/**"
      - "assets/logo/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # P2-1（2026-10-30 处置批）：内联 unix.sh 收敛到 action 的 POSIX 分支
      # （uses 引用，.moonbit-version pin 单源）。史：本步曾裸 latest——
      # run 40824081754「core/abort in time_travel@0.9.0 解析断」实锤后
      # 2026-10-29 接 pin（#132 声明层纪律，实锤档案见 CHANGELOG）。
      - name: Install MoonBit toolchain (action, POSIX arm)
        uses: ./.github/actions/setup-moonbit

      - name: Build wasm-gc gateway (release)
        run: cd moonbit && moon build --release --target wasm-gc gateway/wasm
      - name: wasm-opt post-build
        # #120 批①（2026-10-17）：与 ci.yml build job 同款构建后置优化
        # （binaryen 132 钉版本 + sha256；-19.3% raw 实测）——demo 资产
        # 与 CI 防线消费同一优化形态产物。
        run: |
          node scripts/wasmopt/main.mts moonbit/_build/wasm-gc/release/build/gateway/wasm/wasm.wasm
          node scripts/wasmopt/main.mts -check moonbit/_build/wasm-gc/release/build/gateway/wasm/wasm.wasm

      # 语言包懒加载产物（#130 批② demo 接线）：engine.worker 动态 import
      # demo/teaching/langpack/langpack.js——vite 懒 chunk 缺失即 build 红，
      # 与 wasm 同款前置 cp。
      - name: Build langpack (moon js target)
        run: cd moonbit && moon build --release --target js teaching/langpack

      # gen_demo_algorithms 读 scripts/teaching_annotation_diff/rules.json——
      # 已随 #125 批 B 入库为真源（.json.mbt 出库），本 job 的 jsonmbt
      # clone/build/再生步随之摘除（干净检出即自洽）。

      # #273 批二：docs_preview 已迁 .mts（marked 渲染）——本 job 需 node ≥24
      # + scripts 依赖锁文件（仅运行期 marked，--omit=dev 不装工具链）。
      - name: Install Node (docs_preview .mts)
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install scripts runtime deps (lockfile)
        run: cd scripts && npm ci --omit=dev
      - name: Render docs site (current-only)
        run: node scripts/docs_preview/main.mts -section current -force -out demo-dist/docs

      - name: Assemble demo artifact (F4 收尾 2026-10-17：vite 唯一构建)
        run: |
          mkdir -p demo-dist/assets/logo
          # 算法侧栏数据（2026-10-04 发射化）：algorithms.js 不入库，**构建前**
          # 现场发射——F4 新栈 vite/rolldown 把 demo/algorithms.js 当构建期
          # import 解析（旧栈运行时 <script> 加载，发射序无谓；2026-10-17
          # 云端 Deploy 红收口：构建后再发射 = ENOENT）。生成器完备性断言
          # 即闸；生成器已于 #273 迁 .mts（node 由上面 setup-node 提供）。
          node scripts/gen_demo_algorithms/main.mts
          # wasm 同为构建期资产（engine.worker.ts ?url import 触发 vite
          # emit）——**vite build 前必须就位**（同上 ENOENT 坑型：构建后
          # 才拷 = 资产化缺失，Pages 404 且 boot 静默，#139）。产物经
          # hashed assets/ 分发，不再向 demo-dist 根裸拷。
          cp moonbit/_build/wasm-gc/release/build/gateway/wasm/wasm.wasm demo/wasm.wasm
          mkdir -p demo/teaching/langpack
          cp moonbit/_build/js/release/build/teaching/langpack/langpack.js demo/teaching/langpack/langpack.js  # 仅 .js（d.ts 相对引用不拷）
          # 新栈 = vite 唯一构建（demo/index.html + src/ → dist/）——旧栈
          # （app.ts/style.css/js 十一模块）已退役；base=./ 相对路径适配
          # Pages 项目页子路径。
          (cd demo && npm ci && npx vite build)
          cp -r demo/dist/* demo-dist/
          # 品牌 logo 三枚（favicon 自适应版 + 昼/夜 header 变体；来源 assets/logo/）
          cp assets/logo/vitro-icon.svg assets/logo/vitro-icon-light.svg assets/logo/vitro-icon-dark.svg demo-dist/assets/logo/
          # 组装自检（对 index.html+入口的本地资源做存在性断言，缺即红；
          # --no-ts 禁源发布——与 ci.yml PR 侧共用同一脚本）
          node scripts/demo_assemble_check/main.mts demo-dist --no-ts
          ls -la demo-dist demo-dist/assets/logo demo-dist/docs | head -24

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
