# 单页 demo 部署（2026-09-30 建，同日审阅批修订）：
# 把 0.7.0 的 wasm-gc 单出口（gateway 4 函数导出）变成评委点得开的页面。
#
# ── 发布前置（人工一次性，GITHUB_TOKEN 无法自愈）────────────────
# actions/configure-pages 的 enablement 默认 false，自动启用 Pages 需要
# GITHUB_TOKEN 之外的有 admin 权限的 token——本 workflow 未传。因此**首次
# 发布前必须**：仓库 Settings → Pages → Source 选 "GitHub Actions"。
# 未做这步时本 workflow 在 configure-pages 步失败（不会静默 404）。
# 发布完成后用 curl -o /dev/null -w "%{http_code}" https://rustin-beep.github.io/Vitro/
# 验 200（README 徽章与「在线体验」链接都指向它；facts 等本地闸查不了外链可达性）。
#
# ── 形态 ────────────────────────────────────────────────────────
# 与 moonraft / MoUI Playground 同路：GitHub Pages + 现构建 wasm——
# demo/ 只入库静态源（HTML/JS/CSS），wasm.wasm 是构建产物不入库
# （.gitignore 有 demo/wasm.wasm），本 workflow 现构建后组装 artifact。
# 构建环境用 ubuntu：portability job 已实证 wasm-gc release 构建 + 行为
# 断言在该平台全绿（2026-09-29 起）；产物哈希的跨平台对账未做（诚实边界）。
#
# cancel-in-progress 用 false（官方 starter-workflows 模板同款）：部署中
# 被新 push 取消可能留下不一致的发布状态，生产部署让它跑完。
name: Deploy demo (GitHub Pages)

on:
  push:
    branches: [master]
    paths:
      # 触发面 ⊇ artifact 组装实际消费的源路径集（审阅 P2-1：曾漏
      # assets/logo〔品牌图拷贝源〕与 docs/scripts〔docs 子站渲染源〕——
      # 改这些不重部署 = 线上静默陈旧）
      - "demo/**"
      - "moonbit/**"
      - "assets/logo/**"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain (unix)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Build wasm-gc gateway (release)
        run: cd moonbit && moon build --release --target wasm-gc gateway/wasm

      # ── jsonmbt 真相源再生（2026-10-09 补，修 run 37884966704）────────────
      # gen_demo_algorithms 读 scripts/teaching_annotation_diff/rules.json——
      # 该 .json 已随 jsonmbt 手写面第二批翻转遮蔽不入仓（.json.mbt 唯一真源，
      # 2026-10-09 refs #47），本 job 独立检出无 core 侧再生产物 ⇒ 组装步
      # FATAL 缺文件。全量 13 张枚举再生（与 ci.yml core/hygiene 同款——
      # 防后续翻转批再撞本 job 的隐藏消费面）。exe 后缀双兼容（本 job
      # ubuntu 无 .exe，与 core 的 windows 形态共用脚本段）。
      - name: Build jsonmbt (truth-source regenerator)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/rustin-beep/jsonmbt.git "$RUNNER_TEMP/jsonmbt"
          cd "$RUNNER_TEMP/jsonmbt"
          moon update
          MOON_CC=clang moon build --target native --release
          exe="$RUNNER_TEMP/jsonmbt/_build/native/release/build/cmd/jsonmbt/jsonmbt"
          [ -f "$exe" ] || exe="$exe.exe"
          echo "JSONMBT_EXE=$exe" >> "$GITHUB_ENV"

      - name: Regenerate truth-source JSON (.json.mbt -> .json)
        shell: bash
        run: |
          set -e
          files=$(git ls-files 'scripts/**/rules.json.mbt' 'scripts/**/host_route_rules.json.mbt')
          count=$(printf '%s\n' "$files" | grep -c .)
          if [ "$count" -ne 14 ]; then
            echo "FATAL: 期望 14 张规则真相源，实得 $count"
            printf '%s\n' "$files"
            exit 2
          fi
          for m in $files; do
            "$JSONMBT_EXE" build --pretty "$m"
          done

      # docs 子站：-section current（62 篇活跃文档；112 篇 archive 内部
      # 历史档案不进对外站点）→ 组装进 demo-dist/docs/（Pages 单站点
      # 单 artifact，docs 以子路径共存；ubuntu runner 自带 Go）
      - name: Render docs site (current-only)
        run: go run ./scripts/docs_preview -section current -force -out demo-dist/docs

      - name: Assemble demo artifact
        run: |
          mkdir -p demo-dist/assets/logo
          # TS 重写批（2026-10-04，refs #28）：源 = app.ts + js/*.ts，发射产物
          # 不入库（与 wasm.wasm 对称）——组装前置发射（发射即类型检查闸；
          # 源 .ts 在库、产物 CI 现场生成）
          (cd demo && npm ci && npx tsc -p tsconfig.json)
          # 算法侧栏数据同形态（2026-10-04 发射化）：algorithms.js 不入库，
          # 组装前现场发射（生成器完备性断言即闸；ubuntu runner 自带 Go）
          go run ./scripts/gen_demo_algorithms
          cp demo/*.html demo/*.css demo/*.js demo-dist/
          cp -r demo/js demo-dist/
          rm -f demo-dist/js/*.ts
          # 品牌 logo 三枚（favicon 自适应版 + 昼/夜 header 变体；来源 assets/logo/）
          cp assets/logo/vitro-icon.svg assets/logo/vitro-icon-light.svg assets/logo/vitro-icon-dark.svg demo-dist/assets/logo/
          cp moonbit/_build/wasm-gc/release/build/gateway/wasm/wasm.wasm demo-dist/wasm.wasm
          # 组装自检（外部审阅实锤的盲区：本地直开 demo/ 看不出、demo_smoke 协议
          # 级/lint 文本对账都抓不到拷贝面缺口——对 index.html+入口 import 的
          # 本地资源做存在性断言，缺即红）
          # 2026-10-04 审阅 P2-2/P3-③ 单源化：原内联正则要求 src="./..." 而
          # HTML 实写 src="cases.js" ⇒ HTML 路 0 命中、删 cases.js 仍绿——
          # 改脚本化（script/img/import 三面 + 抽取退化哨兵 + --no-ts 禁源
          # 发布），与 ci.yml PR 侧共用同一脚本（P3-②）
          node scripts/demo_assemble_check/main.js demo-dist --no-ts
          ls -la demo-dist demo-dist/assets/logo demo-dist/docs | head -24

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
