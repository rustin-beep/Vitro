<text class="ts" x="594" y="198" text-anchor="middle">Instance 1</text>
<text class="tc" x="594" y="228" text-anchor="middle">1MB 线性内存 ✓</text>
<text class="tc" x="594" y="256" text-anchor="middle">全局状态 ✓</text>
<text class="tc" x="594" y="284" text-anchor="middle">VFS + rand MT19937 ✓</text>
<text class="tc" x="594" y="312" text-anchor="middle">GC 堆（wasm-gc）</text>
<text class="tc" x="594" y="338" text-anchor="middle">绑定 1 线程 · 1 会话</text>
