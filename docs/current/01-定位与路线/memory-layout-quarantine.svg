<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="vitro 线性内存布局与有界隔离">
  <title>VitroVM · 1MB 线性内存布局 + 堆有界隔离（Bounded Quarantine）</title>
  <!-- 由 scripts/gen_svg 生成（勿手改）：对账 内存安全规范.md §3.4 + 堆有界隔离决议.md §1–§5；地址段为设计常量（非快照，无 data-fact 锚） -->
  <style>
    .bg     { fill: #FFFFFF; }
    .core   { fill: #155E86; fill-opacity: .07; stroke: #155E86; stroke-width: 3; }
    .card   { fill: #155E86; fill-opacity: .05; stroke: #155E86; stroke-width: 2.5; }
    .cons   { fill: none; stroke: #94A3AD; stroke-width: 2; }
    .warn   { fill: #155E86; fill-opacity: .04; stroke: #94A3AD; stroke-width: 2; stroke-dasharray: 7 5; }
    .plan   { fill: none; stroke: #94A3AD; stroke-width: 1.8; stroke-dasharray: 5 4; }
    .line   { stroke: #94A3AD; stroke-width: 3; fill: none; }
    .edge   { stroke: #94A3AD; stroke-width: 2.5; fill: none; }
    .ahf    { fill: #94A3AD; stroke: none; }
    .tn     { font-family: "Consolas","Cascadia Mono",monospace; font-size: 17px; fill: #155E86; stroke: none; }
    .zone   { fill: #155E86; fill-opacity: .028; stroke: #155E86; stroke-width: 1.6; }
    .tt     { font-family: "Segoe UI","Microsoft YaHei",sans-serif; font-size: 34px; font-weight: 600; fill: #0D1B24; stroke: none; }
    .t      { font-family: "Segoe UI","Microsoft YaHei",sans-serif; font-size: 23px; fill: #0D1B24; stroke: none; }
    .ts     { font-family: "Consolas","Cascadia Mono",monospace; font-size: 21px; fill: #155E86; stroke: none; }
    .tm     { font-family: "Segoe UI","Microsoft YaHei",sans-serif; font-size: 20px; fill: #5A6B75; stroke: none; }
    .tc     { font-family: "Segoe UI","Microsoft YaHei",sans-serif; font-size: 18px; fill: #5A6B75; stroke: none; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0D1B24; }
      .core { stroke: #4FB3E8; fill: #4FB3E8; fill-opacity: .1; }
      .card { stroke: #4FB3E8; fill: #4FB3E8; fill-opacity: .07; }
      .zone { stroke: #4FB3E8; fill: #4FB3E8; fill-opacity: .05; }
      .cons, .warn, .plan { stroke: #5A6B75; }
      .line, .edge { stroke: #5A6B75; }
      .ahf  { fill: #5A6B75; }
      .tt, .t { fill: #E9F1F7; }
      .ts, .tn { fill: #4FB3E8; }
      .tm, .tc { fill: #94A3AD; }
    }
  </style>
  <rect class="bg" width="1200" height="900"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ahf"/>
    </marker>
  </defs>
<text class="tt" x="600" y="56" text-anchor="middle">VitroVM · 1MB 线性内存布局 + 堆有界隔离</text>
<text class="tm" x="600" y="94" text-anchor="middle">VM 的堆不是宿主 allocator，而是 1MB 线性内存中的一段；释放不立即归还，先进有界隔离区（FIFO 驱逐复用）</text>
<rect class="zone" x="150" y="122" width="410" height="120" rx="0"/>
<text class="t" x="355" y="158" text-anchor="middle">栈 Stack（顶 = 1MB）</text>
<text class="tc" x="355" y="188" text-anchor="middle">自高地址向下 ↓</text>
<text class="tc" x="355" y="214" text-anchor="middle">局部变量 / 调用帧</text>
<rect class="zone" x="150" y="242" width="410" height="80" rx="0"/>
<text class="t" x="355" y="276" text-anchor="middle">argv</text>
<text class="tc" x="355" y="306" text-anchor="middle">自 0x10000（64KB）向下分配</text>
<text class="tc" x="355" y="372" text-anchor="middle">（未用地址空间）</text>
<rect class="warn" x="150" y="402" width="410" height="120" rx="0"/>
<text class="t" x="355" y="436" text-anchor="middle">隔离区 quarantine</text>
<text class="tc" x="355" y="466" text-anchor="middle">FIFO · 预算 = 堆上限 1/4 = 256KB</text>
<text class="tc" x="355" y="492" text-anchor="middle">超预算驱逐最老已释放块</text>
<rect class="zone" x="150" y="522" width="410" height="60" rx="0"/>
<text class="tc" x="355" y="562" text-anchor="middle">bump 已分配 ↑（顶指针 O(1)）</text>
<rect class="zone" x="150" y="582" width="410" height="60" rx="0"/>
<text class="tc" x="355" y="622" text-anchor="middle">first-fit 复用（驱逐后归还）</text>
<rect class="zone" x="150" y="642" width="410" height="80" rx="0"/>
<text class="t" x="355" y="674" text-anchor="middle">全局区（0x1000 起）</text>
<text class="tc" x="355" y="702" text-anchor="middle">全局变量·extern·vtable·字符串字面量·静态局部</text>
<text class="tc" x="355" y="754" text-anchor="middle">0x0–0x1000 保留</text>
<line class="cons" x1="116" y1="122" x2="150" y2="122"/>
<text class="ts" x="20" y="129" text-anchor="start">0x100000</text>
<line class="cons" x1="116" y1="322" x2="150" y2="322"/>
<text class="ts" x="20" y="329" text-anchor="start">0x10000</text>
<line class="cons" x1="116" y1="642" x2="150" y2="642"/>
<text class="ts" x="20" y="649" text-anchor="start">0x5000</text>
<line class="cons" x1="116" y1="722" x2="150" y2="722"/>
<text class="ts" x="20" y="729" text-anchor="start">0x1000</text>
<line class="cons" x1="116" y1="776" x2="150" y2="776"/>
<text class="ts" x="20" y="783" text-anchor="start">0x0</text>
<rect class="card" x="610" y="122" width="560" height="192" rx="12"/>
<text class="t" x="890" y="154" text-anchor="middle">bump 分配 + 有界隔离（决议 2026-09-11）</text>
<text class="tc" x="630" y="188" text-anchor="start">malloc：顶指针 O(1) 推进；隔离超预算 → 先 FIFO 驱逐</text>
<text class="tc" x="630" y="214" text-anchor="start">free：标记 + 进 FIFO 隔离区，不立即归还</text>
<text class="tc" x="630" y="240" text-anchor="start">realloc：恒为新块拷贝（与 glibc 常见路径一致）</text>
<text class="tc" x="630" y="266" text-anchor="start">heap_base = max(0x5000, align4(global_data_end))（R1）</text>
<text class="tc" x="630" y="292" text-anchor="start">预算会话可调：vitro_set_quarantine_budget（默认 256KB）</text>
<rect class="card" x="610" y="334" width="560" height="208" rx="12"/>
<text class="t" x="890" y="366" text-anchor="middle">教学四场景（churn / leak 正确分离）</text>
<text class="tc" x="630" y="400" text-anchor="start">churn：隔离稳态 ≤ 预算，驱逐复用 → 无限可跑（不误伤）</text>
<text class="tc" x="630" y="426" text-anchor="start">leak：不进隔离区，bump 推进 → 撞 1MB 墙 → 教学 trap</text>
<text class="tc" x="630" y="452" text-anchor="start">UAF：检测窗口 = 最近 256KB free 历史，覆盖率极高</text>
<text class="tc" x="630" y="478" text-anchor="start">Double-Free：隔离窗口内地址不复用 → 必检出</text>
<text class="tc" x="630" y="504" text-anchor="start">时间旅行：隔离窗口内内存单调（CoW 与确定性受益）</text>
<rect class="card" x="610" y="562" width="560" height="140" rx="12"/>
<text class="t" x="890" y="594" text-anchor="middle">三道墙（决议 §6，全部已实施）</text>
<text class="tc" x="630" y="628" text-anchor="start">① 1MB 堆墙：malloc 耗尽 → 返 NULL + 教学 trap</text>
<text class="tc" x="630" y="654" text-anchor="start">② 步数保险丝 max_steps（会话配置，reset 保留）</text>
<text class="tc" x="630" y="680" text-anchor="start">③ region 表封顶（记账侧有界）</text>
<rect class="zone" x="610" y="722" width="560" height="92" rx="12"/>
<text class="tc" x="630" y="750" text-anchor="start">MoonBit vitro/engine/memory 已建包（S6）</text>
<text class="tc" x="630" y="774" text-anchor="start">MemoryMap + check_access 单入口 + FreedLogs 二分</text>
<text class="tc" x="630" y="798" text-anchor="start">地址布局常量定义点仍在 L6 bytecode</text>
<text class="tc" x="600" y="848" text-anchor="middle">诚实记录：隔离窗口外 UAF 可能漏检——free 与误用之间 churn 超过 256KB 后，*p 落在已复用块（同 ASAN quarantine 行为）</text>
<text class="tc" x="600" y="874" text-anchor="middle">布局示意不按比例 · 对账 内存安全规范 §3.4 + 堆有界隔离决议 · 漂移重生成：go run ./scripts/gen_svg memory</text>
</svg>
