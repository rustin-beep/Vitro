       F4 全量迁移时接 index.html 同款 localStorage 主题脚本） -->
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vitro 前端试点 · Svelte 5（F1）</title>
    <!-- 令牌 CSS 经 src/app.css 的 @import 打包引入（public 资产 link 会被 vite 丢弃） -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
