name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # 夜间全量重算（北京时间 02:00）：Clang Golden 缓存强制失效重算，防版本漂移
    # （见 scripts/shadow_verify.go 文件头与 docs/current 工作记录）
    - cron: '0 18 * * *'

# 前端切割（2026-09-11）：CideFlutter / FRB / flutter-android-ios jobs 已随前端
# 迁出（标签 before-frontend-split 保留完整历史）。本仓库现为纯后端仓，
# CI 验证 Rust 引擎 + 三出口防线 + wasm 出口冒烟（G2）。
#
# ── core / hygiene 两 job 拆分（2026-09-23，用户裁定）────────────────────────
# 此前单 job 全部步骤一个红灯，"CI 老是红"的信噪比问题来自两类检查混灯：
#   core  = 准入型（代码/契约坏了）——红了立即处置，当天清；
#   hygiene = 记账型（文档/环境/产物与真值的账没跟上）——白天推进时是预期债，
#           夜间批量复绿，不阻塞推进。
# 分类判据一句话：红了是否意味着「这一批提交不能要」——否则归 hygiene。
# 工具链追新是既定策略（MoonBit 未到 1.0，breaking 只能跟着走），故
# toolchain_probe 红属 hygiene：含义是「该走 moon-toolchain-upgrade-playbook
# 迁移流程了」，不是「代码坏了」。
# 过时 push 的 run 自动取消（2026-10-03 拆批接线）：连续 push 时只有最新
# commit 的 run 跑满全程（此前每笔 push 都烧满 ~19 分钟——9981ac2 三笔连红
# 实证）；schedule 夜间全量重算与手动触发不受取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}


# ── 闸级 job 化（2026-10-11，防线建设批）────────────────────────────────
# 此前 core 单 job 串 60 步——一步红后续全 skip，B 闸红遮 C 闸红（16/20 红
# 步骤分布实证：fmt×4/TSV×3/直拍×3/台账×2/单发×6 轮换，"改了又红"根因）。
# 拆分后闸与闸互不遮挡：build 红挡下游（产物无——合理依赖）；
# 六实例差分矩阵逐驱动独立红绿。配合语义统一（--freeze-mb 默认含存量重算、
# --refresh 删除 fail loud）消灭「入新键 vs 刷存量 vs 手删旧键」三套心智。
#
# 分类判据沿袭（红了是否意味着这批不能要）：
#   build-and-unit = 准入（编译/单测坏）——下游全 needs 它
#   gates-diff     = 行为差分（matrix 六实例独立）
#   gates-native   = 消费 exe 的协议/冒烟族
#   gates-wasm     = wasm 臂族 + cli smoke
#   static-gates   = 纯对账/生成器闸（无产物依赖——与 build 并行）
#   hygiene        = 记账型（fmt/四 target test/环境探针）
#
# ── 主 CI 恒全量裁定（2026-10-15，CI 全跳事故后）──────────────────────────
# 本文件**无任何条件跳过**（不做 changes 分类器/不做 docs-only 快车道）——
# 10da06a6 的 changes job 形态实锤两个单点故障：分类器挂=全 job 雪崩 +
# 提交信息正文提及 GitHub 跳过指令方括号字样（方括号形态本注释不写出——写出即触发）即原生全跳
# ——两机制叠加致 CI 防线静默失守两笔。moonbitlang 生态考察（core/moon）
# 共识 = 主 CI 恒全量；文档减负需求由独立薄 workflow 承接（docs-quick.yml，
# on.paths 原生过滤、与主 CI 完全解耦、红不阻塞）。本文件报绿 = 防线真绿。


jobs:
  build-and-unit:
    name: Build & unit tests (准入型基础)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Go vet (scripts)
        run: go vet ./scripts/...

      # 2026-09-22 闸缺口补齐：go test ./scripts/... 此前**不在 CI**——
      # scripts 侧已有 5 包 / 10 文件 / 58 个 J9·性质测试（CLI 契约锚 10、
      # 归一性质锚 7、docs_preview 7、facts 30、toolchain_probe 基线判定锚 4），
      # 全部只在本地可跑、CI 一直抓不到。"判定函数坏了的『全绿』比没有门禁
      # 更坏"（J9 义务原话）——本步骤退非 0 即红。测试面全为纯函数 /
      # t.TempDir() 夹具，不依赖 moon 工具链、cargo 产物或 reports/（后者被
      # gitignore，CI 上不存在）；故接线在 go vet 旁而非 MoonBit 步骤之后，
      # 可先行失败。
      - name: Go test (scripts)
        run: go test ./scripts/...

      # Clang Golden 缓存（方案 A）：结果是确定性的（同一源码 + 同一 clang 版本
      # ⇒ 同一结果），跨 CI 运行复用可把 Shadow 从分钟级降到秒级。
      # key 含 clang 版本 —— 版本一变缓存自动失效，这就是"防版本漂移"的第一道闸；
      # 第二道闸是夜间 schedule 的 --refresh-clang 全量重算。
      - name: Install MoonBit toolchain (differential anchors)
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.moon\bin"


      - name: MoonBit unit tests (moon test)
        # 2026-09-20 审阅补线：moon test 此前无独立门禁步骤——仅 facts
        # --run 间接跑（采集失败只记 unavailable 不红），且 README 测试
        # 数为分解式（facts 归人工维护不机判），两路都不拦挂用例。本
        # 步骤退非 0 即红，MoonBit 侧防线自此有牙。
        shell: bash
        # --target native：把 native-only 包的锚（fs 9 + gateway 91，2026-10-04
        # 实测差值 741-641=100——原注「fs 9 + cmd/serve 14，差值 527-504=23」
        # 系 2026-09-20 接线时点的 as-of 快照，CI 拆批搬运时未随刷，审阅 P3-⑧
        # 勘正）纳入门禁——此前 CI 从不跑它们（默认 wasm target
        # 不含 native-only 包，check --target all 只抓编译错不抓行为错），
        # fs 是 cmd 工具链五包的依赖，行为可信度只剩本地手工证据（审阅八轮
        # P2①）。native 后端同跑 wasm 侧测试无冲突（超集）。
        run: cd moonbit && moon test --target native

      # ── 静态对账闸族（秒级批量，fail fast 先于分钟级行为闸）────────────
      - name: Full native release build gate (declared targets must build)
        # 2026-09-29 §12.6 建；同日拆包落地后转硬门（豁免分支已删——
        # gateway 本体改 library，4 导出面在 gateway/wasm 外壳，wasm-gc
        # 单目标）。全量 --target native 是唯一会遍历每个包的形态。
        # MOON_CC=clang（纪律 11 + 2026-10-05 审阅批）：被测物构建器与本地
        # 一致（MSVC 构建的 cmd/run 在 UB 语料上结局可漂——bTree_default
        # 0xC0000005 vs clang 构建受检 trap，known_direct 双集补录在案）；
        # 且 MSVC 全量构建实测 12m51s，clang 显著更快（moon#2254）。
        shell: bash
        run: |
          cd moonbit
          MOON_CC=clang moon build --release --target native
          echo "全量 native release 构建：通过（每个包都真的被构建过）"
      - name: wasm-gc gateway build (artifact source)
        # 自「wasm-gc gateway build + Node host smoke」拆出（2026-10-11）：
        # 构建归本 job（产物进 artifact），Node smoke 归 gates-wasm。
        shell: bash
        run: cd moonbit && moon build --release --target wasm-gc gateway/wasm
      - name: Full js target build gate (all packages) + CLI entry (artifact source)
        # 三后端批（2026-10-15）：js 入口产物——gates-wasm 的 smoke 前置
        # 产物检查消费（cmd/vitro_js/vitro_js.js）。
        # 全量 js 编译闸（2026-10-15 补——审阅指出缺口）：此前只编
        # cmd/vitro_js 单入口树，其余包的 js 目标编译错（如 gateway 改
        # extern "js" 面）只有 moon test --target js 的测试遍历能抓——
        # 零测试包 js 编译坏不红。全量形态与 Full native release build
        # gate 同构（js 无 C 链，冷态成本远低于 native 全量）。
        shell: bash
        run: cd moonbit && moon build --release --target js
      - name: Upload build products (native release exe set + wasm module + js entry)
        # 拆批基建（2026-10-11 闸级 job 化）：release 全量构建产物供下游
        # gates-diff / gates-native / gates-wasm / demo 消费——四个 job 免重复
        # 构建（此前 core 串行一步红全断；闸间遮挡即此形态）。download 侧
        # path=moonbit/_build 还原相对布局（脚本内置路径零改动）。
        uses: actions/upload-artifact@v4
        with:
          name: build-products
          path: |
            moonbit/_build/native/release/build/**/*.exe
            moonbit/_build/wasm-gc/release/build/gateway/wasm/wasm.wasm
            moonbit/_build/js/release/build/cmd/vitro_js/vitro_js.js
            moonbit/_build/js/release/build/cmd/vitro_wasm/vitro_wasm.js
          retention-days: 3
  gates-diff:
    name: Diff gate (${{ matrix.driver }})
    needs: build-and-unit
    runs-on: windows-latest
    strategy:
      # 闸级可见性全开：六实例互不取消（一红不见其余）。
      # exe 需求分两类（2026-10-11 校正）：parser/lexer/typeck/codegen 四家
      # 驱动内部 `moon run --target native cmd/dump_*` 现场构建（只要 moon
      # 在 PATH，自建增量 2-4 分钟并行无妨）；vm_diff / clang_direct 读
      # release 路径 cmd/run exe（全量构建分钟级——消费 artifact 免重复）。
      fail-fast: false
      matrix:
        include:
          - driver: parser_diff
            needs_artifact: false
          - driver: lexer_diff
            needs_artifact: false
          - driver: typeck_diff
            needs_artifact: false
          - driver: codegen_diff
            needs_artifact: false
          - driver: vm_diff
            needs_artifact: true
          - driver: clang_direct
            needs_artifact: true
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit toolchain (driver-embedded moon run)
        if: ${{ !matrix.needs_artifact }}
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.moon\bin"
      - uses: actions/download-artifact@v4
        if: ${{ matrix.needs_artifact }}
        with:
          name: build-products
          path: moonbit/_build
      - name: Clang version (for cache key)
        id: clangver
        shell: bash
        run: echo "value=$(clang --version | head -n1 | tr -d ' ' | cut -c1-48)" >> "$GITHUB_OUTPUT"

      - name: Cache Clang golden results
        uses: actions/cache@v4
        with:
          path: |
            .clang_cache_cd
          # key 含驱动脚本哈希：缓存 schema/口径变化时整体失效。
          # go1 缓存条目与历史 Python 条目（schema=1）同目录共存、key 空间不相交。
          key: clang-golden-${{ runner.os }}-${{ steps.clangver.outputs.value }}-${{ hashFiles('scripts/clang_direct/main.go', 'scripts/vm_diff/main.go', 'scripts/internal/**/*.go') }}
          restore-keys: |
            clang-golden-${{ runner.os }}-${{ steps.clangver.outputs.value }}-

      # D5 语言迁移最后一站（2026-09-13）：C 影子验证主驱动 Python→Go。
      # 双轨对账 PASS（663 用例集合/顺序/逐用例 diff_type/summary/category_frequency
      # 全一致）后切换；Python 版 shadow_verify.py 已退役删除。
      # === 工序④删区批（2026-10-05）：Rust 臂整体移除 ===
      # 被删 = Rust 本体（build/test/clippy/coverage）+ 被测物为 Rust DLL 的防线（shadow ×2/
      # serve smoke Rust 臂）+ 断言对象为 oracle 的（replay/three-tier/C-ABI/wasm32/freeze 新鲜度闸）。
      # 差分五驱动自动降级 --golden 冻结基线；protocol_frames 保 mb 单臂帧基线；
      # 语义防线 = clang_direct（真值 Clang）+ moon test。
      - name: Run diff driver (full four corpora)
        shell: bash
        run: |
          case "${{ matrix.driver }}" in
            parser_diff|lexer_diff|typeck_diff|codegen_diff)
              for d in baseline knr leetcode gap; do
                go run ./scripts/${{ matrix.driver }} corpus/$d
              done
              ;;
            vm_diff)
              go run ./scripts/vm_diff
              ;;
            clang_direct)
              go run ./scripts/clang_direct
              ;;
          esac
  gates-native:
    name: Native protocol & parity gates (consume exe)
    needs: build-and-unit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # 拆批修复（2026-10-11 CI 实锤）：rules.json 不入仓（jsonmbt 真源
      # 纪律 13——.json 由本段再生），libc_boot 断供即此。regen 三步前置。
      - name: Install MoonBit toolchain (differential anchors)
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.moon\bin"



      # ── gen_api_help rules.json（#125 收尾，2026-10-15）───────────
      # gen_api_help 内容批收敛（rules.json ≡ 原 .json.mbt 零漂移）后随
      # jsonmbt 退场翻转出库——scripts 侧 .json.mbt 清零，本 job 的
      # .json.mbt static gate 步随之摘除（moon 需求由差分驱动内嵌
      # moon run 承担，工具链安装保留）。

      - uses: actions/download-artifact@v4
        with:
          name: build-products
          path: moonbit/_build
      - name: Install MoonBit toolchain
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.moon\bin"

      - name: libc bootstrap parity (MoonBit library mode vs Rust export)
        # 2026-09-22 S5 尾项『libc 自举』接线：命题是「MoonBit 引擎能否编译
        # 自己的标准库 C 源，且产物与 Rust oracle 逐字节一致」。两侧形态不
        # 同（Rust export 11 键 / MoonBit dump 14 键），故以 stub main +
        # wrapper 截断 + 删 main 的 export 口径过滤后，投影到 9 个交集字段
        # 比对（含 code 段逐指令）。J9 证红：注入 code[1].operand +1 必红。
        # 依赖 Rust release 二进制（与 codegen_diff 同）。
        shell: bash
        run: go run ./scripts/moonbit/libc_boot_diff

      - name: Protocol first consumer (fields-level validation on real engine output)
        # 2026-09-22 接线（架构审阅 v2 A 组 #10 / §8.5「第一个消费者跑通」）：
        # 用**生成的**协议面（protocol/fields.mjs）消费**真实的**引擎输出
        # （cmd/serve 的 step 流——MoonBit 侧同协议现役实现），逐字段校验 +
        # 最小内容层渲染。
        # 审阅 P1（2026-10-05）：本步此前零前置构建——consumer 缺省引擎路径
        # 在干净检出上必红（本地被历史 release 产物掩盖，D1 问四+问五叠加）。
        # 现自带 debug 构建（与 protocol_frames 同款产物形态与位置）。
        # **限制（诚实登记）**：本环境无 npm/tsc，故只能验「生成物描述得了真实输出」，
        # 验不了「字段名写错在 tsc 编译期即红」——后者是 TS 的核心收益，待 tsc 就绪。
        shell: bash
        run: |
          cd moonbit && MOON_CC=clang moon build --target native cmd/serve && cd ..
          node protocol/consumer.mjs

      # serve 协议帧字段级冻结（S7 批四号交付物第三件，2026-10-04 兑现）：
      # 固定请求序列 × 双宿主（release vitro_cli + cmd/serve）→ canonicalize
      # → mask（已知分叉外置 rules.json）→ 与入库基线 baseline.jsonl 逐帧
      # 比对。差分性质（消费 oracle 臂）——归 core 随 Rust 退役转单臂基线比
      # （退役时删 rust 臂采集段即成）。前置：release vitro_cli（上一步）+
      # moonbit cmd/serve（本步自建 debug 形态，与 moonbit job 同产物）。
      - name: Protocol frames freeze (dual-host, canonicalized)
        run: |
          cd moonbit && MOON_CC=clang moon build --target native cmd/serve && cd ..
          go run ./scripts/protocol_frames
        shell: bash

      # G2（R4）：出口 2 守护——wasm32 构建 + Node 冒烟（ABI 导出 + capi 全链路，
      # 纯 stdout 通道断言；wasm-bindgen 占位导入以 Proxy 桩通过）
      - name: MoonBit serve smoke (dual-host, Exit 3)
        run: |
          cd moonbit && moon build --target native cmd/serve && cd ..
          go run ./scripts/serve_smoke -moonbit
        shell: bash

      # replay MoonBit 臂（S7 批四号留批义务兑现，2026-10-04）：S1–S5 帧序列
      # 断言全集跑 cmd/serve（同一断言集，豁免面 scripts/replay/
      # moonbit_exemptions.json——主跑即审计：PASS 即 ZOMBIE 红防僵尸）。
      # 复用上一步构建的同一 exe（debug 路径零重建）；Rust 臂在 core job。
      - name: replay S1-S5 protocol assertions (MoonBit arm)
        run: go run ./scripts/replay -moonbit
        shell: bash

      # 豁免面僵尸审计（D19，2026-10-01 审阅 P2 处方）：豁免全部失效真跑
      # 一轮——原豁免条目 PASS/未触达即僵尸红，FAIL=合法豁免。J9 留痕：
      # 注入假豁免（真 PASS 断言）→ ZOMBIE(PASS) exit 1；净表 exit 0。
      - name: Teaching annotation diff (family-incremental golden, Exit 1)
        run: go run ./scripts/teaching_annotation_diff
        shell: bash

      # ── wasm-gc / demo 闸族（产物复用链内构建）────────────────────────
      # S7 批五号（2026-09-29）：wasm-gc 单出口（F-5）——gateway 4 函数导出
      # （invoke/reset/protocol_version/engine_version，js-string builtins 直传）
      # + Node 宿主冒烟（R11 证据链：NDJSON 全链 + E3070/E3061 真 trap 断言 +
      # 体积上限；J9 双路证红：坏产物 exit 2 CompileError + 断言注入 FAIL）。
      - name: MoonBit exemption audit (zombie detector, D19)
        run: go run ./scripts/serve_smoke -moonbit -audit-exemptions
        shell: bash

      # S8 teaching 批四号（2026-10-01）：算法标注族级增量对拍——MoonBit
      # cmd/serve 与 Rust golden（algorithm_annotations_v3.json）的首现序列
      # 比对（compile→run→step.begin→step.next×4000；只比已迁移族——
      # rules.json 外置迁移集+豁免面；双向模板集断言；serve exe 由上一步
      # 构建）。J9 双路证红：golden desc 篡改 → exit 1（连锁红）；
      # step_budget 40 → exit 1（首现缺失）。

  gates-wasm:
    name: wasm-arm gates & CLI smoke
    needs: build-and-unit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node 25
        uses: actions/setup-node@v4
        with:
          node-version: "25"
      - name: Install MoonBit toolchain
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.moon\bin"
      - uses: actions/download-artifact@v4
        with:
          name: build-products
          path: moonbit/_build
      # protocol_frames wasm 臂读 rules.json——已随 #125 批 B 入库为真源
      # （.json.mbt 出库），本 job 的 jsonmbt clone/build/再生步随之摘除。

      - name: wasm-gc gateway build + Node host smoke (Exit 2)
        # setup-node pin（2026-09-29 审阅 P3-3）：js-string 内建需较新 V8；
        # host.js 两段式实例化兼容 22 系但判定面在 25 上定版——pin 25。
        # 体积上限由 host.js 断言（1.5MB）——数字不进注释（无锚手工数字教训）
        uses: actions/setup-node@v4
        with:
          node-version: "25"
      - name: wasm-gc gateway build + Node host smoke (run)
        run: |
          cd moonbit && moon build --release --target wasm-gc gateway/wasm && cd ..
          node scripts/wasm_gateway/host.js
        shell: bash

      # 统一 CLI 入口闸（#49 批一，2026-10-06）：wasm 壳（scripts/vitro_cli/
      # main.js）四子命令 rc 契约 + **双臂同形对拍**（壳 vs native cmd/vitro
      # exe——note 通道/TRAP 文本/标记行协议逐行一致，零 canonicalize 特例；
      # 唯一剥离 = backend 标注行）+ launcher 双形态语义。J9 证红：篡改壳
      # note 前缀 → B 组双臂对拍红（已留痕）。前置 = 上一步 gateway wasm
      # 产物 + 本步自建 cmd/vitro native exe（纪律 11 MOON_CC=clang）+ Go
      # （core job 天然）+ node 25（上方 setup-node）。
      - name: unified CLI smoke (wasm shell vs native exe)
        run: |
          cd moonbit && MOON_CC=clang moon build --release --target native cmd/vitro && cd ..
          go run ./scripts/vitro_cli_smoke --corpus 30
        shell: bash

      # algorithms.catalog 三方对账（#36，2026-10-16）：判据源码 build_match
      # 提取物 ↔ 引擎导出（native vitro.exe + js vitro_js.js 双臂互拍）↔
      # rules.json 43 族 ↔ gen_demo_algorithms 分组表。J9：--catalog-selftest
      # 两路内存注入证红。前置：node（上方）+ native vitro（上一步）+ js
      # 产物 EnsureFresh 自建。
      - name: algorithms.catalog three-way check (dual-arm)
        run: go run ./scripts/teaching_annotation_diff --catalog-check
        shell: bash

      # 防线 wasm 臂（#49 批二段三：实证面搬家——vm_diff/clang_direct 被测物
      # 切统一入口壳消费 gateway wasm.wasm）：三联（stdout/退出码/1MB 映像）
      # 与冻结 golden 全量对拍。前置 = 上方 gateway wasm 产物 + node 25 +
      # Go（core 天然）；产物新鲜度由脚本自带门禁兜（#41 毒化机判）。
      # 全量各 ~80s（本地实测 609/704 例）。
      - name: vm_diff wasm arm (gateway product vs frozen golden)
        run: go run ./scripts/vm_diff --backend wasm
        shell: bash
      - name: clang_direct wasm arm (gateway product vs Clang)
        run: go run ./scripts/clang_direct --backend wasm
        shell: bash

      # serve 通道 wasm 臂（#49 批三段一）：三防线被测物切统一入口壳 serve
      # 子命令——replay 61 断言 / serve_smoke 68 断言（豁免面 wasm 段臂分
      # 家）/ protocol_frames 47 帧基线（48 序列 - capabilities 结构豁免；二轮审阅 P3 补 trap step 流 14 帧——#35 trap 帧冲刷发布 + is_trapped 守卫形态帧级锚）。前置同上（gateway wasm + node 25）。
      - name: replay wasm arm (shell serve)
        run: go run ./scripts/replay --backend wasm
        shell: bash
      - name: serve_smoke wasm arm (shell serve)
        run: go run ./scripts/serve_smoke --backend-wasm
        shell: bash
      - name: protocol_frames wasm arm (shell serve)
        run: go run ./scripts/protocol_frames --backend-wasm
        shell: bash
      - name: teaching_annotation_diff wasm arm (shell serve)
        run: go run ./scripts/teaching_annotation_diff --backend-wasm
        shell: bash

      # 审阅 P1-2（2026-09-30）：demo 静态资产的判定闸（03-D17 形态——
      # HTML/JS/CSS 原不在任何闸的扫描面）。对 cases.js 每个预置用例实跑
      # 协议链：golden 逐字节 + 页面渲染所需响应字段存在性。复用上方
      # wasm-gc 构建产物；J9 证红：篡改 cases.js golden 即红（已留痕）。
      # TS 重写批（2026-10-04，refs #28）：demo/js 产物不入库——消费产物的
      # 步骤一律前置发射（npm ci + tsc，发射即检查闸；本步的 method 消费面
      # 扫描读 .ts 源不依赖产物，但运行依赖 wasm 与 cases 均在，故本步
      # 排在下方发射步之后语义更清晰——实排见 lint 步后）。
  static-gates:
    name: Static contract & bookkeeping gates (no build products)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain (probe / fmt / facts --run)
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.moon\bin"

      - name: Refresh MoonBit registry index
        # toolchain_probe 的索引预检需要 registry 索引在位（fresh 环境同 core）
        shell: bash
        run: cd moonbit && moon update


      # ── gen_api_help rules.json（#125 收尾，2026-10-15）───────────
      # gen_api_help 内容批收敛（rules.json ≡ 原 .json.mbt 零漂移）后随
      # jsonmbt 退场翻转出库——scripts 侧 .json.mbt 清零，本 job 的
      # .json.mbt static gate 步随之摘除（moon 需求由差分驱动内嵌
      # moon run 承担，工具链安装保留）。

      - name: Teaching assets gen gate (#125 批 A——C 解析器自举)
        # 真源 = moonbit/teaching/content/*.md（md+.c 唯一真源入包）；
        # content_parser.c 由 vitro 编译运行（自己吃自己狗粮——引擎侧资产链
        # 自举，#128 裁定确认此即「生成器产 .mbt」实现路径）。产物经 moon fmt
        # 后与入库 _gen.mbt 逐字节比对（数组换行形态以 fmt 为准）。
        # 旧「Teaching assets JSON sync gate」（jsonmbt build + 教师 .json 同步）
        # 随批 A 出库退役——jsonmbt 对教学三张的调用归零。
        shell: bash
        run: |
          set -e
          cd moonbit && moon build --release --target js cmd/vitro_js && cd ..
          go run ./scripts/teaching_gen_check
          go run ./scripts/teaching_reconcile

      - name: Source hygiene (tracked files must be NUL-free)
        # P2-NUL 事故族（2026-09-23 修复批）：真 NUL 让 git 判二进制
        # （w/-text）——.gitattributes 行尾转换失效、diff/PR 审阅不可见
        # （先例：docs/** 148 行事故族；host_test.mbt 15KB 整文件不可见；
        # 冻结区 vitro_lexer/src/string.rs 索引侧潜伏 i/-text）。J9 证红留痕。
        shell: bash
        run: go run ./scripts/moonbit/source_hygiene

      - name: Bytecode libc data generation idempotency
        # 批四号（2026-09-26）：libc 产物派生闸——Rust include_str! 的
        # JSON 是单一真相源，本闸保证 MoonBit 数据字面量与其一致
        # （生成流程内置 moon fmt + check 同流程比对；J9 篡改证红）。
        shell: bash
        run: go run ./scripts/moonbit/gen_libc_data -check

      - name: MoonBit generated-artifact freshness (gen_diag / gen_host_route / gen_stubs)
        # 2026-09-23 审阅批接线（S6 审阅 P5）：三个生成器（diag 码表 /
        # host 路由 110 对 / 标准库存根表）此前均无 CI 步骤——产物被手改或
        # 源变更后未再生成，只能靠人跑 -check 才发现（S6 批的 host_func_id_gen
        # 自 codegen 上提 bytecode 即高风险期）。三脚本均内置 moon fmt 且
        # -check 无写副作用；J9 证红：gen_host_route 注入 HOST_ACOS 110→999
        # 必红（本批实测）、gen_stubs 注入篡改注释必红（本批实测）、gen_diag
        # 四雷证红已在先例留痕。前置修复：gen_stubs 原手工只认 --check 且
        # 生成输出未过 fmt（干净仓库上 --check 必红）——本批改为 flag 包 +
        # 内置 fmt 后方可入闸。
        shell: bash
        run: |
          go run ./scripts/moonbit/gen_diag -check
          go run ./scripts/moonbit/gen_host_route -check
          go run ./scripts/moonbit/gen_stubs -check
          go run ./scripts/moonbit/gen_protocol_fields -check
          go run ./scripts/moonbit/gen_diagnostics -check
          # #27 图标资产双闸（2026-10-07 挂入）：gen_icons -check 锁几何层
          # 与真源 svg 同步；icon_catalog 判定契约（viewBox/stroke/白名单/
          # tsv 对账/digest）。-check 均无写副作用，J9 11 种契约变异证红
          # 已在 c3601055 资产批留痕。
          go run ./scripts/gen_icons -check
          go run ./scripts/icon_catalog

      - name: MoonBit API surface audit (unpublished pkgs contracted)
        # 2026-09-21 S5 收尾批接线：对外面闸（架构审阅 v2 待办①——"面会
        # 自动再长，先立闸再加 priv"）。moonbit_surface -check 对账白名单
        # （scripts/surface_allowlist.txt）：无跨包消费的 pub 符号必须收面
        # 或入白名单（已发布 5 包走版本化弃期、类型闭包保留）。
        shell: bash
        run: go run ./scripts/moonbit/moonbit_surface -check

      - name: MoonBit package dependency direction (L0-L9 layering + acyclic)
        # 2026-09-22 S5 收尾批接线（架构审阅 v2 A 组 #6）：总计划 §4 的硬
        # 约束「依赖严格单向无环」此前**零 CI 校验**——越层或成环的依赖可
        # 静默进来（口头纪律）。本步按外置分层表（rules.json，源 = 总计划
        # §4 L0–L9）断言每个模块内依赖 go 向低层或同层，并 DFS 查环；
        # 新包未登记分层即红，解析出 0 包/0 依赖亦红（空集不得绿）。
        # cmd/* 为工具层豁免方向检查。J9 证红已留痕（注入 opcode→bytecode
        # 同时触发越层与成环两条判据）。
        shell: bash
        run: go run ./scripts/moonbit/pkg_deps -check

      - name: MoonBit interface-surface sync (moon info no-drift)
        # 2026-09-22 S5 收尾批接线：.mbt（实现）与 pkg.generated.mbti（接口
        # 面）的一致性此前纯靠人工跑 moon info——本仓已漏过一次（libc 的
        # .mbti 缺 type LibcSig，下轮才补登）。moon info 无 --check 子命令
        # （实测 moon 0.1.20260920），故取「跑前后快照 sha256 不变量」形态：
        # 不等即有 .mbti 与实现脱节（pub 面改了没同步 / 新包未生成 / 改坏）。
        # 0 个 .mbti 亦红（空集不得绿）。J9 证红：注入脱节内容必红。
        shell: bash
        run: go run ./scripts/moonbit/mbti_sync -check

      - name: Single-source-of-truth registry check
        # 2026-09-22 S5 收尾批接线（架构审阅 v2 A 组 #7 / 判据 C-04）：项目 L1
        # 判据「同一概念多真相来源」只覆盖**仓内同语言重复**，不覆盖跨语言
        # 孪生——迁移期每个单源在 MoonBit 侧都有一份孪生，同步义务纯人工
        # （"照搬不私改"）。本步把清单入版本控制并机判：enforced 条目的定义点
        # **文件集**必须等于 allowed_def_files（**多一份实现 = 红**，少一份 =
        # 单源被删/改名亦红）；registered 条目校验两侧声明路径存在。
        # 清单：scripts/moonbit/single_source/rules.json；J9 证红已留痕。
        shell: bash
        run: go run ./scripts/moonbit/single_source -check

      - name: libc single-source reconciliation (3 name tables)
        # 2026-09-22 S5 收尾批接线（S6 前置）：libc 放行判据在 Rust 侧是
        # host_func_id 路由名 ∪ BYTECODE_LIBC_ALL_FUNCS 索引名的并集，
        # MoonBit 侧照搬时手抄成 libc 包 builtin_all（175 名）——第四套
        # 真相源且零对账。实测已因此失真：libc.mbt 包注释断言「print_int
        # 不在此集（Rust host_func_id 无此名）」，而 Rust 侧 by_user_name
        # 明确有 `"print_int" | "__vitro_output" => Some(OUTPUT)` 别名臂。
        # 本步把「三表一致」变成机判红线（等式 + 交集计数 + PURE 子集 +
        # 空集不得绿）；规则外置 rules.json，J9 三路证红已留痕。
        shell: bash
        run: go run ./scripts/moonbit/libc_single_source -check

      - name: Host route coverage (110 routes vs host impls)
        # P2-memchr 事故族（2026-09-23 修复批）：110 路由表中 memchr 整批
        # 漏实现——既有对账锚只校验「常量 ↔ 名字」双表一致，不校验
        # 「路由名 ↔ 有实现」。规则外置 host_route_rules.json（别名 /
        # vm 白名单，白名单双向对账防腐化）；J9 双路证红留痕。
        shell: bash
        run: go run ./scripts/moonbit/host_route_coverage

      - name: Host contract map (oracle 103 tests vs mb anchors, 3-state)
        # Host Contract 三态对账（总计划表 3，2026-10-04 建）：oracle
        # host_contract_tests.rs 103 条 ↔ MoonBit 锚（host/memory/vm 三包
        # wbtest 实测抽取）的 anchored/merged/missing 映射——判据：映射
        # 无洞（oracle 测试全部在表）+ 锚引用无陈旧；missing 非空提示不红
        # （补锚段清零后 --strict 收官）。纯文本抽取零 Rust 构建依赖，
        # 归 moonbit job 静态闸族。J9：--selftest 三锚 + 盘上删条目 HOLE 红
        # 留痕（2026-10-04 实测）。
        shell: bash
        run: |
          go run ./scripts/host_contract_map --selftest
          go run ./scripts/host_contract_map --strict

      - name: Protocol TS types freshness + schema doc parity
        # 2026-09-22 接线（架构审阅 v2 A 组 #9 / §7.5）：@vitro/protocol 的 TS
        # 类型从权威 Rust 源（native/src/unified/*.rs，受字段冻结测试守护）
        # 生成，并与 docs/spec 的 schema 表格**双向对账**——任一方向不同步都红。
        # 这同时把「文档与实现是否一致」变成机器判据（此前无人守）。
        # 注意 §5 差分层（StepStreamBatch/StepPayloadDelta）未纳入：该节表格是
        # 压缩式，无法逐字段机判（已在 rules.json 登记）。
        shell: bash
        run: go run ./scripts/gen_protocol_ts -check

      - name: MoonBit test count (README vs moon test truth)
        # 五轮审阅流程漏洞封堵（2026-09-26）：测试数/文档数连坐靠人记，
        # facts check 结构上看不见「文档↔facts 一起错」（四轮里三次同型
        # 事故）。闸自跑 moon test 取实跑真值对账两份 README 的声明数——
        # v1 读 facts.json（cached 制品）是复述型，注入三方旧值不红（
        # 用户 J9 三层之第二层抓出）；v2 真值实跑。J9：篡改声明 ±1 红 /
        # 原缺陷场景（文档回旧值）红。
        shell: bash
        run: go run ./scripts/moonbit/testcount

      # ── MoonBit serve 行为闸族（serve exe 由本步骤链内构建）────────────
      # S7 批四号（2026-09-28）：双宿主对拍——同一请求表与断言集跑 MoonBit
      # cmd/serve；豁免面外置 moonbit_exemptions.json（step 族 S8 / 已登记
      # 分叉 / quarantine_budget 欠账，14 断言 + 3 整批，PASS 也豁免防僵尸
      # 条目）。首跑战果：抓到 config.set 未包 serve_ok 帧的一段真缺陷。
      # J9 双路证红：删豁免表 → fail loud exit 2；删单条目 → 该断言真红。
      - name: Difference ledger reconciliation (known whitelists ↔ ledger)
        # S8 批零号二段（2026-09-30）：差异台账守门规则机判化——
        # 三防线 known 白名单（shadow/clang_direct/vm_diff）与
        # scripts/diff_ledger/ledger.json 双向对账：台账 anchors 不得
        # 虚报（正向），防线新豁免一条分叉必须同步收编台账（反向——
        # 沉默漂移即红）；schema/枚举域/17 键 capability_flags 锁定同判。
        # --selftest 五路注入证红（J9）；shadow 真值为闸内清单
        # （shadow 未外置 JSON 是历史形态，外置化登记技术债随防线
        # 维护窗口——G-7 同族）。
        shell: bash
        run: go run ./scripts/diff_ledger --selftest && go run ./scripts/diff_ledger

      - name: Check Bytecode Libc precompiled artifacts are up-to-date
        # D5 后续批次第二站（2026-09-18）：precompile_bytecode_libc.py → Go。
        # 双轨对账：--check 双侧同判定（digest 逐字节一致）；重生成产物 JSON
        # 逐字节一致、.rs 仅头注指向 Go；J9 篡改源文件 → digest 失配 / exit 1。
        # 归 hygiene（2026-09-23）：红 = 改 C 源后忘了再生成——账没跟上，
        # 补 `go run ./scripts/precompile_bytecode_libc` + git add 即绿。
        run: go run ./scripts/precompile_bytecode_libc --check
        shell: bash

      - name: Vendored upstream drift probe (moonbitlang/x fs)
        # 2026-09-28 唯一依赖清除 B 路线批接线：moonbit/fs vendored 自
        # moonbitlang/x@0.5.5，上游是活仓库且实证发生过「内容漂移而
        # version 未 bump」（fs_native.mbt 的 utf8 迁移）——探针走内容哈希
        # 口径盯上游 main 四文件（版本号仅报告）。归 hygiene：红 = 上游
        # 漂移待人工评估（评估令非自动同步令——裁定权在人，处置流程见
        # docs/current/01-定位与路线/唯一依赖清除路线.md §3B-4）；
        # exit 2 = 网络无法判定（与漂移区分，防把网络抖动误报上游变更）。
        # J9 双路实跑证红：基线副本篡改哈希 → exit 1；假域名 → exit 2。
        shell: bash
        run: go run ./scripts/moonbit/vendor_drift

      # fork 方案落地批（2026-10-02）：外部勘探金样本的静态合规闸——只守
      # 仓内 gold_signatures.json（schema 键集白名单/值域/码形态/provenance
      # 锚四道，防诊断文案透传即 GPL 渗漏），**不跑勘探本身**（维持拍板——
      # 勘探需外部仓库+Clang，CI 不可复现；勘探 CI 化仍二期待拍板）。
      # J9 三路证红：加 message 键 / 删 source_commit / 伪码形态 → exit 2。
      - name: Realcode gold signatures compliance (scripts/realcode_diff -check)
        shell: bash
        run: go run ./scripts/realcode_diff/vitro_clang_diff.go -check

      # ── hygiene 侧 jsonmbt 再生（2026-10-09，修复 run 37883006515）──────
      # perf_budget/rules.json 已随 jsonmbt 迁移批②翻转遮蔽（.json.mbt 唯一
      # 真源），但 job 间不共享工作区——core 的 Regenerate 步产物带不进本
      # job，perf_budget -check 在干净检出下缺 rules.json 直接 FATAL（run
      # 37765594479/37883006515 连续红）。本 job 唯一 rules 消费方就是
      # perf_budget，故只再生这一张（编译 jsonmbt ~40s 是单 job 自洽的代价）。
      - name: Performance-assumption budget (corpus scale premises)
        # 2026-09-22 S5 收尾批接线：把「某项优化为什么不做」所依赖的**规模
        # 前提**变成机判红线。首条 = typeck O2 债（compute_type_size 每次
        # 调用重建 struct/union 表）——裁决「不做缓存化」的依据是语料规模
        # 不可测（实测 struct 定义 ≤2、成员访问 ≤37），但该前提会随语料
        # 扩展过期且无人提醒。超预算即红并指出裁决所在，迫使重估。
        # 规则外置 scripts/perf_budget/rules.json；J9 证红：预算压 0 必红。
        # 归 hygiene（2026-09-23）：红 = 裁决的规模前提过期待重估——决策账，
        # 不指当下提交有问题。
        shell: bash
        run: go run ./scripts/perf_budget -check

      - name: Editorconfig hard-rule check (charset/EOL/final-newline/JSON indent)
        # 审阅批 P2 接线（2026-10-11）：脚本头注自称"升格为 CI 红"但此前
        # 零接线——E6（JSON 缩进/末行换行漂移）历史复发 4 次全靠本地抓。
        # 生成物（@generated 头注）按"产物面归生成器闸"排除；tmp/_build 剪枝。
        shell: bash
        run: go run ./scripts/editorconfig_check

      - name: gen_api_help artifact check (-check)
        # 审阅批 P3 接线（2026-10-11）：#67 生成器产物对账闸此前只在
        # ci.yml 注释里出现——api_help 双产物漂移无 CI 强制。
        shell: bash
        run: go run ./scripts/gen_api_help -check

      - name: Go format check (gofmt -l scripts)
        # P3-3 修复批（2026-09-23）：scripts/** 此前无 eol 约定 + core.autocrlf
        # 让工作区 CRLF——gofmt -l 本地恒红（24 项假阳性含真格式漂移 15 项），
        # 无法作为自检；.gitattributes 补 scripts/** text eol=lf + 全量
        # gofmt -w 后本步入 CI（格式账，归 hygiene）。
        shell: bash
        run: |
          out=$(gofmt -l scripts/)
          if [ -n "$out" ]; then
            echo "::error::gofmt 漂移——本地 gofmt -w scripts/ 后提交"
            echo "$out"
            exit 1
          fi

      - name: Facts doc-truth audit (CURRENT docs must equal machine truth)
        # 2026-10-01 --strict 接线（模块审阅 09 P2-1 处方① + 四决策点拍板 C）：
        # Manual 兜底层（整行无数字等于真值）自此进 CI 判红。合法误报面
        # （里程碑未来值行等）经 scripts/facts/suspect_exemptions.json 显式
        # 过闸——条目零命中判僵尸、无条件红（防腐化），go test 锚
        # suspect_exemptions_test.go 五路 J9。
        shell: bash
        run: go run ./scripts/facts --strict check

      - name: Docs SVG freshness (gen_svg -check)
        # 2026-09-28 防漂移批接线：入库 SVG 此前**不在任何闸里**——重生成
        # 不一致红不了，生成器源码过时（如包图徽标停在上个批次）更无人知，
        # 2026-09-28 盘点实证：S6 收官 / S7 开工两个批次后包图仍写「S6 进行
        # 中 / 未开工 / 截至 2026-09-24」。现双管齐下：建成状态改 facts 派生
        # （moonbit_built_packages / moonbit_engine_version，上一 facts 步已
        # 落盘当轮 facts.json），本步 -check 兜「忘了重生成」。J9 证红：手改
        # 落盘 SVG 后 -check 必红（2026-09-28 本批实测）。归 hygiene：红 =
        # 插图账没跟上，跑 go run ./scripts/gen_svg all 即绿。
        shell: bash
        run: go run ./scripts/gen_svg -check

      - name: CI checklist (存在即接入注册表——scripts 驱动集 ↔ ci.yml 活行集双向对账)
        # msime run-checks 形态 Vitro 化（2026-10-11 #71 防线续批）：
        # 漏登记（驱动存在零活行——libc_boot 断供类红的事前形态）/ 悬空
        #（活行引用不存在的驱动）/ 僵尸例外 三向红；例外表 exceptions.json
        # 每条 reason 必填自证。J9 三向证红在案。
        shell: bash
        run: go run ./scripts/ci_checklist

      - name: Agent skills frontmatter audit (install_skills --list)
        # 2026-09-29 skills 图批接线：.agents/skills/ 的 SKILL.md 此前只有本地
        # 校验（脚本存在 ≠ 接线）。--list 对每个 skill 做 fail loud 校验：缺
        # SKILL.md / frontmatter 缺 name 或 description / name 与目录名不一致
        # → exit 1。与 gen_svg -check（skills 图失步即红）构成双闸——前者挡
        # 结构坏，后者挡「AI 改了手册而清单图没跟上」。
        # J9 证红：删任一 SKILL.md 的 name 行 → 必红。
        shell: bash
        run: go run .agents/install_skills.go --list

      # G11（R4）：工程健康度看板（生产 unwrap 计数/超长文件/失败记录口径），
      # 报告上传 artifact；阈值门禁待阈值基线固化后启用
      # 2026-10-05 修复：windows runner 上 unix.sh 报 Unsupported platform:
      # MINGW64_NT-10.0-26100（runner 内核升级后 uname 形态被安装脚本拒绝；
      # 此步未指定 shell 走 pwsh，curl|bash 撞平台检测）——改走 Windows 官方
      # powershell 安装（与上方 differential anchors 步同款、shell 显式）
  hygiene:
    name: Hygiene (fmt & four-target tests & toolchain)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit toolchain
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.moon\bin"

      - name: MoonBit toolchain health probe (A8 automation)
        # 2026-09-21 E-06 窄增量：工具链故障显式化（版本锁定/索引预检/
        # F8 ICE 特征/退出码 fail loud）。归 hygiene（2026-09-23 用户裁定）：
        # 工具链追新是既定策略（MoonBit 未到 1.0，breaking 跟着走），版本
        # 漂移红的含义是「该走 --update-baseline + 全门禁迁移流程」，不是
        # 代码坏了。处置手册见 memory / a592f60、2f5d5d4 先例。
        shell: bash
        run: go run ./scripts/toolchain_probe

      - name: MoonBit format check (moon fmt --check)
        # 2026-09-21 审阅批四补线：fmt 漂移已跨多个批次无人拦（此前
        # ci.yml 零 fmt 步骤）；gen_* 生成器内置 fmt 与手工编辑的格式
        # 差异会在再生成路径持续产生噪声。归 hygiene（2026-09-23）：格式账。
        shell: bash
        run: |
          cd moonbit
          moon fmt
          if ! git diff --exit-code -- .; then
            echo "::error::moon fmt 漂移——本地 cd moonbit && moon fmt 后提交"
            git diff --stat -- .
            exit 1
          fi

      - name: MoonBit tests (four targets)
        # js 目标接线（2026-10-15）：三后端批落地 js 后端（38f63d42）但测试
        # 面漏接——js 入口只做产物（build-and-unit 的 artifact 源），行为锚
        # （fs_js 等 js 后端专属文件的锚，全量 907 例）零 CI 覆盖，与三臂
        # 强制纪律（AGENTS §14）不符。本地实证 907/907 全绿后接线。
        run: |
          cd moonbit
          moon test
          moon test --target native
          moon test --target wasm-gc
          moon test --target js

      - name: Install Node 25
        uses: actions/setup-node@v4
        with:
          node-version: "25"

      - name: wasm-gc gateway artifact + Node host smoke
        run: |
          cd moonbit && moon build --release --target wasm-gc gateway/wasm && cd ..
          node scripts/wasm_gateway/host.js

  demo:
    name: Demo front-end gates (tsc / smoke / TS tests)
    needs: build-and-unit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node 25
        uses: actions/setup-node@v4
        with:
          node-version: "25"
      - name: Install MoonBit toolchain (differential anchors)
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.moon\bin"



      # ── gen_api_help rules.json（#125 收尾，2026-10-15）───────────
      # gen_api_help 内容批收敛（rules.json ≡ 原 .json.mbt 零漂移）后随
      # jsonmbt 退场翻转出库——scripts 侧 .json.mbt 清零，本 job 的
      # .json.mbt static gate 步随之摘除（moon 需求由差分驱动内嵌
      # moon run 承担，工具链安装保留）。

      - uses: actions/download-artifact@v4
        with:
          name: build-products
          path: moonbit/_build
      - name: demo TS build (tsc emit = type gate)
        run: |
          cd demo && npm ci && npx tsc -p tsconfig.json --noEmit && npx tsc -p tsconfig.json
        shell: bash

      # 算法侧栏数据发射（2026-10-04 refs #28 建，同日发射化）：产物不入库
      # （与 js/*.js、wasm.wasm 同形态）——发射即检查闸（分组并集 ==
      # rules.json 43 族、82 模板全集对账，断言失败即红）。assemble check
      # 与 demo_smoke 消费盘上 algorithms.js，本步必须排在其前。
      - name: demo algorithms data emit (generator assertions = gate)
        run: go run ./scripts/gen_demo_algorithms
        shell: bash

      # 课程内容防线（#120 补充 + #125 批 A 形态修正，2026-10-15）：
      # course_catalog = 叙述→课目对账 + lesson.c 双臂对拍（vitro ≡ clang，
      # 独立于 corpus/ 语料线）。**gen_course -check 步已摘**——#125 补充
      # 「资产链自举」判据驳回 Go 进资产链（Go 只许当防线），gen_course 的
      # lessons.ts 渲染角色退役为失败回退预案（本体保留，头注标注）；
      # 课程叙述的现役呈现路线 = #125 补充宿主侧运行时方案（parser.c 随包
      # 发布 + demo 运行时喂引擎解析）。
      - name: course catalog gate (reconcile + lesson.c dual-arm diff)
        run: go run ./scripts/course_catalog
        shell: bash

      # 2026-10-04 审阅 P3-②：组装自检原先只在 push-master 的 pages.yml——PR
      # 侧拷贝面缺口（历史白屏同类）无闸。单源脚本（demo_assemble_check）对
      # 原地发射后的 demo/ 跑同一断言集（不带 --no-ts：源目录 .ts 合法）。
      - name: demo assemble check (asset existence, HTML-face sentinel)
        run: node scripts/demo_assemble_check/main.js demo
        shell: bash

      # F4 前端框架批（Svelte 5 + Vite）闸门：svelte-check（类型+A11y 面，
      # 比 tsc 宽）+ vite build（构建成功性）。demo/src 在 tsc include 外、
      # demo_smoke 跑 js 面，不加这两步则 demo/src 在 CI 零覆盖（裸奔）。
      - name: F4 svelte-check (type + a11y gate)
        run: cd demo && npm run pilot:check
        shell: bash

      - name: F4 vite build (build success gate)
        run: cd demo && npm run pilot:build
        shell: bash

      - name: demo page smoke (protocol-level, cases golden + field keys)
        run: node scripts/demo_smoke/main.js
        shell: bash

      # demo UI 字符串契约对账（2026-10-02，防线维护）：JS↔CSS 类名/CSS
      # skill 手册引用路径存在性闸（2026-10-07 接线；缺陷形态 03 E11/E13 同族面
      # 「手册改写引用面按脑测填迁移目标」的机判面）：.agents/skills/** 内的
      # 仓库路径引用（围栏代码块 + 行内反引号 span，首段 = 仓库根一级条目）
      # 必须实存；退役/反例语境死路径经 rules.json dead_paths 过闸（新增须在
      # 提交信息写明语境）；min_hits 下限守卫防抽取面塌缩（D8）。
      # -selftest 九路注入证红（J9）。首跑战果：11 处缺失全数人工定性
      # （2 陈旧路径修正 + 1 笔误前缀修正 + 1 占位符化 + 1 注释粘连 +
      # 6 退役/反例语境收编 dead_paths）。
      - name: skill docs referenced-path existence
        run: |
          go run ./scripts/skill_path_check -selftest
          go run ./scripts/skill_path_check
        shell: bash

      # 变量/id 三路文本对账——demo UI 批三实锤 bug 中两个的归因面
      # （stdin-row 死类 + --fg-muted 幽灵变量；HEAD 版证红留痕：bug 版
      # 三件套复现 5 条。TS 类型系统对这两类零感知，故走文本闸）。
      # 规则外置 rules.json（动态类簇/动态 id 前缀，僵尸条目无条件红）。
      # TS 重写批：扫描面 = app.ts + js/*.ts（源=审阅对象）。
      - name: demo UI string-contract lint (class/var/id reconciliation)
        run: |
          go run ./scripts/demo_ui_lint -selftest
          go run ./scripts/demo_ui_lint
        shell: bash

      # 拆分批（2026-10-04，refs #28）→ TS 重写批：纯函数层 node --test——
      # 黄一批评「demo 层无自己测试」的正解药方。node 25 type stripping
      # 直跑 .ts（零发射依赖——源在即跑，比发射更早的红）。锚位对历史
      # bug 窝点：buildCallTree trie / isArrayAnimCase 紧凑声明存量 bug
      # 锁 / latin1ToUtf8 / tokenizeC / highlightLines / heapSpanOf / esc。
      # DOM 交互层不硬测，维持浏览器实测纪律。
      # 2026-10-04 审阅 P3-④：tests 此前不在主 tsconfig include——只有
      # 「能跑」保证无类型保证。独立 tests/tsconfig.json（@types/node）
      # 补类型面，直跑前先过 tsc。
      - name: demo pure-function tests (node --test on .ts)
        run: |
          cd demo && npx tsc -p tests/tsconfig.json && cd ..
          node --test demo/tests/pure.test.mts
        shell: bash

  # ── hygiene（记账型，2026-09-23 拆分）────────────────────────────────────
  # 红的含义是「账没跟上」而非「代码坏了」：文档漂移 / 工具链版本迁移 /
  # 产物新鲜度 / 格式 / 性能裁决的规模前提 / 构建卫生。白天推进时属预期债，
  # 夜间批量复绿（用户工作流裁定：白天不断推进、夜里花时间复绿）。
  # needs core（2026-10-05 删区批后）：facts 真值源已转 MoonBit/Clang 侧
  # （cargo/shadow/replay 随 Rust 退役——facts.go 连坐：相关键转 unavailable）。
