name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # 夜间全量重算（北京时间 02:00）：Clang Golden 缓存强制失效重算，防版本漂移
    # （见 scripts/shadow_verify.go 文件头与 docs/current 工作记录）
    - cron: '0 18 * * *'

# 前端切割（2026-09-11）：CideFlutter / FRB / flutter-android-ios jobs 已随前端
# 迁出（标签 before-frontend-split 保留完整历史）。本仓库现为纯后端仓，
# CI 验证 Rust 引擎 + 三出口防线 + wasm 出口冒烟（G2）。
#
# ── core / hygiene 两 job 拆分（2026-09-23，用户裁定）────────────────────────
# 此前单 job 全部步骤一个红灯，"CI 老是红"的信噪比问题来自两类检查混灯：
#   core  = 准入型（代码/契约坏了）——红了立即处置，当天清；
#   hygiene = 记账型（文档/环境/产物与真值的账没跟上）——白天推进时是预期债，
#           夜间批量复绿，不阻塞推进。
# 分类判据一句话：红了是否意味着「这一批提交不能要」——否则归 hygiene。
# 工具链追新是既定策略（MoonBit 未到 1.0，breaking 只能跟着走），故
# toolchain_probe 红属 hygiene：含义是「该走 moon-toolchain-upgrade-playbook
# 迁移流程了」，不是「代码坏了」。
jobs:
  core:
    name: Core gates (code & contract)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Build native (Debug)
        run: cargo build
        working-directory: native

      - name: Build native (Release)
        run: cargo build --release
        working-directory: native

      - name: Run Rust tests
        # M15（2026-09-18）：tee 日志落盘——facts 对账从日志解析 passed/套件真值，
        # CI 内无需为文档对账重跑 30 分钟测试。pipefail 保证 tee 不吞失败退出码。
        # 日志随 artifact 供 hygiene 的 facts 全键真值（2026-09-23 拆分）。
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --all-features 2>&1 | tee cargo_test_ci.log
        working-directory: native

      - name: Upload cargo test log (for hygiene facts)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cargo-test-log
          path: native/cargo_test_ci.log

      # cargo test 已覆盖全部单元/集成测试（含 Phase A/B/C/E/Dogfooding），
      # 无需再单独运行各防线测试套件。
      - name: Three Tier Consistency Check & Report
        # D5 后续批次第三站（2026-09-18）：ci_three_tier_check.py → Go。
        # 双轨对账：9 套件判定/计数/hard-soft issue/退出码一致、报告逐行一致
        # （除时间戳与 cargo 计时行）。J9 假 KNOWN 条目注入 → hard / exit 1
        #（顺带抓出 title 提取缺捕获组的复刻 bug，绿路径对账不可见——埋雷
        # 是判定面的必要补充）。
        run: go run ./scripts/ci_three_tier_check
        shell: bash

      - name: Upload Three Tier Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-tier-report
          path: reports/three_tier_report.md

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        working-directory: native

      # U2#13（2026-09-14）：go vet 入 CI——此前无此步骤，scripts 侧 3 处
      # unsafe.Pointer 误用（FFI 返回指针的 uintptr→Pointer 逆向转换）从未
      # 被暴露；现随 buf 写入式 API（ABI 2.1.0）根治后设为常驻门禁。
      - name: Go vet (scripts)
        run: go vet ./scripts/...

      # 2026-09-22 闸缺口补齐：go test ./scripts/... 此前**不在 CI**——
      # scripts 侧已有 5 包 / 10 文件 / 58 个 J9·性质测试（CLI 契约锚 10、
      # 归一性质锚 7、docs_preview 7、facts 30、toolchain_probe 基线判定锚 4），
      # 全部只在本地可跑、CI 一直抓不到。"判定函数坏了的『全绿』比没有门禁
      # 更坏"（J9 义务原话）——本步骤退非 0 即红。测试面全为纯函数 /
      # t.TempDir() 夹具，不依赖 moon 工具链、cargo 产物或 reports/（后者被
      # gitignore，CI 上不存在）；故接线在 go vet 旁而非 MoonBit 步骤之后，
      # 可先行失败。
      - name: Go test (scripts)
        run: go test ./scripts/...

      # Clang Golden 缓存（方案 A）：结果是确定性的（同一源码 + 同一 clang 版本
      # ⇒ 同一结果），跨 CI 运行复用可把 Shadow 从分钟级降到秒级。
      # key 含 clang 版本 —— 版本一变缓存自动失效，这就是"防版本漂移"的第一道闸；
      # 第二道闸是夜间 schedule 的 --refresh-clang 全量重算。
      - name: Clang version (for cache key)
        id: clangver
        shell: bash
        run: echo "value=$(clang --version | head -n1 | tr -d ' ' | cut -c1-48)" >> "$GITHUB_OUTPUT"

      - name: Cache Clang golden results
        uses: actions/cache@v4
        with:
          path: |
            native/tests/shadow_verification/.clang_cache
            .clang_cache_cd
          # key 含驱动脚本哈希：缓存 schema/口径变化时整体失效。
          # go1 缓存条目与历史 Python 条目（schema=1）同目录共存、key 空间不相交。
          key: clang-golden-${{ runner.os }}-${{ steps.clangver.outputs.value }}-${{ hashFiles('scripts/shadow_verify/main.go', 'scripts/clang_direct/main.go', 'scripts/vm_diff/main.go', 'scripts/internal/**/*.go') }}
          restore-keys: |
            clang-golden-${{ runner.os }}-${{ steps.clangver.outputs.value }}-

      # D5 语言迁移最后一站（2026-09-13）：C 影子验证主驱动 Python→Go。
      # 双轨对账 PASS（663 用例集合/顺序/逐用例 diff_type/summary/category_frequency
      # 全一致）后切换；Python 版 shadow_verify.py 已退役删除。
      - name: Shadow Verification
        shell: bash
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # 夜间全量重算：忽略缓存、重算并覆盖写回，防止 Golden 随 clang 漂移
            EXTRA="--refresh-clang"
            echo "夜间模式：Clang Golden 全量重算（$EXTRA）"
          fi
          go run ./scripts/shadow_verify $EXTRA --report native/tests/shadow_verification/reports/shadow_report.md --json native/tests/shadow_verification/reports/shadow_data.json

      - name: Upload Shadow Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-verification-report
          path: |
            native/tests/shadow_verification/reports/shadow_report.md
            native/tests/shadow_verification/reports/kr_leetcode_report.json
            native/tests/shadow_verification/reports/shadow_data.json

      - name: C++ Shadow Verification
        # D5 语言迁移第一站（2026-09-12）：Go 版与 Python 版双轨对账一致后切换。
        # Python 版保留为对照基准；go vet 已是常驻门禁（见 Go vet 步骤）。
        run: go run ./scripts/shadow_verify_cpp
        shell: bash

      - name: Upload C++ Shadow Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpp-shadow-verification-report
          path: native/tests/shadow_verification/reports/cpp_shadow_report.json

      # 出口 3 防线：serve JSON-lines 协议契约（id 关联 / 错误帧同构 / session.reset
      # / 与 capi 共用的入口语义）。依赖上一步 Debug 构建的 vitro_cli。
      - name: vitro_cli serve smoke (Exit 3 protocol contract)
        # D5 后续批次第一站（2026-09-18）：serve_smoke.py → Go。双轨对账
        # （断言逐条同名同序、计数 57/57、判定一致、RSS 峰值同为 24MB）后
        # 接管；J9 证红双通道：VITRO_RSS_BUDGET_MB=5 → FAIL/exit 1、
        # 坏 exe → 51 FAIL/exit 1。依赖 Debug 构建的 vitro_cli。
        run: go run ./scripts/serve_smoke
        shell: bash

      # R2（2026-09-14）：回放驱动纳入 CI——此前它不在任何验证循环里，
      # "Go 驱动没跑"导致 step.next 重复投递（0,0,1，违反 spec 附录 A
      # step_index 严格递增冻结不变量）漏过 U1#1 缓冲批的验收。本步骤含
      # J9 selftest（判定口径埋雷，含版本下限比较组）+ S1~S5 全量断言
      #（A7b = 帧序列主锚）。依赖 Debug 构建的 vitro_cli。
      - name: replay S1-S5 protocol assertions (frame-sequence invariant)
        run: go run ./scripts/replay
        shell: bash

      # S3 审阅补线（2026-09-20，F5/G3）：MoonBit 工具链 + 解析差分锚。
      # 此前 parser_diff 不在 CI——offsetof 深链崩溃（F1）/enum 常量链
      # 崩溃（F2）/指针多维错值（F3）三项缺陷与"防线不在 CI"互为因果。
      # 三模式均已降到秒级（2026-09-22 canonicalize 抽库：逐样本起进程成本
      # 消除，旧口径"分钟级（预构建后）"失效）；全量经 hygiene 的 facts 采集。
      # 依赖上方 Release 构建的 vitro_cli。
      - name: Install MoonBit toolchain (parser anchors)
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.moon\bin"

      - name: Refresh MoonBit registry index
        # 2026-09-20 CI 实锤：全新安装的 moon 无 registry 索引，解析
        # moonbitlang/x 报 "module was not found in the registry"；
        # moon update 只刷索引不动 moon.mod 固定版本（本地验证零回归）
        shell: bash
        run: cd moonbit && moon update

      - name: MoonBit unit tests (moon test)
        # 2026-09-20 审阅补线：moon test 此前无独立门禁步骤——仅 facts
        # --run 间接跑（采集失败只记 unavailable 不红），且 README 测试
        # 数为分解式（facts 归人工维护不机判），两路都不拦挂用例。本
        # 步骤退非 0 即红，MoonBit 侧防线自此有牙。
        shell: bash
        run: cd moonbit && moon test

      - name: MoonBit parser differential anchors (E3/E4/E3+ threshold)
        shell: bash
        run: |
          go run ./scripts/parser_diff --pathological
          go run ./scripts/parser_diff --legal-deep
          go run ./scripts/parser_diff --threshold

      - name: MoonBit typeck differential (E1-E4 full corpus)
        # 2026-09-20 审阅补线：typeck_diff（S4 对拍防线）此前零 CI 接线
        # （原排期"E1 全量对拍管道 CI 化待 S5 片后统一"，防线空窗期由
        # 本步骤关闭）。四目录全量（**600 语料**，2026-09-22 实测；早期文档
        # 的 597/598 为各片收官时的 as-of 快照，非当前真值）本地实测分钟级；
        # 依赖上方
        # Release 构建的 vitro_cli（serve 出口）+ MoonBit 工具链。
        shell: bash
        run: |
          for d in baseline knr leetcode gap; do
            go run ./scripts/typeck_diff native/tests/cases/$d
          done

      - name: MoonBit codegen differential (A-grade, full corpus)
        # 2026-09-21 S5 审阅批接线；同日扩展批四号后**放开四语料**——
        # 原"只接 skeleton"的理由（one-sided 能力缺口）已不成立：四语料
        # ONE-SIDED=0 / CONTENT-DIFF=0（SAME 585/600 含 2 例 union/指针
        # 成员宽度形状锚）。骨架面保留（快失败冒烟）；本批 P1-1（union
        # 成员赋值宽度）正是四语料外接前的探针漏网——门禁全覆盖后再无
        # 形状盲区豁免。
        # **依赖上方 Release 构建的 vitro_cli**（Rust 侧产物真值源）——与
        # typeck_diff / libc_boot_diff 同一前提；缺 release 产物会 fail loud。
        shell: bash
        run: |
          go run ./scripts/codegen_diff native/tests/cases/codegen_skeleton
          for d in baseline knr leetcode gap; do
            go run ./scripts/codegen_diff native/tests/cases/$d
          done

      - name: Source hygiene (tracked files must be NUL-free)
        # P2-NUL 事故族（2026-09-23 修复批）：真 NUL 让 git 判二进制
        # （w/-text）——.gitattributes 行尾转换失效、diff/PR 审阅不可见
        # （先例：docs/** 148 行事故族；host_test.mbt 15KB 整文件不可见；
        # 冻结区 vitro_lexer/src/string.rs 索引侧潜伏 i/-text）。J9 证红留痕。
        shell: bash
        run: go run ./scripts/moonbit/source_hygiene

      - name: Bytecode libc data generation idempotency
        # 批四号（2026-09-26）：libc 产物派生闸——Rust include_str! 的
        # JSON 是单一真相源，本闸保证 MoonBit 数据字面量与其一致
        # （生成流程内置 moon fmt + check 同流程比对；J9 篡改证红）。
        shell: bash
        run: go run ./scripts/moonbit/gen_libc_data -check

      - name: MoonBit VM runtime differential (D-grade stdout/exit/memory)
        # 六轮审阅 P1-2 接线（2026-09-26）：vm_diff 此前不在 CI = 本地
        # 工具——MoonBit VM 运行期回归无人拦。三通道口径见脚本头注
        # （第三通道为 1MB 自包含性校验，oracle 映像出口待建）。
        # **全量化（总计划 §7.1 层 1，2026-09-26 同日）**：默认四语料
        # 全量（baseline+knr+leetcode+gap）+ verdict 三级（SAME /
        # DIFF-known / DIFF-unexpected——known 白名单 scripts/vm_diff/
        # known_diffs.json 按 case+digest 精确豁免，digest 漂移即降级红
        # 防白名单腐化；skip 白名单空转条目跑例前秒红）。
        # 依赖上方 Release 构建的 vitro_cli（oracle 真值源，与
        # codegen_diff 同前提）+ moon build 产出 cmd/run exe（脚本自带
        # 新鲜度门禁：exe 旧于任一 moonbit 源即红——本地 moon-lsp 后台
        # 重建会静默删产物，构建失败照跑旧 exe 报假绿的事故形态由该
        # 门禁封死）。
        # **--release 必须带**（2026-09-26 e1_va_copy 缺陷批实测坑）：
        # `moon build` 默认 debug，vm_diff 读的是 release 路径
        # （moonbit/_build/native/release/...）——不带 --release 则
        # release 产物不生成/不更新，门禁会红且构建目标错位。
        shell: bash
        run: |
          cd moonbit && moon build --release --target native cmd/run
          cd .. && go run ./scripts/vm_diff

      - name: Clang direct verify (layer 2, cmd/run vs Clang golden)
        # §7.1 层 2 直拍防线（2026-09-26 提前落地——原排期 S7，用户拍板
        # 前移）：真值源 = Clang 本尊（非 Rust oracle），cmd/run 的
        # stdout+返回码 vs Clang golden。known_direct.json 按 case+digest
        # 精确豁免（digest 漂移降级红防白名单腐化；条目转绿即红逼移除）。
        # 与 vm_diff 分工：vm_diff 抓迁移偏差（引擎 vs oracle），本防线抓
        # 两侧共同偏差（oracle 错而 Clang 对的形态）。重试判据 = shadow
        # 同款（编译失败也重试——Windows 并发 Defender 锁目标文件首跑
        # 127 例瞬态误判实锤）。Clang golden 缓存 .clang_cache_cd/ 随上方
        # cache action 持久化（key 含 clang 版本）。
        shell: bash
        run: go run ./scripts/clang_direct

      - name: MoonBit test count (README vs moon test truth)
        # 五轮审阅流程漏洞封堵（2026-09-26）：测试数/文档数连坐靠人记，
        # facts check 结构上看不见「文档↔facts 一起错」（四轮里三次同型
        # 事故）。闸自跑 moon test 取实跑真值对账两份 README 的声明数——
        # v1 读 facts.json（cached 制品）是复述型，注入三方旧值不红（
        # 用户 J9 三层之第二层抓出）；v2 真值实跑。J9：篡改声明 ±1 红 /
        # 原缺陷场景（文档回旧值）红。
        shell: bash
        run: go run ./scripts/moonbit/testcount

      - name: Host route coverage (110 routes vs host impls)
        # P2-memchr 事故族（2026-09-23 修复批）：110 路由表中 memchr 整批
        # 漏实现——既有对账锚只校验「常量 ↔ 名字」双表一致，不校验
        # 「路由名 ↔ 有实现」。规则外置 host_route_rules.json（别名 /
        # vm 白名单，白名单双向对账防腐化）；J9 双路证红留痕。
        shell: bash
        run: go run ./scripts/moonbit/host_route_coverage

      - name: MoonBit API surface audit (unpublished pkgs contracted)
        # 2026-09-21 S5 收尾批接线：对外面闸（架构审阅 v2 待办①——"面会
        # 自动再长，先立闸再加 priv"）。moonbit_surface -check 对账白名单
        # （scripts/surface_allowlist.txt）：无跨包消费的 pub 符号必须收面
        # 或入白名单（已发布 5 包走版本化弃期、类型闭包保留）。
        shell: bash
        run: go run ./scripts/moonbit/moonbit_surface -check

      - name: libc single-source reconciliation (3 name tables)
        # 2026-09-22 S5 收尾批接线（S6 前置）：libc 放行判据在 Rust 侧是
        # host_func_id 路由名 ∪ BYTECODE_LIBC_ALL_FUNCS 索引名的并集，
        # MoonBit 侧照搬时手抄成 libc 包 builtin_all（175 名）——第四套
        # 真相源且零对账。实测已因此失真：libc.mbt 包注释断言「print_int
        # 不在此集（Rust host_func_id 无此名）」，而 Rust 侧 by_user_name
        # 明确有 `"print_int" | "__vitro_output" => Some(OUTPUT)` 别名臂。
        # 本步把「三表一致」变成机判红线（等式 + 交集计数 + PURE 子集 +
        # 空集不得绿）；规则外置 rules.json，J9 三路证红已留痕。
        shell: bash
        run: go run ./scripts/moonbit/libc_single_source -check

      - name: MoonBit package dependency direction (L0-L9 layering + acyclic)
        # 2026-09-22 S5 收尾批接线（架构审阅 v2 A 组 #6）：总计划 §4 的硬
        # 约束「依赖严格单向无环」此前**零 CI 校验**——越层或成环的依赖可
        # 静默进来（口头纪律）。本步按外置分层表（rules.json，源 = 总计划
        # §4 L0–L9）断言每个模块内依赖 go 向低层或同层，并 DFS 查环；
        # 新包未登记分层即红，解析出 0 包/0 依赖亦红（空集不得绿）。
        # cmd/* 为工具层豁免方向检查。J9 证红已留痕（注入 opcode→bytecode
        # 同时触发越层与成环两条判据）。
        shell: bash
        run: go run ./scripts/moonbit/pkg_deps -check

      - name: libc bootstrap parity (MoonBit library mode vs Rust export)
        # 2026-09-22 S5 尾项『libc 自举』接线：命题是「MoonBit 引擎能否编译
        # 自己的标准库 C 源，且产物与 Rust oracle 逐字节一致」。两侧形态不
        # 同（Rust export 11 键 / MoonBit dump 14 键），故以 stub main +
        # wrapper 截断 + 删 main 的 export 口径过滤后，投影到 9 个交集字段
        # 比对（含 code 段逐指令）。J9 证红：注入 code[1].operand +1 必红。
        # 依赖 Rust release 二进制（与 codegen_diff 同）。
        shell: bash
        run: go run ./scripts/moonbit/libc_boot_diff

      - name: Single-source-of-truth registry check
        # 2026-09-22 S5 收尾批接线（架构审阅 v2 A 组 #7 / 判据 C-04）：项目 L1
        # 判据「同一概念多真相来源」只覆盖**仓内同语言重复**，不覆盖跨语言
        # 孪生——迁移期每个单源在 MoonBit 侧都有一份孪生，同步义务纯人工
        # （"照搬不私改"）。本步把清单入版本控制并机判：enforced 条目的定义点
        # **文件集**必须等于 allowed_def_files（**多一份实现 = 红**，少一份 =
        # 单源被删/改名亦红）；registered 条目校验两侧声明路径存在。
        # 清单：scripts/moonbit/single_source/rules.json；J9 证红已留痕。
        shell: bash
        run: go run ./scripts/moonbit/single_source -check

      - name: MoonBit interface-surface sync (moon info no-drift)
        # 2026-09-22 S5 收尾批接线：.mbt（实现）与 pkg.generated.mbti（接口
        # 面）的一致性此前纯靠人工跑 moon info——本仓已漏过一次（libc 的
        # .mbti 缺 type LibcSig，下轮才补登）。moon info 无 --check 子命令
        # （实测 moon 0.1.20260920），故取「跑前后快照 sha256 不变量」形态：
        # 不等即有 .mbti 与实现脱节（pub 面改了没同步 / 新包未生成 / 改坏）。
        # 0 个 .mbti 亦红（空集不得绿）。J9 证红：注入脱节内容必红。
        shell: bash
        run: go run ./scripts/moonbit/mbti_sync -check

      - name: MoonBit generated-artifact freshness (gen_diag / gen_host_route / gen_stubs)
        # 2026-09-23 审阅批接线（S6 审阅 P5）：三个生成器（diag 码表 /
        # host 路由 110 对 / 标准库存根表）此前均无 CI 步骤——产物被手改或
        # 源变更后未再生成，只能靠人跑 -check 才发现（S6 批的 host_func_id_gen
        # 自 codegen 上提 bytecode 即高风险期）。三脚本均内置 moon fmt 且
        # -check 无写副作用；J9 证红：gen_host_route 注入 HOST_ACOS 110→999
        # 必红（本批实测）、gen_stubs 注入篡改注释必红（本批实测）、gen_diag
        # 四雷证红已在先例留痕。前置修复：gen_stubs 原手工只认 --check 且
        # 生成输出未过 fmt（干净仓库上 --check 必红）——本批改为 flag 包 +
        # 内置 fmt 后方可入闸。
        shell: bash
        run: |
          go run ./scripts/moonbit/gen_diag -check
          go run ./scripts/moonbit/gen_host_route -check
          go run ./scripts/moonbit/gen_stubs -check

      - name: C ABI declaration parity (error codes + binding symbols)
        # 2026-09-22 接线（架构审阅 v2 A 组 #3 / §2.9）：vitro_capi.h 的
        # VitroErrorCode 枚举手抄自 Rust 源且注释只写「Keep in sync with ...」
        # ——没说权威源、也没说裁剪策略，故「缺 25 个 C 侧码」既发现不了也
        # 判断不了。本步三类判据：① C 头项必须存在于权威源（伪造码即红）
        # ② 同名必须同值（值抄错最危险——下游按数值判错型）③ 源有而 C 头无
        # 必须匹配豁免规则（哨兵 / E4xxx C++ 已砍）。另判 Go 绑定的 DLL
        # 符号名均有 C 头声明。规则外置 rules.json；J9 四路注入证红。
        shell: bash
        run: go run ./scripts/gen_capi_bindings -check

      - name: Protocol TS types freshness + schema doc parity
        # 2026-09-22 接线（架构审阅 v2 A 组 #9 / §7.5）：@vitro/protocol 的 TS
        # 类型从权威 Rust 源（native/src/unified/*.rs，受字段冻结测试守护）
        # 生成，并与 docs/spec 的 schema 表格**双向对账**——任一方向不同步都红。
        # 这同时把「文档与实现是否一致」变成机器判据（此前无人守）。
        # 注意 §5 差分层（StepStreamBatch/StepPayloadDelta）未纳入：该节表格是
        # 压缩式，无法逐字段机判（已在 rules.json 登记）。
        shell: bash
        run: go run ./scripts/gen_protocol_ts -check

      - name: Protocol first consumer (fields-level validation on real engine output)
        # 2026-09-22 接线（架构审阅 v2 A 组 #10 / §8.5「第一个消费者跑通」）：
        # 用**生成的**协议面（protocol/fields.mjs）消费**真实的**引擎输出
        # （vitro_cli serve 的 step 流），逐字段校验 + 最小内容层渲染。
        # 依赖上方 Release 构建的 vitro_cli（与 codegen_diff / libc_boot_diff 同前提）。
        # **限制（诚实登记）**：本环境无 npm/tsc，故只能验「生成物描述得了真实输出」，
        # 验不了「字段名写错在 tsc 编译期即红」——后者是 TS 的核心收益，待 tsc 就绪。
        shell: bash
        run: node protocol/consumer.mjs

      # G2（R4）：出口 2 守护——wasm32 构建 + Node 冒烟（ABI 导出 + capi 全链路，
      # 纯 stdout 通道断言；wasm-bindgen 占位导入以 Proxy 桩通过）
      - name: wasm32 build & smoke (Exit 2 guard)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --target wasm32-unknown-unknown --release
          node ../scripts/wasm_smoke/wasm_smoke.js
        working-directory: native
        shell: bash

  # ── hygiene（记账型，2026-09-23 拆分）────────────────────────────────────
  # 红的含义是「账没跟上」而非「代码坏了」：文档漂移 / 工具链版本迁移 /
  # 产物新鲜度 / 格式 / 性能裁决的规模前提 / 构建卫生。白天推进时属预期债，
  # 夜间批量复绿（用户工作流裁定：白天不断推进、夜里花时间复绿）。
  # needs core：facts 全键真值依赖 core 的 cargo 日志与 shadow 产物 artifact，
  # 且真值重放（replay/serve_smoke 秒级）需要 Debug 构建——口径与拆分前
  # 完全一致（不降级为缓存沿用）。
  hygiene:
    name: Hygiene checks (bookkeeping)
    needs: core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      # facts --run 的真值重放（replay / serve_smoke 秒级）需要 Debug 的
      # vitro_cli；rust-cache 命中后此步为增量，分钟内。
      - name: Build native (Debug)
        run: cargo build
        working-directory: native

      - name: Download core artifacts (cargo log + shadow truth)
        uses: actions/download-artifact@v4
        with:
          pattern: "{cargo-test-log,shadow-verification-report,cpp-shadow-verification-report}"
          merge-multiple: true
          path: .

      - name: Install MoonBit toolchain (probe / fmt / facts --run)
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.moon\bin"

      - name: Refresh MoonBit registry index
        # toolchain_probe 的索引预检需要 registry 索引在位（fresh 环境同 core）
        shell: bash
        run: cd moonbit && moon update

      - name: Check Bytecode Libc precompiled artifacts are up-to-date
        # D5 后续批次第二站（2026-09-18）：precompile_bytecode_libc.py → Go。
        # 双轨对账：--check 双侧同判定（digest 逐字节一致）；重生成产物 JSON
        # 逐字节一致、.rs 仅头注指向 Go；J9 篡改源文件 → digest 失配 / exit 1。
        # 归 hygiene（2026-09-23）：红 = 改 C 源后忘了再生成——账没跟上，
        # 补 `go run ./scripts/precompile_bytecode_libc` + git add 即绿。
        run: go run ./scripts/precompile_bytecode_libc --check
        shell: bash

      - name: MoonBit toolchain health probe (A8 automation)
        # 2026-09-21 E-06 窄增量：工具链故障显式化（版本锁定/索引预检/
        # F8 ICE 特征/退出码 fail loud）。归 hygiene（2026-09-23 用户裁定）：
        # 工具链追新是既定策略（MoonBit 未到 1.0，breaking 跟着走），版本
        # 漂移红的含义是「该走 --update-baseline + 全门禁迁移流程」，不是
        # 代码坏了。处置手册见 memory / a592f60、2f5d5d4 先例。
        shell: bash
        run: go run ./scripts/toolchain_probe

      - name: Performance-assumption budget (corpus scale premises)
        # 2026-09-22 S5 收尾批接线：把「某项优化为什么不做」所依赖的**规模
        # 前提**变成机判红线。首条 = typeck O2 债（compute_type_size 每次
        # 调用重建 struct/union 表）——裁决「不做缓存化」的依据是语料规模
        # 不可测（实测 struct 定义 ≤2、成员访问 ≤37），但该前提会随语料
        # 扩展过期且无人提醒。超预算即红并指出裁决所在，迫使重估。
        # 规则外置 scripts/perf_budget/rules.json；J9 证红：预算压 0 必红。
        # 归 hygiene（2026-09-23）：红 = 裁决的规模前提过期待重估——决策账，
        # 不指当下提交有问题。
        shell: bash
        run: go run ./scripts/perf_budget -check

      - name: Go format check (gofmt -l scripts)
        # P3-3 修复批（2026-09-23）：scripts/** 此前无 eol 约定 + core.autocrlf
        # 让工作区 CRLF——gofmt -l 本地恒红（24 项假阳性含真格式漂移 15 项），
        # 无法作为自检；.gitattributes 补 scripts/** text eol=lf + 全量
        # gofmt -w 后本步入 CI（格式账，归 hygiene）。
        shell: bash
        run: |
          out=$(gofmt -l scripts/)
          if [ -n "$out" ]; then
            echo "::error::gofmt 漂移——本地 gofmt -w scripts/ 后提交"
            echo "$out"
            exit 1
          fi

      - name: MoonBit format check (moon fmt --check)
        # 2026-09-21 审阅批四补线：fmt 漂移已跨多个批次无人拦（此前
        # ci.yml 零 fmt 步骤）；gen_* 生成器内置 fmt 与手工编辑的格式
        # 差异会在再生成路径持续产生噪声。归 hygiene（2026-09-23）：格式账。
        shell: bash
        run: |
          cd moonbit
          moon fmt
          if ! git diff --exit-code -- .; then
            echo "::error::moon fmt 漂移——本地 cd moonbit && moon fmt 后提交"
            git diff --stat -- .
            exit 1
          fi

      # M15 + M13 细化（2026-09-18）：文档事实对账门禁接线。此前 facts check
      # 自称 CI 门禁但 ci.yml 无此步骤（§7A 复核 M15 实锤）——文档数字与机器
      # 真值漂移、跨文档 ABI 版本漂移均无门禁可拦。本步是 hygiene 的主体：
      # 白天改代码文档滞后的时序差在此显形，夜间批量复绿（用户工作流裁定）。
      # --run 重放 replay/serve_smoke 秒级刷新真值（Debug 构建在上方）；
      # cargo 真值从 core artifact 日志解析，不重跑 30 分钟测试；
      # shadow 产物真值来自 core artifact（当轮新鲜）。真值超龄即红
      #（无 --allow-stale），坏引用同红。
      - name: Facts doc-truth audit (CURRENT docs must equal machine truth)
        shell: bash
        run: go run ./scripts/facts --run --cargo-log native/cargo_test_ci.log check

      # G11（R4）：工程健康度看板（生产 unwrap 计数/超长文件/失败记录口径），
      # 报告上传 artifact；阈值门禁待阈值基线固化后启用
      - name: Engineering health report
        # D5 后续批次第四站（2026-09-18）：engineering_health.py → Go。
        # 双轨对账：摘要数值 / Top 表逐项一致（tie 行序差异已在驱动头注
        # 声明）。纯报告生成器，无红绿判定（无 J9 义务）。
        run: go run ./scripts/engineering_health
        shell: bash

      - name: Upload engineering health report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-health
          path: reports/engineering_health.md

      # U0#4：target 体积预算（防构建产物无界膨胀拖垮 runner 磁盘——两次 GB 级
      # 事故的制度性护栏之一；预算 10GB，超限 fail 并回显分布）
      - name: Target size budget (10GB)
        shell: bash
        run: |
          cd native
          total_bytes=$(du -sb target 2>/dev/null | cut -f1)
          total_gb=$(( (total_bytes + 1073741823) / 1073741824 ))
          echo "native/target = ${total_gb} GB (budget 10 GB)"
          du -sh target/* 2>/dev/null | sort -rh | head -8
          if [ "$total_gb" -gt 10 ]; then
            echo "::error::native/target 超出 10GB 预算——检查是否引入巨型依赖或死 target"
            exit 1
          fi

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version 0.6.16
        # 固定版本，避免非确定性；rust-cache 已缓存 cargo 目录

      - name: Generate coverage report
        run: cargo llvm-cov --lcov --output-path lcov.info
        working-directory: native

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: native/lcov.info
