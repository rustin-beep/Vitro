<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 716" role="img" aria-label="vitro 统一模式三态缓存">
  <title>统一模式 · 三态缓存（Triple-Cache）</title>
  <!-- 由 scripts/gen_svg 生成（勿手改）：对账 统一模式设计.md §2.1 表格三行 + §5.2 CheckpointManager 落地更新；数字为设计常量（非快照，无 data-fact 锚） -->
  <style>
    .bg     { fill: #FFFFFF; }
    .core   { fill: #155E86; fill-opacity: .07; stroke: #155E86; stroke-width: 3; }
    .card   { fill: #155E86; fill-opacity: .05; stroke: #155E86; stroke-width: 2.5; }
    .cons   { fill: none; stroke: #94A3AD; stroke-width: 2; }
    .warn   { fill: #155E86; fill-opacity: .04; stroke: #94A3AD; stroke-width: 2; stroke-dasharray: 7 5; }
    .plan   { fill: none; stroke: #94A3AD; stroke-width: 1.8; stroke-dasharray: 5 4; }
    .line   { stroke: #94A3AD; stroke-width: 3; fill: none; }
    .edge   { stroke: #94A3AD; stroke-width: 2.5; fill: none; }
    .ahf    { fill: #94A3AD; stroke: none; }
    .tn     { font-family: "Consolas","Cascadia Mono",monospace; font-size: 17px; fill: #155E86; stroke: none; }
    .zone   { fill: #155E86; fill-opacity: .028; stroke: #155E86; stroke-width: 1.6; }
    .tt     { font-family: "Segoe UI","Microsoft YaHei",sans-serif; font-size: 34px; font-weight: 600; fill: #0D1B24; stroke: none; }
    .t      { font-family: "Segoe UI","Microsoft YaHei",sans-serif; font-size: 23px; fill: #0D1B24; stroke: none; }
    .ts     { font-family: "Consolas","Cascadia Mono",monospace; font-size: 21px; fill: #155E86; stroke: none; }
    .tm     { font-family: "Segoe UI","Microsoft YaHei",sans-serif; font-size: 20px; fill: #5A6B75; stroke: none; }
    .tc     { font-family: "Segoe UI","Microsoft YaHei",sans-serif; font-size: 18px; fill: #5A6B75; stroke: none; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0D1B24; }
      .core { stroke: #4FB3E8; fill: #4FB3E8; fill-opacity: .1; }
      .card { stroke: #4FB3E8; fill: #4FB3E8; fill-opacity: .07; }
      .zone { stroke: #4FB3E8; fill: #4FB3E8; fill-opacity: .05; }
      .cons, .warn, .plan { stroke: #5A6B75; }
      .line, .edge { stroke: #5A6B75; }
      .ahf  { fill: #5A6B75; }
      .tt, .t { fill: #E9F1F7; }
      .ts, .tn { fill: #4FB3E8; }
      .tm, .tc { fill: #94A3AD; }
    }
  </style>
  <rect class="bg" width="1200" height="716"/>
<text class="tt" x="600" y="56" text-anchor="middle">统一模式 · 三态缓存（Triple-Cache）</text>
<text class="tm" x="600" y="92" text-anchor="middle">90% 操作只访问 Frame Cache（零延迟）· 10% 操作恢复 Active VM（从 Checkpoint 懒加载）· 只有一个“当前 VM”</text>
<rect class="card" x="30" y="130" width="340" height="210" rx="14"/>
<text class="t" x="200" y="172" text-anchor="middle">Frame Cache</text>
<text class="tc" x="200" y="206" text-anchor="middle">UnifiedEngine 滑动窗口（2000 帧）</text>
<text class="ts" x="200" y="242" text-anchor="middle">Vec&lt;StepPayload&gt;</text>
<text class="tm" x="200" y="278" text-anchor="middle">动画渲染 / 变量面板 / 进度条拖动</text>
<text class="tm" x="200" y="312" text-anchor="middle">大小：2~5MB（1000 步）</text>
<rect class="card" x="430" y="130" width="340" height="210" rx="14"/>
<text class="t" x="600" y="172" text-anchor="middle">Checkpoint</text>
<text class="tc" x="600" y="202" text-anchor="middle">vitro_vm::snapshot::CheckpointManager</text>
<text class="ts" x="600" y="232" text-anchor="middle">Vec&lt;(i32, VMSnapshot)&gt;</text>
<text class="tm" x="600" y="258" text-anchor="middle">全量 + 增量混合</text>
<text class="tm" x="600" y="286" text-anchor="middle">VM 状态恢复·继续执行</text>
<text class="tm" x="600" y="314" text-anchor="middle">大小：全量 50MB → 增量 5~10MB</text>
<rect class="card" x="830" y="130" width="340" height="210" rx="14"/>
<text class="t" x="1000" y="172" text-anchor="middle">Active VM</text>
<text class="tc" x="1000" y="206" text-anchor="middle">Rust 后端</text>
<text class="ts" x="1000" y="242" text-anchor="middle">VitroVM 实例</text>
<text class="tm" x="1000" y="278" text-anchor="middle">当前可执行的 VM 状态</text>
<text class="tm" x="1000" y="312" text-anchor="middle">大小：1MB</text>
<line class="line" x1="200" y1="340" x2="200" y2="430"/>
<line class="line" x1="600" y1="340" x2="600" y2="430"/>
<line class="line" x1="1000" y1="340" x2="1000" y2="430"/>
<line class="line" x1="200" y1="430" x2="1000" y2="430"/>
<line class="line" x1="600" y1="430" x2="600" y2="470"/>
<rect class="warn" x="120" y="470" width="960" height="146" rx="12"/>
<text class="t" x="600" y="508" text-anchor="middle">CheckpointManager 落地机制（§5.2，2026-09-11 核对）</text>
<text class="tc" x="600" y="540" text-anchor="middle">每 full_every 个检查点存完整 1MB 全量，其余仅存被修改的 4KB 脏页</text>
<text class="tc" x="600" y="566" text-anchor="middle">上限 max_checkpoints = 50 · smart_mode 语义关键点强制保存</text>
<text class="tc" x="600" y="592" text-anchor="middle">隔离区 quarantine 必须随快照往返，否则时间旅行回退后 UAF 检测出现假阴性</text>
<text class="tc" x="600" y="640" text-anchor="middle">Frame Cache 权威副本在引擎内；消费方经 vitro_get_step_payloads_json / serve payload.get 取用，不得假设窗口外历史仍可查询</text>
</svg>
