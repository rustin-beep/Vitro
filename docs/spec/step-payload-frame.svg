  <title>StepPayload Schema v0.1 · 单步快照帧（已冻结）</title>
  <!-- 由 scripts/gen_svg 生成（勿手改）：对账 docs/spec/STEP_PAYLOAD_SCHEMA_V0_1.md §0–§5；字段清单为 schema 冻结内容（非快照，无 data-fact 锚） -->
  <style>
    .bg     { fill: #FFFFFF; }
