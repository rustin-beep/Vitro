<text class="tc" x="153" y="602" text-anchor="middle">通过</text>
<text class="tc" x="153" y="626" text-anchor="middle">含双侧编译失败等价</text>
<rect class="card" x="287" y="540" width="226" height="110" rx="12"/>
<text class="ts" x="400" y="574" text-anchor="middle">DIFF-known</text>
<text class="tc" x="400" y="602" text-anchor="middle">白名单放行</text>
<text class="tc" x="400" y="626" text-anchor="middle">case + digest 锁定</text>
<rect class="warn" x="534" y="540" width="226" height="110" rx="12"/>
<text class="ts" x="647" y="574" text-anchor="middle">DIFF 非预期</text>
<text class="tc" x="647" y="602" text-anchor="middle">exit 1 · CI 即红</text>
<text class="tc" x="647" y="626" text-anchor="middle">无 Clang → exit 2</text>
<rect class="zone" x="780" y="128" width="390" height="192" rx="14"/>
<text class="t" x="975" y="160" text-anchor="middle">白名单纪律（活文档）</text>
<text class="tc" x="804" y="192" text-anchor="start">每条 = 用例名 + 差异 digest 锁定</text>
<text class="tc" x="804" y="218" text-anchor="start">输出漂移 → digest 失配 → 降级红</text>
<text class="tc" x="804" y="244" text-anchor="start">修复转绿 → 即红逼移除（只减不增）</text>
<text class="tc" x="804" y="270" text-anchor="start">新增条目须先以 DIFF 形态露红</text>
<text class="tc" x="804" y="296" text-anchor="start">CI 前置 --check-known 逐条复现</text>
<rect class="zone" x="780" y="340" width="390" height="170" rx="14"/>
<text class="t" x="975" y="372" text-anchor="middle">三个语义要点（比对面）</text>
<text class="tc" x="804" y="404" text-anchor="start">① 纯 stdout 通道：附注 / stderr 不进</text>
<text class="tc" x="804" y="430" text-anchor="start">② stdin 注入：两侧同份字节</text>
<text class="tc" x="804" y="456" text-anchor="start">③ Latin-1 归一：0xC8 → 0xC3 0x88 折回</text>
<text class="tc" x="804" y="482" text-anchor="start">（U+0080–00FF 封闭域，无损可逆）</text>
<rect class="zone" x="780" y="530" width="390" height="170" rx="14"/>
<text class="t" x="975" y="562" text-anchor="middle">与 vm_diff 五闸分工</text>
<text class="tc" x="804" y="594" text-anchor="start">本防线：直面 Clang 活真值，</text>
<text class="tc" x="804" y="620" text-anchor="start">抓引擎与真值的一切偏差</text>
<text class="tc" x="804" y="646" text-anchor="start">vm_diff：对拍冻结 golden 抓回归</text>
<text class="tc" x="804" y="672" text-anchor="start">互补：固化锚共同偏差逃不过 Clang</text>
