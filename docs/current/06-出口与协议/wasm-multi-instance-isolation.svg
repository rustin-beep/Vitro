  <rect class="bg" width="1200" height="880"/>
<text class="tt" x="600" y="56" text-anchor="middle">wasm 多实例并发隔离</text>
<text class="tm" x="600" y="94" text-anchor="middle">裁定（2026-09-19）：每线程一个完全独立的引擎实例——隔离是 wasm 实例模型的构造性质，不依赖引擎侧线程安全改造</text>
<rect class="warn" x="40" y="116" width="390" height="240" rx="14"/>
<text class="t" x="235" y="150" text-anchor="middle">反例：capi 单实例形态</text>
<text class="tc" x="235" y="178" text-anchor="middle">（形态本身的构造缺陷，非可修 bug）</text>
<text class="tc" x="235" y="210" text-anchor="middle">单进程单实例全局状态</text>
<text class="tc" x="235" y="238" text-anchor="middle">DLL 并发调用 → 堆损坏（引擎非线程安全）</text>
<text class="tc" x="235" y="266" text-anchor="middle">Vitro 侧调用必须互斥</text>
<text class="tc" x="235" y="302" text-anchor="middle">wasm 多实例是其正解：同进程 N 实例</text>
<text class="tc" x="235" y="330" text-anchor="middle">替代「N 进程 DLL 池」或「单实例互斥」</text>
<rect class="core" x="470" y="116" width="700" height="248" rx="14"/>
<text class="t" x="494" y="150" text-anchor="start">正解：同进程 N 个完全独立的引擎实例</text>
