<!doctype html>
<html lang="zh-CN" data-theme="glass">
  <!-- F4 收尾（2026-10-17，refs #122）：试点页升格为唯一入口——
       旧栈（index.html+style.css+app.ts）退役，vite 为唯一构建
       （npm run pilot:build → dist/）。方法面声明由 demo_smoke 机判对账：
       主方法面 25（错误帧自报单源；algorithms.catalog 随 #36 上线计入），本页消费数 = src/ 的 method: 字面量
       去重数（dump 族 5 个不计入主面——与错误帧分号分段同口径）。 -->
  <!-- 方法面（25 个，本页消费 9 个）-->
  <!-- data-theme 必设：tokens.css 主题变量挂在 [data-theme=...] 选择器下。
       防闪脚本 = 五键 + 旧值迁移规则与 persisted.svelte.ts 逐字一致，改任一
       侧须对表另一侧——防闪必须在 DOM 解析期执行，无法共享模块）。 -->
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vitro 引擎 · 白箱 C 教学引擎（wasm-gc 直调 demo）</title>
    <link rel="icon" type="image/svg+xml" href="./assets/logo/vitro-icon.svg" />
    <script>
      try {
        var _t = localStorage.getItem("vitro-theme");
        if (_t === "light") _t = "ice";
        else if (!_t || _t === "dark") _t = "glass";
        document.documentElement.setAttribute("data-theme", _t);
        document.documentElement.setAttribute("data-shade", _t === "glass" || _t === "soft" ? "night" : "day");
        var _f = localStorage.getItem("vitro-ed-font");
        if (_f === "13px" || _f === "16px") document.documentElement.style.setProperty("--ed-fs", _f);
        if (localStorage.getItem("vitro-motion") === "off") document.documentElement.setAttribute("data-motion", "off");
      } catch (e) {}
    </script>
    <!-- 令牌 CSS 经 src/app.css 的 @import 打包引入（public 资产 link 会被 vite 丢弃） -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
