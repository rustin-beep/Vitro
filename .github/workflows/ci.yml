name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      refresh:
        # 手动强制 fuzz 判定缓存全量重算覆写（PR #310 审阅 P3-4：缓存疑似
        # 污染时的逃生门——此前只有夜间 schedule 一条道，或删 cache UI）
        description: "Force fuzz judge cache refresh (bypass all hits)"
        required: false
        default: false
        type: boolean
  schedule:
    # 夜间全量重算（北京时间 02:00）：Clang Golden 缓存强制失效重算，防版本漂移
    # （见 scripts/shadow_verify.go 文件头与 docs/current 工作记录）
    - cron: '0 18 * * *'

# 前端切割（2026-09-11）：CideFlutter / FRB / flutter-android-ios jobs 已随前端
# 迁出（标签 before-frontend-split 保留完整历史）。本仓库现为纯后端仓，
# CI 验证 Rust 引擎 + 三出口防线 + wasm 出口冒烟（G2）。
#
# ── core / hygiene 两 job 拆分（2026-09-23，用户裁定）────────────────────────
# 此前单 job 全部步骤一个红灯，"CI 老是红"的信噪比问题来自两类检查混灯：
#   core  = 准入型（代码/契约坏了）——红了立即处置，当天清；
#   hygiene = 记账型（文档/环境/产物与真值的账没跟上）——白天推进时是预期债，
#           夜间批量复绿，不阻塞推进。
# 分类判据一句话：红了是否意味着「这一批提交不能要」——否则归 hygiene。
# 工具链追新是既定策略（MoonBit 未到 1.0，breaking 只能跟着走），故
# toolchain_probe 红属 hygiene：含义是「该走 moon-toolchain-upgrade-playbook
# 迁移流程了」，不是「代码坏了」。
# 过时 push 的 run 自动取消（2026-10-03 拆批接线）：连续 push 时只有最新
# commit 的 run 跑满全程（此前每笔 push 都烧满 ~19 分钟——9981ac2 三笔连红
# 实证）。group 加事件后缀（2026-11-01 审阅 v2 S13b-P6 修正）：GitHub 语义
# 是「新 run 的 cancel 表达式决定是否取消组内正在跑的旧 run」——不加后缀时
# schedule 轮（cancel=false）只保护它前面的 run，不保护它自己，夜间全量
# 重算轮（CF_JUDGE_REFRESH 覆写 / Clang Golden 强制重算）可被任何到达的
# push 轮取消且无留痕；加后缀后各事件分流取消，同事件同 ref 互斥不变。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}


# ── 闸级 job 化（2026-10-11，防线建设批）────────────────────────────────
# 此前 core 单 job 串 60 步——一步红后续全 skip，B 闸红遮 C 闸红（16/20 红
# 步骤分布实证：fmt×4/TSV×3/直拍×3/台账×2/单发×6 轮换，"改了又红"根因）。
# 拆分后闸与闸互不遮挡：build 红挡下游（产物无——合理依赖）；
# 六实例差分矩阵逐驱动独立红绿。配合语义统一（--freeze-mb 默认含存量重算、
# --refresh 删除 fail loud）消灭「入新键 vs 刷存量 vs 手删旧键」三套心智。
#
# ── 主 CI 恒全量裁定（2026-10-15，CI 全跳事故后）──────────────────────────
# 本文件**无任何条件跳过**（不做 changes 分类器/不做 docs-only 快车道）——
# 10da06a6 的 changes job 形态实锤两个单点故障：分类器挂=全 job 雪崩 +
# 提交信息正文提及 GitHub 跳过指令方括号字样（方括号形态本注释不写出——写出即触发）即原生全跳
# ——两机制叠加致 CI 防线静默失守两笔。moonbitlang 生态考察（core/moon）
# 共识 = 主 CI 恒全量；文档减负需求由独立薄 workflow 承接（docs-quick.yml，
# on.paths 原生过滤、与主 CI 完全解耦、红不阻塞）。本文件报绿 = 防线真绿。
#
# ── CI 文件拆分批（2026-11-14）────────────────────────────────────────────
# ci.yml 2357 行单文件 → 编排层（本文件）+ 8 个 called 单元 + nightly.yml
# （reusable workflow：GitHub 无 include 机制，这是唯一不破 artifact 共享/
# needs 传导/单点 concurrency 的拆法）。动机：单文件超 2000 行后维护者与
# agent 只能 grep 定位（缺漏面——防线接线漏项的温床），拆分后每个文件
# 几百行可整读。**防线语义零变化**，三条不变式：
#   ① called job 与 caller 同 run：build-products artifact 同域共享、
#      红态向 caller job 传导 → ci-summary 判红等价；
#   ② 原 needs 关系保真：原 `needs: build-artifacts` 的 job 全部进
#      `needs: build` 分组；原无 needs 的 job（static/hygiene/tools 族）
#      保持无 needs——build 红时其健康面仍可见（红遮红治理，2026-10-11）；
#   ③ mutation 独立 caller job 不入 ci-summary needs——2026-10-31
#      report-only 观察期拍板不被分组连坐。
# job 实体位置：build→ci-build / gates-diff+corpus-fuzz+green_probe→ci-diff /
# gates-native+gates-wasm+arm4-wasmtime→ci-engine-gates / static-gates→
# ci-static / hygiene→ci-hygiene / demo+desktop→ci-frontends /
# backend-triage+cli-smoke-linux+release-preflight+scripts-ts→ci-tools /
# mutation-gate→ci-mutation；三 sentinel（schedule-only）→ nightly.yml
# （主 CI 的 push/PR 轮从此不再挂三个恒 skipped job；schedule 轮的 fuzz
# 缓存重算 / clang golden 重算 / step_invariant 全量档仍在本文件）。
# 已知代价（接受）：check run 显示名多一级分组前缀（`diff / Diff gate
# (parser_diff)` 形态）；required checks 若按精确名匹配需同步（子串匹配
# 不受影响）。ci_checklist ④ 目标面判据已连坐改扫全部 workflow 文件。

jobs:
  # ── 产物准入（原 build-artifacts job → ci-build.yml）──────────────────
  build:
    uses: ./.github/workflows/ci-build.yml

  # ── 行为差分组（原 gates-diff / corpus-fuzz / green_probe → ci-diff.yml）──
  # refresh 透传（PR #310 逃生门）：表达式恒输出布尔，非 dispatch 事件
  # inputs.refresh 缺省 → false。
  diff:
    needs: build
    uses: ./.github/workflows/ci-diff.yml
    with:
      refresh: ${{ inputs.refresh == true }}

  # ── 引擎闸组（原 gates-native / gates-wasm / arm4-wasmtime →
  #    ci-engine-gates.yml）──────────────────────────────────────────────
  engine:
    needs: build
    uses: ./.github/workflows/ci-engine-gates.yml

  # ── 静态对账（原 static-gates → ci-static.yml；无产物依赖与 build 并行）──
  static:
    uses: ./.github/workflows/ci-static.yml

  # ── 记账型（原 hygiene → ci-hygiene.yml；无 needs——build 红仍可见）──────
  hygiene:
    uses: ./.github/workflows/ci-hygiene.yml

  # ── 前端双面（原 demo / desktop → ci-frontends.yml）────────────────────
  frontends:
    needs: build
    uses: ./.github/workflows/ci-frontends.yml

  # ── 工具族（原 backend-triage / cli-smoke-linux / release-preflight /
  #    scripts-ts → ci-tools.yml；无 needs——红遮红治理保真）──────────────
  tools:
    uses: ./.github/workflows/ci-tools.yml

  # ── mutation 突变闸（原 mutation-gate → ci-mutation.yml；report-only
  #    观察期独立 caller job——不入下方 ci-summary needs，2026-10-31 拍板）──
  mutation:
    uses: ./.github/workflows/ci-mutation.yml

  # ── ci-summary（防「skipped 当绿」，2026-10-23）────────────────────────
  # 只做汇总、不重跑闸：所有上游分组必须 success；任一 failure/skipped 即红。
  # 这样 build 红导致下游 skipped 时不会显示成「其余全绿可合并」。
  # 拆分批连坐（2026-11-14）：needs 面从 15 job 收敛为 7 分组 caller job
  # （mutation 豁免沿袭）；分组内 job 红态向 caller job 传导，判红语义等价。
  ci-summary:
    name: CI summary (all gates must be success)
    if: always()
    needs: [build, diff, engine, static, hygiene, frontends, tools]
    runs-on: ubuntu-latest
    steps:
      - name: summarize gate results
        env:
          BUILD: ${{ needs.build.result }}
          DIFF: ${{ needs.diff.result }}
          ENGINE: ${{ needs.engine.result }}
          STATIC: ${{ needs.static.result }}
          HYGIENE: ${{ needs.hygiene.result }}
          FRONTENDS: ${{ needs.frontends.result }}
          TOOLS: ${{ needs.tools.result }}
        run: |
          set +e
          # 2026-10-30 审计批：needs/env/循环三面曾失衡（needs 11 而循环 10——
          # backend-triage 红/跳过时汇总不判红）；计数文案改由数组推导防再陈旧。
          # 2026-10-31 审阅批 P2-1：release-preflight 三面连坐补入（mutation-gate
          # 有「观察期不入 needs」豁免注记，本 job 无豁免理由——漏登记即同形复发）。
          # 2026-11-14 PR #513 审阅 P1-1：green_probe 三面补入（第三次同形复发）；
          # 同时「gate job 集 ⊆ ci-summary 三面」已机判化进 ci_checklist（④ 后 ⑤ 判据，
          # schedule-only job 自动豁免 + mutation 分组显式豁免表）——第四次不会再静默。
          # 同日拆分批：三面收敛为 7 分组（mutation 豁免改挂 caller id `mutation`）。
          pairs=(
            "build:$BUILD" "diff:$DIFF" "engine:$ENGINE"
            "static:$STATIC" "hygiene:$HYGIENE" "frontends:$FRONTENDS"
            "tools:$TOOLS"
          )
          bad=0
          for pair in "${pairs[@]}"; do
            name="${pair%%:*}"; result="${pair#*:}"
            echo "$name=$result"
            if [ "$result" != "success" ]; then bad=1; fi
          done
          if [ "$bad" != "0" ]; then
            echo "::error::CI 汇总红：有分组 failure/skipped——skipped 不算绿（防遮蔽）"
            exit 1
          fi
          echo "CI 汇总：${#pairs[@]} 个上游分组全部 success"
        shell: bash
