# ── CI 拆分批（2026-11-14）：本文件 = 主 CI（ci.yml）的 called 单元 ──────────
# build-artifacts job 自 ci.yml 逐字搬迁（步骤/注释裁定资产零改动），唯一机械变换 =
# 删跨文件无效的 `needs: build-artifacts` 行（时序由 caller 侧 needs 承接，
# 语义等价）。called job 与 caller 同 run 执行：artifact / cache /
# needs 红态传导 / github 上下文（event_name 等触发事件面）全同域。
# 编排与汇总（ci-summary）见 ci.yml；夜间哨兵见 nightly.yml。
name: CI build
on:
  workflow_call:
jobs:
  build-artifacts:
    name: Build artifacts (native/wasm/js, 无测试)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Go vet/test 步已随 #273 迁移批（2026-10-25）失效摘除——CI go run
      # 活行清零，下游跑防线不再需要 Go 工具链。

      # Clang Golden 缓存（方案 A）：结果是确定性的（同一源码 + 同一 clang 版本
      # ⇒ 同一结果），跨 CI 运行复用可把 Shadow 从分钟级降到秒级。
      # key 含 clang 版本 —— 版本一变缓存自动失效，这就是"防版本漂移"的第一道闸；
      # 第二道闸是夜间 schedule 的 --refresh-clang 全量重算。
      - name: Install MoonBit toolchain (differential anchors)
        uses: ./.github/actions/setup-moonbit


      # MoonBit 单测归 hygiene 的四 target 步（2026-10-23 提速批）：
      # native 全量此前在本 job 与 hygiene 各跑一遍，纯重复；本 job 只负责
      # 产物构建，测试红由 hygiene 显式红，不再挡 artifact 产出。

      # ── 静态对账闸族（秒级批量，fail fast 先于分钟级行为闸）────────────
      # 防遮蔽（job 内，2026-10-23）：单测/前置步红后仍继续构建并上传 artifact，
      # 但下游 job 仍 `needs: build-artifacts`，build 整体红时依旧 skipped；
      # 这层只保证「本 job 内能跑的步都跑」。job 间遮蔽由末尾 ci-summary
      # 显式判 skipped/failure 为红兜底（不把 skipped 当绿）。
      # ── moon 构建产物缓存（#309 P1，2026-10-25）──────────────────────
      # Build job 大头 = native 全量 108s + wasmopt 供给 44s（run 40178073268
      # 实测分布）。缓存 moonbit/_build（195M 级）+ tools/cache（binaryen 供给，
      # 版本钉死）后：源未变批（文档/脚本）三目标增量合计 ~3.4s（本地实证），
      # 关键路径预期 -2~3m（PR #310 首轮 CI 为冷态全量，warm 轮收益待后续 run 落数）。
      #
      # key 设计（与 P0 判定缓存不同源理）：**不含源 hash**——含源 hash 则每
      # 次 restore miss，增量缓存毫无意义；源变面由 moon 增量内容 hash 自算
      # 重编（本地双臂实验实证：改 cli_run.mbt 一行 → native 29 tasks / js 8
      # tasks 精准重编、产物行为随新源；源还原回旧内容同样触发重编回旧产物，
      # 无漏判假绿面）。key 组件 = os + **clang 版本**（PR #310 审阅 P2-1：native
      # 产物由 MOON_CC=clang 构建，runner 镜像自带 clang 换版而 .moonbit-version
      # 不变时，须换血防「旧 clang 编的产物被静默复用」——与纪律 11 的 UB 结局
      # 可漂立论同源）+ toolchain 版本 + sha（逐轮新 entry，actions/cache 同 key
      # 不覆盖）；restore-keys **只留一级**（审阅 P1-1：二级 os 前缀会跨过
      # toolchain/clang 隔离——恰在唯一不该复用的场景兜底，与「缓存换血」
      # 设计自相矛盾）。
      #
      # 正确性守门 = **两层**（PR #310 审阅 P2-3 勘误，原三层表述不成立）：
      # ① moon 增量内容 hash（上段实验）；② 下游行为防线（digest 对拍/gates）
      # 抓漏网。EnsureFresh **不在本守门面**——其调用方全在 gates-native、消费
      # download-artifact（mtime 恒新），看不到本 job restore 出的 _build。
      # CI 从「每轮冷态全量」转为「依赖 moon 增量正确性」，此依赖被两层覆盖。
      #
      # 与 P0 的耦合（审阅 P2-4 登记）：P0 判定缓存命中前提 = 本缓存命中
      # （native exe 含 PE TimeDateStamp 不可复现，重建即字节变 → 引擎 hash 变
      # → epoch 换血）——两缓存成「全命中或全不命中」二态，偏保守无正确性
      # 风险；解耦的语义指纹方案评估后不采（源指纹漏维度比 exe 字节更危险，
      # 保守设计取 exe 字节）。
      - name: Clang version (for moon-build cache key)
        id: clangver
        shell: bash
        run: echo "value=$(clang --version | head -n1 | tr -d ' ' | cut -c1-48)" >> "$GITHUB_OUTPUT"
      - name: Cache moon build tree + wasmopt supply
        uses: actions/cache@v4
        with:
          path: |
            moonbit/_build
            tools/cache
          key: moon-build-${{ runner.os }}-${{ steps.clangver.outputs.value }}-${{ hashFiles('.moonbit-version') }}-${{ github.sha }}
          restore-keys: |
            moon-build-${{ runner.os }}-${{ steps.clangver.outputs.value }}-${{ hashFiles('.moonbit-version') }}-
      - name: Full native release build gate (declared targets must build)
        if: always()
        # 2026-09-29 §12.6 建；同日拆包落地后转硬门（豁免分支已删——
        # gateway 本体改 library，4 导出面在 gateway/wasm 外壳，wasm-gc
        # 单目标）。全量 --target native 是唯一会遍历每个包的形态。
        # MOON_CC=clang（纪律 11 + 2026-10-05 审阅批）：被测物构建器与本地
        # 一致（MSVC 构建的 cmd/run 在 UB 语料上结局可漂——bTree_default
        # 0xC0000005 vs clang 构建受检 trap，known_direct 双集补录在案）；
        # 且 MSVC 全量构建实测 12m51s，clang 显著更快（moon#2254）。
        shell: bash
        run: |
          cd moonbit
          MOON_CC=clang moon build --release --target native
          echo "全量 native release 构建：通过（每个包都真的被构建过）"
      - name: wasm-gc gateway build (artifact source)
        if: always()
        # 自「wasm-gc gateway build + Node host smoke」拆出（2026-10-11）：
        # 构建归本 job（产物进 artifact），Node smoke 归 gates-wasm。
        shell: bash
        run: cd moonbit && moon build --release --target wasm-gc gateway/wasm
      - name: Install Node (wasmopt supply)
        if: always()
        # #120 批①（2026-10-17）：wasm-opt 构建后置——binaryen JS API 经
        # node 执行（供给钉版本下载到 tools/cache，sha256 校验）。
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: wasm-opt post-build (artifact source)
        if: always()
        # 产物出口后置优化（#120 批①）：-19.3% raw / -20.4% gzip（lean
        # 产物实测）；等价性背书 = 下游 gates-wasm 四 slice（vm_diff wasm
        # 全量语料 + cli_smoke 三臂对拍 + serve_channel 体积/通道断言）
        # 消费本优化产物。二跑确定性自检内置；sidecar 指纹随产物进
        # artifact（wasmopt -check 可验）。moon 增量缓存对产物外部替换
        # 无感知（判 up-to-date 不重建）——下游 EnsureFresh 复核不回退。
        shell: bash
        # 二轮审阅 P2：优化落盘后 -check 自证（sidecar 指纹回读比对——
        # 落盘与标记原子性在闸内闭环）
        run: |
          node scripts/wasmopt/main.mts moonbit/_build/wasm-gc/release/build/gateway/wasm/wasm.wasm
          node scripts/wasmopt/main.mts -check moonbit/_build/wasm-gc/release/build/gateway/wasm/wasm.wasm
      - name: Full js target build gate (all packages) + CLI entry (artifact source)
        if: always()
        # 三后端批（2026-10-15）：js 入口产物——gates-wasm 的 smoke 前置
        # 产物检查消费（cmd/vitro_js/vitro_js.js）。
        # 全量 js 编译闸（2026-10-15 补——审阅指出缺口）：此前只编
        # cmd/vitro_js 单入口树，其余包的 js 目标编译错（如 gateway 改
        # extern "js" 面）只有 moon test --target js 的测试遍历能抓——
        # 零测试包 js 编译坏不红。全量形态与 Full native release build
        # gate 同构（js 无 C 链，冷态成本远低于 native 全量）。
        shell: bash
        run: cd moonbit && moon build --release --target js
      - name: Upload build products (native release exe set + wasm module + js entry)
        if: always()
        # 拆批基建（2026-10-11 闸级 job 化）：release 全量构建产物供下游
        # gates-diff / gates-native / gates-wasm / demo 消费——四个 job 免重复
        # 构建（此前 core 串行一步红全断；闸间遮挡即此形态）。download 侧
        # path=moonbit/_build 还原相对布局（脚本内置路径零改动）。
        uses: actions/upload-artifact@v4
        with:
          name: build-products
          path: |
            moonbit/_build/native/release/build/**/*.exe
            moonbit/_build/wasm-gc/release/build/gateway/wasm/wasm.wasm
            moonbit/_build/js/release/build/cmd/vitro_js/vitro_js.js
            moonbit/_build/js/release/build/cmd/vitro_wasm/vitro_wasm.js
            moonbit/_build/js/release/build/teaching/langpack/langpack.js
          retention-days: 3
