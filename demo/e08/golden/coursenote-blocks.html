<article class="cnote "><h1 >冒泡排序</h1> <p >相邻元素两两比较，较大者向后交换——每一轮把当前最大值「冒泡」到末尾。</p><h2 >核心代码</h2><pre class="cn-code " data-lang="c"><code>for (int i = 0; i &lt; n - 1; i++) for (int j = 0; j &lt; n - 1 - i; j++) if (a[j] > a[j+1]) { int t = a[j]; a[j] = a[j+1]; a[j+1] = t; }</code></pre><ul ><li>外层 i 控制轮数：n-1 轮</li><li>内层 j 相邻比较：随 i 递减（有序尾不再参与）</li></ul><div class="cn-table "><table ><thead><tr><th >轮次</th><th >比较次数</th><th >有序尾长</th></tr></thead><tbody><tr><td >1</td><td >3</td><td >1</td></tr><tr><td >2</td><td >2</td><td >2</td></tr><tr><td >3</td><td >1</td><td >3</td></tr></tbody></table></div></article>
