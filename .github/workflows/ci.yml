name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      refresh:
        # 手动强制 fuzz 判定缓存全量重算覆写（PR #310 审阅 P3-4：缓存疑似
        # 污染时的逃生门——此前只有夜间 schedule 一条道，或删 cache UI）
        description: "Force fuzz judge cache refresh (bypass all hits)"
        required: false
        default: false
        type: boolean
  schedule:
    # 夜间全量重算（北京时间 02:00）：Clang Golden 缓存强制失效重算，防版本漂移
    # （见 scripts/shadow_verify.go 文件头与 docs/current 工作记录）
    - cron: '0 18 * * *'

# 前端切割（2026-09-11）：CideFlutter / FRB / flutter-android-ios jobs 已随前端
# 迁出（标签 before-frontend-split 保留完整历史）。本仓库现为纯后端仓，
# CI 验证 Rust 引擎 + 三出口防线 + wasm 出口冒烟（G2）。
#
# ── core / hygiene 两 job 拆分（2026-09-23，用户裁定）────────────────────────
# 此前单 job 全部步骤一个红灯，"CI 老是红"的信噪比问题来自两类检查混灯：
#   core  = 准入型（代码/契约坏了）——红了立即处置，当天清；
#   hygiene = 记账型（文档/环境/产物与真值的账没跟上）——白天推进时是预期债，
#           夜间批量复绿，不阻塞推进。
# 分类判据一句话：红了是否意味着「这一批提交不能要」——否则归 hygiene。
# 工具链追新是既定策略（MoonBit 未到 1.0，breaking 只能跟着走），故
# toolchain_probe 红属 hygiene：含义是「该走 moon-toolchain-upgrade-playbook
# 迁移流程了」，不是「代码坏了」。
# 过时 push 的 run 自动取消（2026-10-03 拆批接线）：连续 push 时只有最新
# commit 的 run 跑满全程（此前每笔 push 都烧满 ~19 分钟——9981ac2 三笔连红
# 实证）。group 加事件后缀（2026-11-01 审阅 v2 S13b-P6 修正）：GitHub 语义
# 是「新 run 的 cancel 表达式决定是否取消组内正在跑的旧 run」——不加后缀时
# schedule 轮（cancel=false）只保护它前面的 run，不保护它自己，夜间全量
# 重算轮（CF_JUDGE_REFRESH 覆写 / Clang Golden 强制重算）可被任何到达的
# push 轮取消且无留痕；加后缀后各事件分流取消，同事件同 ref 互斥不变。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}


# ── 闸级 job 化（2026-10-11，防线建设批）────────────────────────────────
# 此前 core 单 job 串 60 步——一步红后续全 skip，B 闸红遮 C 闸红（16/20 红
# 步骤分布实证：fmt×4/TSV×3/直拍×3/台账×2/单发×6 轮换，"改了又红"根因）。
# 拆分后闸与闸互不遮挡：build 红挡下游（产物无——合理依赖）；
# 六实例差分矩阵逐驱动独立红绿。配合语义统一（--freeze-mb 默认含存量重算、
# --refresh 删除 fail loud）消灭「入新键 vs 刷存量 vs 手删旧键」三套心智。
#
# 分类判据沿袭（红了是否意味着这批不能要）：
#   build-artifacts = 产物准入（编译/构建坏）——下游 needs 它；测试归 hygiene
#   gates-diff     = 行为差分（matrix 六实例独立）
#   gates-native   = 消费 exe 的协议/冒烟族
#   gates-wasm     = wasm 臂族 + cli smoke（matrix 四实例独立，2026-10-17
#                    拆分——原单 job 串行链红遮红实锤后收口）
#   static-gates   = 纯对账/生成器闸（无产物依赖——与 build 并行）
#   scripts-ts     = 判定脚本 TS 四件套门（#273：tsc/oxlint/node:test）
#   hygiene        = 记账型（fmt/四 target test/环境探针）
#
# ── 主 CI 恒全量裁定（2026-10-15，CI 全跳事故后）──────────────────────────
# 本文件**无任何条件跳过**（不做 changes 分类器/不做 docs-only 快车道）——
# 10da06a6 的 changes job 形态实锤两个单点故障：分类器挂=全 job 雪崩 +
# 提交信息正文提及 GitHub 跳过指令方括号字样（方括号形态本注释不写出——写出即触发）即原生全跳
# ——两机制叠加致 CI 防线静默失守两笔。moonbitlang 生态考察（core/moon）
# 共识 = 主 CI 恒全量；文档减负需求由独立薄 workflow 承接（docs-quick.yml，
# on.paths 原生过滤、与主 CI 完全解耦、红不阻塞）。本文件报绿 = 防线真绿。


jobs:
  build-artifacts:
    name: Build artifacts (native/wasm/js, 无测试)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Go vet/test 步已随 #273 迁移批（2026-10-25）失效摘除——CI go run
      # 活行清零，下游跑防线不再需要 Go 工具链。

      # Clang Golden 缓存（方案 A）：结果是确定性的（同一源码 + 同一 clang 版本
      # ⇒ 同一结果），跨 CI 运行复用可把 Shadow 从分钟级降到秒级。
      # key 含 clang 版本 —— 版本一变缓存自动失效，这就是"防版本漂移"的第一道闸；
      # 第二道闸是夜间 schedule 的 --refresh-clang 全量重算。
      - name: Install MoonBit toolchain (differential anchors)
        uses: ./.github/actions/setup-moonbit


      # MoonBit 单测归 hygiene 的四 target 步（2026-10-23 提速批）：
      # native 全量此前在本 job 与 hygiene 各跑一遍，纯重复；本 job 只负责
      # 产物构建，测试红由 hygiene 显式红，不再挡 artifact 产出。

      # ── 静态对账闸族（秒级批量，fail fast 先于分钟级行为闸）────────────
      # 防遮蔽（job 内，2026-10-23）：单测/前置步红后仍继续构建并上传 artifact，
      # 但下游 job 仍 `needs: build-artifacts`，build 整体红时依旧 skipped；
      # 这层只保证「本 job 内能跑的步都跑」。job 间遮蔽由末尾 ci-summary
      # 显式判 skipped/failure 为红兜底（不把 skipped 当绿）。
      # ── moon 构建产物缓存（#309 P1，2026-10-25）──────────────────────
      # Build job 大头 = native 全量 108s + wasmopt 供给 44s（run 40178073268
      # 实测分布）。缓存 moonbit/_build（195M 级）+ tools/cache（binaryen 供给，
      # 版本钉死）后：源未变批（文档/脚本）三目标增量合计 ~3.4s（本地实证），
      # 关键路径预期 -2~3m（PR #310 首轮 CI 为冷态全量，warm 轮收益待后续 run 落数）。
      #
      # key 设计（与 P0 判定缓存不同源理）：**不含源 hash**——含源 hash 则每
      # 次 restore miss，增量缓存毫无意义；源变面由 moon 增量内容 hash 自算
      # 重编（本地双臂实验实证：改 cli_run.mbt 一行 → native 29 tasks / js 8
      # tasks 精准重编、产物行为随新源；源还原回旧内容同样触发重编回旧产物，
      # 无漏判假绿面）。key 组件 = os + **clang 版本**（PR #310 审阅 P2-1：native
      # 产物由 MOON_CC=clang 构建，runner 镜像自带 clang 换版而 .moonbit-version
      # 不变时，须换血防「旧 clang 编的产物被静默复用」——与纪律 11 的 UB 结局
      # 可漂立论同源）+ toolchain 版本 + sha（逐轮新 entry，actions/cache 同 key
      # 不覆盖）；restore-keys **只留一级**（审阅 P1-1：二级 os 前缀会跨过
      # toolchain/clang 隔离——恰在唯一不该复用的场景兜底，与「缓存换血」
      # 设计自相矛盾）。
      #
      # 正确性守门 = **两层**（PR #310 审阅 P2-3 勘误，原三层表述不成立）：
      # ① moon 增量内容 hash（上段实验）；② 下游行为防线（digest 对拍/gates）
      # 抓漏网。EnsureFresh **不在本守门面**——其调用方全在 gates-native、消费
      # download-artifact（mtime 恒新），看不到本 job restore 出的 _build。
      # CI 从「每轮冷态全量」转为「依赖 moon 增量正确性」，此依赖被两层覆盖。
      #
      # 与 P0 的耦合（审阅 P2-4 登记）：P0 判定缓存命中前提 = 本缓存命中
      # （native exe 含 PE TimeDateStamp 不可复现，重建即字节变 → 引擎 hash 变
      # → epoch 换血）——两缓存成「全命中或全不命中」二态，偏保守无正确性
      # 风险；解耦的语义指纹方案评估后不采（源指纹漏维度比 exe 字节更危险，
      # 保守设计取 exe 字节）。
      - name: Clang version (for moon-build cache key)
        id: clangver
        shell: bash
        run: echo "value=$(clang --version | head -n1 | tr -d ' ' | cut -c1-48)" >> "$GITHUB_OUTPUT"
      - name: Cache moon build tree + wasmopt supply
        uses: actions/cache@v4
        with:
          path: |
            moonbit/_build
            tools/cache
          key: moon-build-${{ runner.os }}-${{ steps.clangver.outputs.value }}-${{ hashFiles('.moonbit-version') }}-${{ github.sha }}
          restore-keys: |
            moon-build-${{ runner.os }}-${{ steps.clangver.outputs.value }}-${{ hashFiles('.moonbit-version') }}-
      - name: Full native release build gate (declared targets must build)
        if: always()
        # 2026-09-29 §12.6 建；同日拆包落地后转硬门（豁免分支已删——
        # gateway 本体改 library，4 导出面在 gateway/wasm 外壳，wasm-gc
        # 单目标）。全量 --target native 是唯一会遍历每个包的形态。
        # MOON_CC=clang（纪律 11 + 2026-10-05 审阅批）：被测物构建器与本地
        # 一致（MSVC 构建的 cmd/run 在 UB 语料上结局可漂——bTree_default
        # 0xC0000005 vs clang 构建受检 trap，known_direct 双集补录在案）；
        # 且 MSVC 全量构建实测 12m51s，clang 显著更快（moon#2254）。
        shell: bash
        run: |
          cd moonbit
          MOON_CC=clang moon build --release --target native
          echo "全量 native release 构建：通过（每个包都真的被构建过）"
      - name: wasm-gc gateway build (artifact source)
        if: always()
        # 自「wasm-gc gateway build + Node host smoke」拆出（2026-10-11）：
        # 构建归本 job（产物进 artifact），Node smoke 归 gates-wasm。
        shell: bash
        run: cd moonbit && moon build --release --target wasm-gc gateway/wasm
      - name: Install Node (wasmopt supply)
        if: always()
        # #120 批①（2026-10-17）：wasm-opt 构建后置——binaryen JS API 经
        # node 执行（供给钉版本下载到 tools/cache，sha256 校验）。
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: wasm-opt post-build (artifact source)
        if: always()
        # 产物出口后置优化（#120 批①）：-19.3% raw / -20.4% gzip（lean
        # 产物实测）；等价性背书 = 下游 gates-wasm 四 slice（vm_diff wasm
        # 全量语料 + cli_smoke 三臂对拍 + serve_channel 体积/通道断言）
        # 消费本优化产物。二跑确定性自检内置；sidecar 指纹随产物进
        # artifact（wasmopt -check 可验）。moon 增量缓存对产物外部替换
        # 无感知（判 up-to-date 不重建）——下游 EnsureFresh 复核不回退。
        shell: bash
        # 二轮审阅 P2：优化落盘后 -check 自证（sidecar 指纹回读比对——
        # 落盘与标记原子性在闸内闭环）
        run: |
          node scripts/wasmopt/main.mts moonbit/_build/wasm-gc/release/build/gateway/wasm/wasm.wasm
          node scripts/wasmopt/main.mts -check moonbit/_build/wasm-gc/release/build/gateway/wasm/wasm.wasm
      - name: Full js target build gate (all packages) + CLI entry (artifact source)
        if: always()
        # 三后端批（2026-10-15）：js 入口产物——gates-wasm 的 smoke 前置
        # 产物检查消费（cmd/vitro_js/vitro_js.js）。
        # 全量 js 编译闸（2026-10-15 补——审阅指出缺口）：此前只编
        # cmd/vitro_js 单入口树，其余包的 js 目标编译错（如 gateway 改
        # extern "js" 面）只有 moon test --target js 的测试遍历能抓——
        # 零测试包 js 编译坏不红。全量形态与 Full native release build
        # gate 同构（js 无 C 链，冷态成本远低于 native 全量）。
        shell: bash
        run: cd moonbit && moon build --release --target js
      - name: Upload build products (native release exe set + wasm module + js entry)
        if: always()
        # 拆批基建（2026-10-11 闸级 job 化）：release 全量构建产物供下游
        # gates-diff / gates-native / gates-wasm / demo 消费——四个 job 免重复
        # 构建（此前 core 串行一步红全断；闸间遮挡即此形态）。download 侧
        # path=moonbit/_build 还原相对布局（脚本内置路径零改动）。
        uses: actions/upload-artifact@v4
        with:
          name: build-products
          path: |
            moonbit/_build/native/release/build/**/*.exe
            moonbit/_build/wasm-gc/release/build/gateway/wasm/wasm.wasm
            moonbit/_build/js/release/build/cmd/vitro_js/vitro_js.js
            moonbit/_build/js/release/build/cmd/vitro_wasm/vitro_wasm.js
            moonbit/_build/js/release/build/teaching/langpack/langpack.js
          retention-days: 3
  gates-diff:
    name: Diff gate (${{ matrix.driver }})
    needs: build-artifacts
    runs-on: windows-latest
    strategy:
      # 闸级可见性全开：六实例互不取消（一红不见其余）。
      # exe 需求分两类（2026-10-11 校正）：parser/lexer/typeck/codegen 四家
      # 驱动内部 `moon run --target native cmd/dump_*` 现场构建（只要 moon
      # 在 PATH，自建增量 2-4 分钟并行无妨）；vm_diff / clang_direct 读
      # release 路径 cmd/run exe（全量构建分钟级——消费 artifact 免重复）。
      fail-fast: false
      matrix:
        include:
          - driver: parser_diff
            needs_artifact: false
          - driver: lexer_diff
            needs_artifact: false
          - driver: typeck_diff
            needs_artifact: false
          - driver: codegen_diff
            needs_artifact: false
          - driver: vm_diff
            needs_artifact: true
          - driver: clang_direct
            needs_artifact: true
          # realcode 仓内语料对拍（2026-10-24 接线批）：-corpus 全量真跑
          # （Clang+gcc 分桶 + serve 三方）后与在库 gold 逐字段对账——77 语料
          # 此前只有 -check 静态闸（运行时防线为零）。moon 现场构建 serve
          # 同 parser_diff 四家形态（needs_artifact: false）。
          - driver: realcode_corpus
            needs_artifact: false
    steps:
      - uses: actions/checkout@v4
      # #273 批（2026-10-25）：diff_gate 与 realcode 勘探均已切 .mts（node 直跑）
      # ——node 版本走 .node-version 单点（type stripping 需 ≥22.18，不 pin 会
      # 随 runner 预装漂移）。
      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install MoonBit toolchain (driver-embedded moon run)
        if: ${{ !matrix.needs_artifact }}
        uses: ./.github/actions/setup-moonbit
      - uses: actions/download-artifact@v4
        if: ${{ matrix.needs_artifact }}
        with:
          name: build-products
          path: moonbit/_build
      - name: Clang version (for cache key)
        id: clangver
        shell: bash
        run: echo "value=$(clang --version | head -n1 | tr -d ' ' | cut -c1-48)" >> "$GITHUB_OUTPUT"

      - name: Cache Clang golden results
        uses: actions/cache@v4
        with:
          path: |
            .clang_cache_cd
          # key 含驱动脚本哈希：缓存 schema/口径变化时整体失效。
          # #273 迁移批（2026-10-25）：clang_direct 主驱动已 .mts（node 直跑），
          # key 取 main.mts + internal 双语侧（.mts 现役 / .go 回退面）+
          # diff_gate TS 源码——回退面变更同样影响口径可比性。
          key: clang-golden-${{ runner.os }}-${{ steps.clangver.outputs.value }}-${{ hashFiles('scripts/clang_direct/main.mts', 'scripts/clang_direct/main.go', 'scripts/internal/**/*.go', 'scripts/internal/**/*.mts', 'scripts/diff_gate/**/*.mts') }}
          restore-keys: |
            clang-golden-${{ runner.os }}-${{ steps.clangver.outputs.value }}-

      # D5 语言迁移最后一站（2026-09-13）：C 影子验证主驱动 Python→Go。
      # 双轨对账 PASS（663 用例集合/顺序/逐用例 diff_type/summary/category_frequency
      # 全一致）后切换；Python 版 shadow_verify.py 已退役删除。
      # === 工序④删区批（2026-10-05）：Rust 臂整体移除 ===
      # 被删 = Rust 本体（build/test/clippy/coverage）+ 被测物为 Rust DLL 的防线（shadow ×2/
      # serve smoke Rust 臂）+ 断言对象为 oracle 的（replay/three-tier/C-ABI/wasm32/freeze 新鲜度闸）。
      # 差分五驱动自动降级 --golden 冻结基线；protocol_frames 保 mb 单臂帧基线；
      # 语义防线 = clang_direct（真值 Clang）+ moon test。
      # === #273 批（2026-10-23）：差分五驱动 Go→TS 切换 ===
      # 五驱动 .mts 双轨版与 Go 版逐位对拍互证后切 CI 引用（lexer 976 /
      # typeck 487+1 / parser 487+1+三合成模式 / vm 733/733 三通道 /
      # codegen 487+80+138+20+6，全部与 Go 版一致）。入口 =
      # scripts/diff_gate/main.mts <target>（target = driver 去掉 _diff 后缀）。
      # TS 版零第三方依赖（只用 node 内置 + scripts/internal/*.mts），故本 job
      # 不需要 npm ci；node 由 runner 自带。Go 版 diff 驱动已于 2026-10-24 删除
      # （scripts/*_diff/main.go 全删，目录仅存冻结 golden 与台账数据）。
      - name: Run diff driver (full four corpora)
        shell: bash
        run: |
          case "${{ matrix.driver }}" in
            parser_diff|lexer_diff|typeck_diff|codegen_diff)
              # 套件级红遮红治理（2026-10-18）：set -e 下 for 首套件红即断，
              # 其余套件健康面全盲（lexer_diff baseline 断供轮 knr/leetcode/
              # gap 三套件 skipped 实锤）。改累计失败：四套件全跑完再退出
              # 非零——单套件红仍 job 红（闸强度不变），多套件红一屏尽收。
              rc=0
              # llm_scale（2026-10-21 接线）：千行单文件语料——结构面规模
              # 压力源（1082–1627 行/文件；#193/#201/#238 类缺陷正是小语料
              # 写不出的形态）。llm_multifile 不进本循环——多文件工程的跨
              # 文件引用对逐文件结构面无意义，其覆盖面归 clang_direct 工程
              # 模式（#237）。
              t="${{ matrix.driver }}"; t="${t%_diff}"
              # chibicc_port（#437 语料扩充窗口 2026-11-03 入库批）：chibicc
              # 外部基准 port 桶——同四闸结构面循环。
              for c in baseline knr leetcode gap llm_scale chibicc_port; do
                node scripts/diff_gate/main.mts "$t" "corpus/$c" || rc=1
              done
              # codegen_skeleton 节接线（2026-11-01 审阅 v2 S05-C4）：该语料只
              # 进 codegen golden（其余三闸 golden 无此节，不能进公共循环）——
              # 冻结后从未被任何闸消费，13 例零防腐化；接线恢复「冻结即有主」。
              if [ "${{ matrix.driver }}" = "codegen_diff" ]; then
                node scripts/diff_gate/main.mts codegen "corpus/codegen_skeleton" || rc=1
              fi
              exit $rc
              ;;
            vm_diff)
              node scripts/diff_gate/main.mts vm
              ;;
            clang_direct)
              # 2026-10-25 #273 迁移批：Go→.mts（双跑对拍通过），CI 引用切 TS。
              node scripts/clang_direct/main.mts
              ;;
            realcode_corpus)
              # 仓内语料批运行时对拍（#273 迁移批 2026-10-25）：勘探与对账
              # 均已切 TS（main.mts 内嵌 gold 对账 + compare_gold.mts 独立判红，
              # 双跑逐位互证）。
              node scripts/realcode_diff/main.mts -corpus chibicc -out tmp/rc_ci_chibicc
              node scripts/realcode_diff/main.mts -corpus multifile -out tmp/rc_ci_multifile
              node scripts/realcode_diff/compare_gold.mts chibicc tmp/rc_ci_chibicc/result.json
              node scripts/realcode_diff/compare_gold.mts multifile tmp/rc_ci_multifile/result.json
              ;;
          esac
  corpus-fuzz:
    name: Adversarial corpus fuzz (mutated corpus vs clang, baseline-locked)
    needs: build-artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-products
          path: moonbit/_build
      # ── 对抗分叉防线（2026-10-18 立项，用户拍板制度化）──────────
      # 存量语料 × 语义靶制变异算子（rules.json 单源；等价变换类 + 已修复
      # 面定向类——机械数值盲改类已按用户拍板剔除）三方对拍（clang × js ×
      # native）。指纹基线 fuzz_baseline.json 入库锁定：新指纹/桶恶化红，
      # 已知未修病条目带 issue 标注归档。CI 动态生成变体不落库（本地缓存
      # .corpus_fuzz_cache/ gitignored）。
      #
      # 判定缓存（#309 P0，2026-10-25）：bucket 是 (变体源, clang, 双臂引擎,
      # 壳, 判定口径, node 宿主) 的确定性函数——epoch 键七组件 hash（脚本内
      # 单源计算），命中即跳过三方进程对拍。引擎未变批（文档/脚本）8.7m →
      # ~1m。cache key 含引擎双产物 hash + clang 版本 + 驱动源（复用 clang
      # golden 方案 A 的双闸形态）：第一道闸 = key 组件变化自动失效；第二道
      # 闸 = 夜间 schedule 轮 CF_JUDGE_REFRESH=1 全量重算覆写防缓存腐化。
      # node 走 .node-version 单点（本 job 直跑 .mts type stripping 需
      # ≥22.18；预装 node 漂移既破坏 type stripping 又让 epoch 换血——单点后
      # 两者都稳）。
      - name: Install Node (fuzz gate driver)
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Clang version (for judge cache key)
        id: clangver
        shell: bash
        run: echo "value=$(clang --version | head -n1 | tr -d ' ' | cut -c1-48)" >> "$GITHUB_OUTPUT"
      - name: Engine hashes (for judge cache key)
        id: eng
        shell: bash
        run: |
          cd moonbit/_build
          h="$(sha256sum native/release/build/cmd/run/run.exe js/release/build/cmd/vitro_js/vitro_js.js | sha256sum | cut -c1-24)"
          echo "value=$h" >> "$GITHUB_OUTPUT"
      - name: Cache fuzz judge results
        uses: actions/cache@v4
        with:
          path: .corpus_fuzz_judge
          key: fuzz-judge-${{ runner.os }}-${{ steps.clangver.outputs.value }}-${{ steps.eng.outputs.value }}-${{ hashFiles('scripts/corpus_fuzz/main.mts', 'scripts/corpus_fuzz/rules.json') }}
          restore-keys: |
            fuzz-judge-${{ runner.os }}-${{ steps.clangver.outputs.value }}-
      - name: Run corpus fuzz gate (baseline check)
        shell: bash
        env:
          # 夜间 schedule 轮无视缓存全量重算覆写（防腐化第二道闸）；手动
          # dispatch 可勾选 refresh 强制重算（PR #310 审阅 P3-4 逃生门——
          # inputs 上下文仅在 workflow_dispatch 事件有值，push/PR 轮恒空）；
          # 常规 push/PR 轮空值 = 默认启用缓存。
          CF_JUDGE_REFRESH: ${{ (github.event_name == 'schedule' || inputs.refresh == true) && '1' || '' }}
        run: |
          node scripts/corpus_fuzz/main.mts

  gates-native:
    name: Native protocol & parity gates (consume exe)
    needs: build-artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # #273 接线批（2026-10-24）：annotation 对拍已切 .mts（node 直跑）——node
      # 版本走 .node-version 单点（type stripping 需 ≥22.18，不 pin 会随 runner
      # 预装漂移）。
      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      # ── gen_api_help rules.json（#125 收尾，2026-10-15）───────────
      # gen_api_help 内容批收敛后随 jsonmbt 退场翻转出库——本 job 原首装
      # （rules.json regen 前置）已无消费者成死安装（审阅 P3-1，2026-10-30
      # 处置批删）；工具链安装统一由下方 download-artifact 后的安装步承担。

      - uses: actions/download-artifact@v4
        with:
          name: build-products
          path: moonbit/_build
      - name: Install MoonBit toolchain
        uses: ./.github/actions/setup-moonbit

      - name: libc bootstrap parity (MoonBit library mode vs golden digest)
        # 2026-09-22 S5 尾项『libc 自举』接线：命题是「MoonBit 引擎能否编译
        # 自己的标准库 C 源，且产物与冻结 golden digest 一致」（Rust oracle
        # 已随工序④删区退役——oracle 缺失时自动切 golden 基线比，判定器内
        # [裁判切换] 横幅明示；正确性主锚仍为 Clang）。投影到 9 个交集字段
        # 比对（含 code 段逐指令）。J9 证红：注入 code[1].operand +1 必红。
        # moon 与构建缓存，artifact-free 的 exclusive 目标在此最省）。
        shell: bash
        run: |
          node scripts/moonbit/libc_boot_diff/main.mts

      - name: Protocol first consumer (fields-level validation on real engine output)
        # 2026-09-22 接线（架构审阅 v2 A 组 #10 / §8.5「第一个消费者跑通」）：
        # 用**生成的**协议面（moonbit/bindings/ts/fields.mjs）消费**真实的**引擎输出
        # （cmd/serve 的 step 流——MoonBit 侧同协议现役实现），逐字段校验 +
        # 最小内容层渲染。
        # 审阅 P1（2026-10-05）：本步此前零前置构建——consumer 缺省引擎路径
        # 在干净检出上必红（本地被历史 release 产物掩盖，D1 问四+问五叠加）。
        # 现自带 debug 构建（与 protocol_frames 同款产物形态与位置）。
        # **限制（诚实登记）**：本环境无 npm/tsc，故只能验「生成物描述得了真实输出」，
        # 验不了「字段名写错在 tsc 编译期即红」——后者是 TS 的核心收益，待 tsc 就绪。
        shell: bash
        run: |
          cd moonbit && MOON_CC=clang moon build --target native cmd/serve && cd ..
          node moonbit/bindings/ts/consumer.mjs

      # serve 协议帧字段级冻结（S7 批四号交付物第三件，2026-10-04 兑现）：
      # 固定请求序列 × 双宿主（release vitro_cli + cmd/serve）→ canonicalize
      # → mask（已知分叉外置 rules.json）→ 与入库基线 baseline.jsonl 逐帧
      # 比对。差分性质（消费 oracle 臂）——归 core 随 Rust 退役转单臂基线比
      # （退役时删 rust 臂采集段即成）。前置：release vitro_cli（上一步）+
      # moonbit cmd/serve（本步自建 debug 形态，与 moonbit job 同产物）。
      - name: Protocol frames freeze (canonicalized baseline)
        run: |
          cd moonbit && MOON_CC=clang moon build --target native cmd/serve && cd ..
          node scripts/protocol_frames/main.mts
        shell: bash

      # G2（R4）：出口 2 守护——wasm32 构建 + Node 冒烟（ABI 导出 + capi 全链路，
      # 纯 stdout 通道断言；wasm-bindgen 占位导入以 Proxy 桩通过）
      - name: MoonBit serve smoke (single host)
        run: |
          cd moonbit && MOON_CC=clang moon build --target native cmd/serve && cd ..
          node scripts/serve_smoke/main.mts -moonbit
        shell: bash

      # replay MoonBit 臂（S7 批四号留批义务兑现，2026-10-04）：S1–S5 帧序列
      # 断言全集跑 cmd/serve（同一断言集，豁免面 scripts/replay/
      # moonbit_exemptions.json——主跑即审计：PASS 即 ZOMBIE 红防僵尸）。
      # 复用上一步构建的同一 exe（debug 路径零重建）；Rust 臂在 core job。
      - name: replay S1-S5 protocol assertions (MoonBit arm)
        run: |
          node scripts/replay/replay_s1_s5.mts -moonbit
        shell: bash

      # S8 teaching 批四号（2026-10-01）：算法标注族级增量对拍——MoonBit
      # cmd/serve 与 Rust golden（algorithm_annotations_v3.json）的首现序列
      # 比对（compile→run→step.begin→step.next×4000；只比已迁移族——
      # rules.json 外置迁移集+豁免面；双向模板集断言；serve exe 由上一步
      # 构建）。J9 双路证红：golden desc 篡改 → exit 1（连锁红）；
      # step_budget 40 → exit 1（首现缺失）。
      - name: Teaching annotation diff (family-incremental golden, Exit 1)
        run: node scripts/teaching_annotation_diff/main.mts
        shell: bash

      # B11 教学真值源对拍（issue #435，2026-11-02）：annotation_diff 锁当前
      # 行为（防回归——golden 是 Vitro 自证历史快照），本闸锁真值——期望 =
      # 算术事实/帧状态可推导标注（cases/*/expect.json），已知失真面
      # known_divergences.json 显式豁免（失败命中 = EXPECTED_RED 放行、未登记
      # 红 = RED、豁免未命中 = ZOMBIE 红）。selftest = J9 双步：① j9 锚条目
      # （若非空）无豁免跑必须全部红 ② 有豁免跑零红零僵尸；B12/#436 翻面
      # 后语料级红例 0 条——牙证由原语自检（合成 fixture 逐原语证红）承担。
      # serve exe 复用上一步构建（ensureFresh 兜底）。
      - name: Teaching truth gate (engine-behavior ground truth, Exit 1)
        run: node scripts/teaching_truth/main.mts --selftest
        shell: bash

      # step 帧流不变量检查器（过程语义防线，moon_prove 试点报告 §8.2 方案 B，
      # 2026-11-04；PR #478 审阅处置批 P1-1/P1-2 同日）：`vitro step --json`
      # NDJSON 逐帧断言四条语义不变量（内存视图域/栈深/cursor 连续/指针四态）
      # + 帧流结构契约（ST2 含形状断言——发射层退化防线）。双档：
      # PR 轮 spot 抽样 --sample 60 --step-budget 20000（大语料步数预算封顶
      # 换墙钟——19 个跑到 10 万步上限的语料 stride 命中时单例 300s 量级，
      # 截断流仍是合法检查面）；夜间 schedule 轮全量无预算 + --audit-known
      # 白名单僵尸审计。超时两轮预算（挂起复现率 ~0.2%/spawn 复跑即解，
      # 两轮尽单列 timeout 不计红——预算问题与防线违例分账）。白名单
      # known_violations.json 三态 + count 恶化检测（RED/EXPECTED_RED/ZOMBIE）。
      # js 臂壳现场构建（ensureFresh 只兜陈旧不兜缺失）。
      - name: Step invariant gate (per-frame runtime invariants)
        run: |
          cd moonbit && MOON_CC=clang moon build --release --target js cmd/vitro_js && cd ..
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/step_invariant/main.mts --corpus corpus --jobs 8 --timeout-ms 600000 --audit-known
          else
            node scripts/step_invariant/main.mts --corpus corpus --sample 60 --jobs 8 --timeout-ms 600000 --step-budget 20000
          fi
        shell: bash

      # ── wasm-gc / demo 闸族（产物复用链内构建）────────────────────────
      # 注-步错位修正（2026-11-01 审阅 v2 R1e-Y4）：本段三块注释曾整体上移
      # 一位（D19 审计注挂在 teaching 步、wasm 冒烟注挂在豁免审计步、S8
      # teaching 注孤儿悬于 job 尾）——已归位；原 S7 批五号 wasm-gc 出口冒烟
      # 注为孤儿删除（该防线现役形态 = gates-wasm serve_channel 的
      # host.js 冒烟步及其 R4 注释，信息无损失）。
      # 豁免面僵尸审计（D19，2026-10-01 审阅 P2 处方）：豁免全部失效真跑
      # 一轮——原豁免条目 PASS/未触达即僵尸红，FAIL=合法豁免。J9 留痕：
      # 注入假豁免（真 PASS 断言）→ ZOMBIE(PASS) exit 1；净表 exit 0。
      - name: MoonBit exemption audit (zombie detector, D19)
        run: node scripts/serve_smoke/main.mts -moonbit -audit-exemptions
        shell: bash

  gates-wasm:
    name: wasm-arm gate (${{ matrix.slice }})
    needs: build-artifacts
    runs-on: windows-latest
    strategy:
      # 闸级可见性全开：四实例互不取消（一红不见其余）——gates-diff 同款
      # 治理线收口（2026-10-17）：原单 job 串行十步，实锤 clang_direct wasm
      # 臂红 → serve 通道四臂全 skipped（红被前面的红吞掉）。拆分后各臂
      # 独立红绿；墙钟从串行和降为最重实例封顶（vm_diff wasm 全语料）。
      fail-fast: false
      matrix:
        include:
          - slice: vm_diff
          - slice: clang_direct
          - slice: cli_smoke
          - slice: serve_channel
    steps:
      - uses: actions/checkout@v4
      # setup-node pin（2026-09-29 审阅 P3-3）：js-string 内建需较新 V8；
      # host.js 判定面在 25 上定版——版本走 .node-version 单点（#132 批
      # 降 LTS 24）。体积上限由 host.js 断言（1.5MB）——数字不进注释（无锚
      # 手工数字教训）。
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install MoonBit toolchain
        uses: ./.github/actions/setup-moonbit
      - uses: actions/download-artifact@v4
        with:
          name: build-products
          path: moonbit/_build
      # protocol_frames wasm 臂读 rules.json——已随 #125 批 B 入库为真源
      # （.json.mbt 出库），本 job 的 jsonmbt clone/build/再生步随之摘除。
      # 四 slice 共享 build-products（wasm.wasm + native exe 集 +
      # vitro_js.js）；vitro_wasm.js 壳不在 artifact——由各驱动自带
      # EnsureFresh 现场建（freshness 单源，#41 毒化机判）。

      # ── slice serve_channel = host.js 冒烟（G2）+ serve 通道 wasm 臂 ──
      # host.js 冒烟（R4：出口 2 守护——wasm32 ABI 导出 + capi 全链路，
      # 纯 stdout 通道断言；wasm-bindgen 占位导入以 Proxy 桩通过）归本
      # 实例：wasm 产物本身健康的最直接哨兵，serve 四臂同消费 gateway
      # 产物（重建步保持原语义）。
      - name: wasm-gc gateway build + Node host smoke
        if: matrix.slice == 'serve_channel'
        run: |
          cd moonbit && moon build --release --target wasm-gc gateway/wasm && cd ..
          node scripts/wasm_gateway/host.mts
        shell: bash

      # 消费侧冒烟闸（审阅 v2 A8 批 refs #438，同业 wax embed-smoke 对位）：
      # 与 host.mts 分工——host 守 NDJSON 全链+trap+体积（includes 子集），
      # 本闸守**精确集**：wasm 产物 import 模块集 ⊆ 允许集 + js-string 函数
      # 集 == 基线 6 函数（宿主供给面最小性）+ export 集 == pkg_deps bridges
      # 登记（源码↔产物双向）+ 最小供给真调用；js 桥 langpack 动态 import()
      # 消费 + texts_json 载荷顶层键锚。改出口面须连坐 pkg_deps rules.json
      # bridges 与 scripts/consumer_smoke/baseline.json。J9：--selftest 三路
      # 篡改基线必红（本地实证）。
      - name: Consumer-side smoke (both bridges, exact link surface)
        if: matrix.slice == 'serve_channel'
        run: |
          cd moonbit && moon build --release --target js teaching/langpack && cd ..
          node scripts/consumer_smoke/main.mts --selftest
          node scripts/consumer_smoke/main.mts
        shell: bash

      # serve 通道 wasm 臂（#49 批三段一）：三防线被测物切统一入口壳 serve
      # 子命令——replay 61 断言 / serve_smoke 68 断言（豁免面 wasm 段臂分
      # 家）/ protocol_frames 47 帧基线（48 序列 - capabilities 结构豁免；二轮审阅 P3 补 trap step 流 14 帧——#35 trap 帧冲刷发布 + is_trapped 守卫形态帧级锚）。前置 = gateway wasm 产物 + node + 工具链（壳自建）。
      # #292 批：驱动切 .mts（wasm 臂不进对拍——ensureFresh 会重建产物，对拍状态性）
      - name: replay wasm arm (shell serve)
        if: matrix.slice == 'serve_channel'
        run: node scripts/replay/replay_s1_s5.mts --backend wasm
        shell: bash
      - name: serve_smoke wasm arm (shell serve)
        if: matrix.slice == 'serve_channel'
        run: node scripts/serve_smoke/main.mts --backend-wasm
        shell: bash
      # PR #280 审阅 P3-6（2026-10-23）：豁免表 wasm 臂段此前从不入审计面
      #（僵尸审计只跑 -moonbit 一臂——断言更名批曾靠审阅者补跑才证真）
      - name: serve_smoke wasm exemptions audit
        if: matrix.slice == 'serve_channel'
        run: node scripts/serve_smoke/main.mts --backend-wasm -audit-exemptions
        shell: bash
      - name: protocol_frames wasm arm (shell serve)
        if: matrix.slice == 'serve_channel'
        run: node scripts/protocol_frames/main.mts --backend-wasm
        shell: bash
      - name: teaching_annotation_diff wasm arm (shell serve)
        if: matrix.slice == 'serve_channel'
        run: node scripts/teaching_annotation_diff/main.mts --backend-wasm
        shell: bash
      # PR #463 审阅 P3-5：真值闸 wasm 臂——39 条真值锚不再单压 native 臂
      #（wasm 侧此前仅有 golden 防漂移；壳/产物复用上一步，ensureFresh 兜底）
      - name: teaching_truth wasm arm (shell serve)
        if: matrix.slice == 'serve_channel'
        run: node scripts/teaching_truth/main.mts --backend-wasm
        shell: bash

      # ── slice cli_smoke = 统一 CLI 入口闸 + algorithms.catalog 三方对账 ──
      # 统一 CLI 入口闸（#49 批一，2026-10-06；js 臂连坐 2026-10-15 三后端批）：
      # wasm 壳（scripts/vitro_cli/
      # main.js）四子命令 rc 契约 + **三臂同形对拍**（wasm 壳 / js / native
      # cmd/vitro exe——note 通道/TRAP 文本/标记行协议逐行一致，零 canonicalize
      # 特例；唯一剥离 = backend 标注行）+ launcher 双形态语义。J9 证红：篡改壳
      # note 前缀 → B 组对拍红（已留痕）。前置 = gateway wasm 产物
      # （artifact）+ 本步自建 cmd/vitro native exe（纪律 11 MOON_CC=clang）
      # + Go + node（上方公共步）。
      - name: unified CLI smoke (三臂同形：wasm shell / js / native exe)
        if: matrix.slice == 'cli_smoke'
        run: |
          cd moonbit && MOON_CC=clang moon build --release --target native cmd/vitro && MOON_CC=clang moon build --release --target native cmd/serve && cd ..
          node scripts/vitro_cli_smoke/main.mts --corpus 30
        shell: bash

