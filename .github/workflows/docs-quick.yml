# docs 快速反馈（2026-10-15 建，三后端批 CI 重设计）：
# 与主 CI（ci.yml 恒全量）完全解耦的**增量**薄通道——纯记账面 push 时
# GitHub 原生 paths 过滤只在**本 workflow** 触发（主 CI 照常全跑，无
# changes-job 单点——10da06a6 的 changes 分类器形态已废：分类器误判/
# skip 字样误伤即全防线蒸发，moonbitlang 生态考察证实主流形态是
# on.paths 原生过滤或干脆恒全量）。
#
# 本文件只含文档记账闸（facts/doc 预览类），快通道 ~2 分钟；代码面
# push 由 ci.yml 全量承接。**这个文件红不阻塞主 CI**（两 workflow 独立）。
name: docs-quick

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - '**.md'
      - '.agents/**'
      - '**.svg'
      - '.editorconfig'
  workflow_dispatch:

jobs:
  docs-gates:
    name: Docs bookkeeping gates (fast path)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      # 步骤名与判定面诚实登记（2026-11-01 审阅 v2 S13b-P9/R1e-R1 修复）：
      # 本薄通道 fresh 检出态无 reports/facts.json（gitignored），裸 check 只判
      # 坏引用/冻结行，N 处待采集键静默跳过（探针实证 rc=0、--strict 同环境
      # rc=1）——「数字=机器真值」对账归主 CI bookkeeping 的 --run --strict
      # 单点（#298 治本形态，run 40409823786 假绿实锤）。不要把本步改回
      # doc-truth 命名，除非同时接采集链（装 moon + --run）。
      - name: Docs link & frozen-line audit (number-truth audit 归主 CI --strict)
        run: node scripts/facts/main.mts check
      - name: Agent skills frontmatter audit (install_skills --list)
        run: node .agents/install_skills.mts --list
      # gen_svg -check 不入本薄通道：它读 teaching_annotation_diff/rules.json
      #（jsonmbt 再生域，主 CI static-gates 有三步再生链；薄通道不装 jsonmbt——
      # 首跑实锤缺文件红）。SVG 涉及面归主 CI。
