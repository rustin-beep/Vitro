  <rect class="bg" width="1200" height="940"/>
<text class="tt" x="600" y="56" text-anchor="middle">StepPayload Schema v0.1 · 单步快照帧</text>
<text class="tm" x="600" y="94" text-anchor="middle">已冻结（2026-09-12 · S1–S5 签字回放 61/61）· 语言中立，任何语言按此解析步数据，无需了解 Rust 内部表示</text>
<text class="tc" x="600" y="138" text-anchor="middle">（同一语义）出口：capi vitro_step_next_json · vitro_get_step_payloads_json(session, start, end) · serve NDJSON · wasm 绑定</text>
<rect class="core" x="40" y="174" width="720" height="638" rx="14"/>
<text class="ts" x="64" y="204" text-anchor="start">StepPayload（单步快照 · 14 顶层字段）</text>
<text class="tc" x="64" y="234" text-anchor="start">── 步定位 ──</text>
<text class="ts" x="64" y="258" text-anchor="start">step_index</text>
<text class="tc" x="280" y="258" text-anchor="start">int32 · 步号 0 起；一步 = 一条字节码指令</text>
<text class="ts" x="64" y="282" text-anchor="start">code_line</text>
<text class="tc" x="280" y="282" text-anchor="start">int32 · 源码行 1 起（0 = 无源码行）</text>
<text class="ts" x="64" y="306" text-anchor="start">func_name</text>
<text class="tc" x="280" y="306" text-anchor="start">string · 教学可读名（main / bubble_sort）</text>
<text class="ts" x="64" y="330" text-anchor="start">semantic_label</text>
<text class="tc" x="280" y="330" text-anchor="start">string · 行 + 值推断的教学语义标签</text>
<text class="tc" x="64" y="362" text-anchor="start">── 教学快照 ──</text>
<text class="ts" x="64" y="386" text-anchor="start">local_vars</text>
<text class="tc" x="280" y="386" text-anchor="start">ApiVariableSnapshot[] · 当前作用域变量</text>
<text class="ts" x="64" y="410" text-anchor="start">call_stack</text>
<text class="tc" x="280" y="410" text-anchor="start">ApiFrameInfo[] · 自底向上，末元素 = 当前帧</text>
<text class="ts" x="64" y="434" text-anchor="start">array_snapshots</text>
<text class="tc" x="280" y="434" text-anchor="start">ArraySnapshot[] · 元素上限 256，超出 truncated</text>
<text class="ts" x="64" y="458" text-anchor="start">pointer_snapshots</text>
<text class="tc" x="280" y="458" text-anchor="start">PointerSnapshot[] · 四状态见右侧</text>
<text class="tc" x="64" y="490" text-anchor="start">── 行为与事件 ──</text>
<text class="ts" x="64" y="514" text-anchor="start">vis_events</text>
<text class="tc" x="280" y="514" text-anchor="start">VisEvent[] · 取走式：同一步不重复投递</text>
<text class="ts" x="64" y="538" text-anchor="start">heatmap_*</text>
<text class="tc" x="280" y="538" text-anchor="start">heatmap_line + heatmap_count · 该行累计执行次数</text>
<text class="ts" x="64" y="562" text-anchor="start">accessed_vars</text>
<text class="tc" x="280" y="562" text-anchor="start">AccessedVar[] · 本步读写的变量</text>
<text class="tc" x="64" y="594" text-anchor="start">── 可空（JSON null）──</text>
<text class="ts" x="64" y="618" text-anchor="start">algorithm_step</text>
<text class="tc" x="280" y="618" text-anchor="start">AlgorithmStepSnapshot? · 未命中算法模板 = null</text>
<text class="ts" x="64" y="642" text-anchor="start">root_cause_hint</text>
<text class="tc" x="280" y="642" text-anchor="start">RootCauseHint? · 无运行时陷阱 = null</text>
<text class="tc" x="64" y="690" text-anchor="start">多文件会话：code_line / heatmap_line 为合并源码全局行号（§8 #9）</text>
<text class="tc" x="64" y="716" text-anchor="start">地址：1MB 线性内存内 u32（0x1000 全局区起 · 0x5000 堆起 · 栈自高向下）</text>
<text class="tc" x="64" y="742" text-anchor="start">可空 = null；消费方须同时容忍字段缺省（新字段可不出现在旧数据）</text>
<text class="tc" x="64" y="768" text-anchor="start">枚举取值为字符串字面量，大小写敏感（"Valid" / "Read"）</text>
<rect class="card" x="800" y="174" width="370" height="156" rx="12"/>
<text class="t" x="985" y="204" text-anchor="middle">pointer 四状态（§3.1）</text>
<text class="tc" x="820" y="234" text-anchor="start">Valid 有效</text>
<text class="tc" x="820" y="260" text-anchor="start">Freed 已释放（判定依赖隔离区）</text>
<text class="tc" x="820" y="286" text-anchor="start">Null 空指针</text>
<text class="tc" x="820" y="312" text-anchor="start">Dangling 悬垂</text>
<rect class="card" x="800" y="350" width="370" height="170" rx="12"/>
<text class="t" x="985" y="382" text-anchor="middle">frameCache 窗口语义（§4）</text>
<text class="tc" x="820" y="412" text-anchor="start">payload.get(start, end)：窗口内 O(1)</text>
<text class="tc" x="820" y="438" text-anchor="start">越窗 seek：Checkpoint 恢复 + 正向重放</text>
<text class="tc" x="820" y="464" text-anchor="start">seek 第 N 步 → 五视图以第 N 步快照为准</text>
<text class="tc" x="820" y="490" text-anchor="start">（消费方整体重绘，无需自行回退状态）</text>
<rect class="card" x="800" y="540" width="370" height="170" rx="12"/>
<text class="t" x="985" y="572" text-anchor="middle">差分编码与版本纪律（§5 / §9）</text>
<text class="tc" x="820" y="602" text-anchor="start">StepStreamBatch / Delta 字段级差分</text>
<text class="tc" x="820" y="628" text-anchor="start">解码不变量：delta 后与全量逐字段相等</text>
<text class="tc" x="820" y="654" text-anchor="start">字段只增不改语义；新增字段可空 / 有默认</text>
<text class="tc" x="820" y="680" text-anchor="start">废弃走双写过渡期；版本 abi + engine</text>
<rect class="zone" x="800" y="730" width="370" height="104" rx="12"/>
<text class="t" x="985" y="760" text-anchor="middle">消费方</text>
<text class="tc" x="820" y="788" text-anchor="start">capi 第一批 · vitro_cli serve · wasm 绑定</text>
<text class="tc" x="820" y="812" text-anchor="start">任何第三方语言按本 schema 自行解析</text>
<text class="tc" x="600" y="852" text-anchor="middle">实现锚：unified/{types,collector,engine,stream,contracts,vocabulary}.rs · capi/first_batch.rs（出口序列化）</text>
<text class="tc" x="600" y="878" text-anchor="middle">对账 docs/spec/STEP_PAYLOAD_SCHEMA_V0_1.md §0–§5 · 漂移重生成：go run ./scripts/gen_svg protocol</text>
<text class="tc" x="600" y="904" text-anchor="middle">步号约定：step_index 从 0 起；一步 = VM 执行一条字节码指令（含透明 StepEvent 调试指令）</text>
</svg>
