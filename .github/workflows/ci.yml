  arm4-wasmtime:
    name: 4th-arm wasmtime parity (gateway wasm x Cranelift vs V8)
    needs: build-artifacts
    runs-on: windows-latest
    # 冷编 wasmtime 50（release，cache 命中后秒级）+ corpus deep-nomem 双侧
    #（本地 wasmtime 65s/node 21s）+ synth 基线轮——**CI 全量档实测 391s**
    #（run 933，2026-11-03，含冷编）<8min 目标，单档全量不降双档。跑器 wasm 栈
    # 默认 2MiB（arm4 全量批起，与 V8 预算面对齐——synth 梯度 4000=AGREE /
    # 6000=TRAP_BOTH 锚定，#421 预算型 TRAP_ONE 消失）。驱动级单侧护栏
    # --timeout-ms 默认 900s（挂死早红而非拖到 job 超时）。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          name: build-products
          path: moonbit/_build
      # 产物含 wasmopt 后的 wasm.wasm（build-artifacts 步）；本 job 无需 moon。
      # rust：windows-latest 预装 stable；镜像回退时 rustup 就地装 stable 兜底，
      # 并断言 ≥ MSRV 1.97（wasmtime 50.0.1）——fail loud 而非静默用旧链（审阅 P3-2；
      # 不引第三方 action，与仓内「actions/* + 本地 composite」白名单口径一致）。
      - name: Rust toolchain (预装 stable；缺则 rustup 装；MSRV 断言)
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            rustup toolchain install stable --profile minimal && rustup default stable
          fi
          rustc --version && cargo --version
          v=$(rustc --version | sed -E 's/^rustc ([0-9]+)\.([0-9]+).*/\1 \2/')
          set -- $v
          if [ "$1" -lt 1 ] || { [ "$1" -eq 1 ] && [ "$2" -lt 97 ]; }; then
            echo "::error::rustc $1.$2 < MSRV 1.97（wasmtime 50.0.1）"; exit 1
          fi
        shell: bash
      - name: Cache cargo registry + wasmtime_arm target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            scripts/wasmtime_arm/rs/target
          key: w4-cargo-${{ runner.os }}-${{ hashFiles('scripts/wasmtime_arm/rs/Cargo.lock') }}-${{ hashFiles('scripts/wasmtime_arm/rs/src/main.rs') }}
          restore-keys: |
            w4-cargo-${{ runner.os }}-${{ hashFiles('scripts/wasmtime_arm/rs/Cargo.lock') }}-
      - name: Build wasmtime_arm runner
        env:
          CARGO_INCREMENTAL: "0"
        run: cd scripts/wasmtime_arm/rs && cargo build --release --locked
        shell: bash
      # corpus 全量（--all = corpus 根目录全集枚举，含 llm_multifile 工程模式；run 6 帧
      # 扩展为 deep-nomem 21 帧：dump 族/step 族/memory.regions/vfs 面）——严格逐位
      #（identical），零 DIFF/TRAP/CASCADE 才绿；--expect-min 锁对拍面下限（审阅
      # P2-5：两侧皆空也 identical——语料目录/路径变动致抽样塌缩须红）。下限 =
      # 2026-11-02 全集 977 cases / 21,490 帧（语料只增不减；新增目录自动入集）。
      - name: 4th-arm corpus parity (deep-nomem, strict identical, floor-locked)
        run: node scripts/wasmtime_arm/main.mts all --profile deep-nomem --all --out tmp/w4ci/corpus --expect-min-cases 977 --expect-min-frames 21490
        shell: bash
      # 对抗集（栈梯度/lone surrogate/大输入/fail-loud 帧域；deep-nomem 含 dump 族——
      # #418 回归面）——行为基线锁定（scripts/wasmtime_arm/synth_baseline.json；
      # DIFF 恒红、恶化/未登记/僵尸/改善红——重冻走 --freeze-baseline，J9 三形态
      # 篡改证红）。基线 2026-11-03 随跑器栈默认 2MiB 化重冻：struct_nest_1500/
      # 2000/3000/4000 TRAP_ONE→AGREE（#421 预算型分叉消失），梯度锚 4000=AGREE /
      # 6000=TRAP_BOTH（两侧临界不重合：V8∈(4000,5000]、wasmtime∈(5000,6000]，
      # 5000 档勿加——必 TRAP_ONE）。每 case 首帧实例复位（两侧同起点，CASCADE
      # 面归零——审阅 P2-3）。
      - name: 4th-arm synth adversarial (deep-nomem, baseline-locked)
        run: node scripts/wasmtime_arm/main.mts all --profile deep-nomem --synth --baseline scripts/wasmtime_arm/synth_baseline.json --out tmp/w4ci/synth
        shell: bash
  static-gates:
    # 二轮审阅 P2（2026-10-17）：红遮红治理——27 步单 job 串行，一步红
    # 后续全 skipped（surface 红曾遮 single_source/testcount 至 HEAD）。
    # 拆 matrix 三片（gates-wasm 2026-10-17 同款治理线）：gen=生成器新鲜
    # 度 / contract=结构契约与卫生 / bookkeeping=需 moon test 的对账闸。
    # 步骤级 if 路由（setup 三片共享），fail-fast 关保闸级可见性全开。
    name: Static gates (${{ matrix.slice }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: gen
          - slice: contract
          - slice: bookkeeping
    steps:
      - uses: actions/checkout@v4
      # #273 接线批（2026-10-24）：gen/contract slice 已跑 .mts 闸
      # （教学线 teaching_* / host_contract_map / icon_catalog / diff_ledger）——
      # node 版本走 .node-version 单点（type stripping 需 ≥22.18；不 pin 会随
